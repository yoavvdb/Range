<title>Range Mobility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: phone-app column (max 480px) — home carousel, step-by-step protocol builder, full-screen guided player. Deliberately dark-only, like a gym-floor app. */
:root{
  --ts:1; /* text scale: follows the iPhone's Text Size setting (set at launch) */
  /* fitribe palette: coal and ash, bone text, amber for state, ember/orange/tan/sand for the cards */
  --bg:#0D0B09;--surface:#1B1815;--surface2:#26221D;--line:#34302A;
  --ink:#EDE4D6;--muted:#A2978A;--accent:#F6B43A;--accent-ink:#1B1206;--accent-soft:#2E2414;
  --chalk:#EDE4D6;--chalk-ink:#100E0C;
  --p-red:#E5481A;--p-blue:#C99B6B;--p-yellow:#F6B43A;--p-green:#F28B15;--p-white:#E9E2D3;
  --r-hero:24px;--r-panel:18px;--r-ctl:14px;
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --warn:#F28B15;--bad:#F07167;--good:#4CC38A;
  --fig:#D5DCE5;--fig-torso:#EEF2F6;--fig-far:#5A6373;--fig-prop:#A3ACB9;--fig-prop-hi:#4F5968;--fig-floor:#C3CAD4;
  --fig-skin:#EDC4A6;--fig-skin2:#D6A584;--fig-shirt:#D8473A;--fig-shirt2:#93281F;--fig-shorts:#5C3A6E;--fig-shorts2:#35223F;--fig-hair:#1D1A22;--fig-shoe:#3A2442;--fig-shoe2:#241628;--fig-hl:#E5481A;--fig-ghost:#2B3442;--fig-arrow:#C23A12;--stage:linear-gradient(180deg,#F1F3F6,#E2E7ED);
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-fig="mannequin"]{--stage:radial-gradient(ellipse at 50% 30%,#FFFFFF,#D9DFE6 80%);--fig-hl:#FF6A3D;--fig-arrow:#FF6A3D}
:root[data-fig="gymkit"]{--stage:linear-gradient(180deg,#EEF0F2,#D7DBE0);--fig-skin:#C68B63;--fig-skin2:#A8704C;--fig-shirt:#1F2329;--fig-shirt2:#121418;--fig-shorts:#6B7380;--fig-shorts2:#4A505A;--fig-shoe:#F4F5F7;--fig-shoe2:#C9CDD3;--fig-hair:#16120F;--fig-hl:#E5481A}
:root[data-fig="xray"]{--stage:radial-gradient(ellipse at 50% 35%,#17243B,#070B14 80%);--fig-hl:#FF4D6D;--fig-arrow:#FF4D6D}
:root[data-fig="anatomy"]{--fig-skin:#C4C9CF;--fig-skin2:#8B9199;--fig-shirt:#C4C9CF;--fig-shirt2:#8B9199;--fig-shorts:#5B6169;--fig-shorts2:#41464D;--fig-hair:#C4C9CF;--fig-shoe:#B3B9C0;--fig-shoe2:#7E848C;--fig-hl:#7EE04A;--fig-ghost:#E8ECF1;--fig-arrow:#7EE04A;--fig-floor:#3A4048;--fig-prop:#5A616B;--fig-prop-hi:#A1A9B4;--stage:radial-gradient(ellipse at 50% 35%,#4B525C,#22262C 75%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:calc(15px * var(--ts));line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 96px;position:relative}
#app.sub{padding-bottom:32px}
h1,h2,h3{margin:0;font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.08;text-wrap:balance}
h1{font-size:calc(30px * var(--ts))}h2{font-size:calc(23px * var(--ts))}h3{font-size:calc(17px * var(--ts))}
.eyebrow{font-size:calc(11px * var(--ts));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.brand{font-weight:800;font-stretch:125%;font-size:calc(17px * var(--ts));letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent)}
.hdr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent;transition:border-color .2s}
/* cover the strip behind the phone's status bar too, so content never shows above the header */
.hdr::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:calc(env(safe-area-inset-top,0px) + 1px);background:var(--bg)}
body.scrolled .hdr{border-bottom-color:var(--line)}
.hdr .brand{text-align:center}
.hdr button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.stack{display:grid;gap:16px}
a.btn{text-decoration:none}.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;font-weight:700;font-size:calc(15px * var(--ts));background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn:disabled{background:color-mix(in srgb,var(--accent) 22%,var(--surface2));color:color-mix(in srgb,var(--ink) 45%,transparent);cursor:not-allowed}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.syncbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:calc(14px * var(--ts));border:1px solid rgba(246,180,58,.35);transition:transform .12s}.syncbtn:active{transform:scale(.95)}.syncbtn .ic{width:16px;height:16px}.syncbtn.busy .ic{animation:spin .9s linear infinite}.syncbtn.ok{background:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.link{color:var(--accent);font-weight:700;font-size:calc(14px * var(--ts));display:inline-flex;align-items:center;gap:4px;vertical-align:middle}.link .ic{width:18px;height:18px;flex:none}
.pill{display:inline-flex;align-items:center;font-size:calc(11px * var(--ts));font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--surface2)}
.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-good{color:var(--good)}.c-top{color:var(--accent)}
/* figure */
.fig{display:block;width:100%;height:auto}
.fig .seg{fill:none;stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round}
.fig .seg.torso{stroke:var(--fig-torso)}
.fig .seg.far{stroke:var(--fig-far)}
.fig .j{fill:var(--fig)}.fig .jf{fill:var(--fig-far)}
.fig .head{fill:var(--fig-torso)}
img.fig.f3,canvas.fig.f3{display:block;width:100%;height:auto;aspect-ratio:1.6;object-fit:contain;touch-action:pan-y;max-width:100%}canvas.fig.f3{margin:0 auto}.stage .fig.f3{height:100%;width:auto;margin:0 auto}canvas.fig.f3.anim{cursor:grab}
.fig .shadow{fill:#000;opacity:.25}
.fig .hl{fill:none;stroke:var(--accent);stroke-linecap:round}
.fig .hlc{fill:var(--accent)}
.fig .mat{fill:#DDE3EA;stroke:#C9D1DB}
.fig .pipe{stroke:var(--fig-prop-hi);stroke-width:4;stroke-linecap:round}
.fig .pipeend{fill:var(--fig-prop-hi)}.fig .kit rect,.fig .kit circle{fill:var(--fig-prop-hi);stroke:var(--bg);stroke-width:1.5}
.fig .floor{stroke:var(--fig-floor);stroke-width:2}
.fig .ghost{stroke:var(--fig-ghost);opacity:.13;stroke-linecap:round;fill:none}.fig .ghostc{fill:var(--fig-ghost);opacity:.13}.fig .marrow{fill:none;stroke:var(--fig-arrow);stroke-width:3.6;stroke-linecap:round;opacity:.9}.fig .marrowh{fill:var(--fig-arrow);stroke:var(--fig-arrow);stroke-width:1.5;stroke-linejoin:round;opacity:.9}
.fig .prop{fill:none;stroke:var(--fig-prop);stroke-width:4;stroke-linecap:round}
.fig .propfill{fill:var(--fig-prop)}
.fig .band{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 3;opacity:.8}
/* home */
.greet{padding:20px 0 14px}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;scroll-padding-inline:16px}
.carousel::-webkit-scrollbar{display:none}
.pcard{scroll-snap-align:start;position:relative;height:clamp(290px,44vh,380px);border-radius:20px;overflow:hidden;text-align:center;display:grid;align-content:end;padding:22px;isolation:isolate}
.pcard .art{position:absolute;inset:0;z-index:-1;display:grid;place-items:center;padding:6% 6% 36%}
.pcard .go{display:inline-flex;align-items:center;gap:6px;margin:12px auto 0;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.14);font-size:calc(13px * var(--ts));font-weight:700}
.pcard h2{font-size:calc(30px * var(--ts))}
.pcard p{margin:4px 0 0;font-size:calc(14px * var(--ts));opacity:.85}
.g-activate{background:linear-gradient(165deg,#1C4A4A 0%,#11262A 55%,#0E1418 100%)}
.g-recover{background:linear-gradient(165deg,#2B2F5E 0%,#191C35 55%,#0F1119 100%)}
.g-daily{background:linear-gradient(165deg,#5A4636 0%,#30261F 55%,#15110F 100%)}
.g-target{background:linear-gradient(165deg,#4B2846 0%,#2A1828 55%,#120C12 100%)}
.g-rebuild{background:linear-gradient(165deg,#24504A 0%,#162B33 55%,#0E1418 100%)}
.g-a{background:linear-gradient(165deg,#24474F,#121B20)}.g-b{background:linear-gradient(165deg,#3A3460,#17162A)}.g-c{background:linear-gradient(165deg,#4E3E2C,#1B1611)}.g-d{background:linear-gradient(165deg,#25463A,#101C17)}
.dots{display:flex;justify-content:center;gap:6px;padding:14px 0}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:4px;text-align:left}
.tile b{font-size:calc(30px * var(--ts));font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:1}
.banner{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
/* tabbar */
/* training */
.wlist{display:grid}
.wres{display:grid;gap:1px}.wrow .wt .wres small{color:var(--ink)}.wrow .wt .wres small.muted{color:var(--muted)}
.wrow{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow .wd{display:grid;gap:4px;font-size:calc(13px * var(--ts));justify-items:start}
.wrow .wt{display:grid;gap:6px;text-align:left;min-width:0}
.wrow .wt small{color:var(--muted);font-size:calc(12px * var(--ts))}
.wrow .wa{display:grid;gap:8px;justify-items:end}
.mchip{font-size:calc(11px * var(--ts));font-weight:600;padding:3px 7px;border-radius:6px;background:var(--surface2)}
.chipset .mchip{white-space:nowrap}
.field{display:grid;gap:6px;min-width:0}
.field input,.field textarea{width:100%;background:var(--surface2);border:0;border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit;resize:vertical}.field input{min-height:44px;-webkit-appearance:none;appearance:none}.field input[type=date]{display:block;min-width:0;max-width:100%}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.nexttiles{display:grid;gap:10px}
.ntile{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:6px;text-align:left}
.ntile b{font-size:calc(16px * var(--ts));font-weight:800;font-stretch:112%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntile .go{justify-self:start;margin-top:4px;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:calc(13px * var(--ts))}
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:10}
#tabbar button{display:grid;justify-items:center;gap:2px;font-size:calc(11px * var(--ts));font-weight:700;color:var(--muted);padding:4px}
#tabbar button[aria-current="page"]{color:var(--accent)}
#tabbar .ic{width:26px;height:26px}
/* sport select */
.sports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;display:grid;align-content:end;padding:14px;text-align:left;isolation:isolate}
.scard .art{position:absolute;inset:0;z-index:-1;padding:10% 6% 34%;display:grid;place-items:center}
.scard b{font-size:calc(18px * var(--ts));font-weight:800;font-stretch:112%}
.addsport{border:1.5px dashed var(--line);display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:calc(14px * var(--ts))}
.zcard{border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 120px;align-items:center;padding:16px;text-align:left;gap:8px}
/* wizard */
.whead{background:var(--surface);border-radius:16px;overflow:hidden}
.whead .hero{position:relative;height:120px;display:grid;align-content:end;padding:12px 14px;isolation:isolate}
.whead .hero .art{position:absolute;inset:0;z-index:-1;display:grid;justify-items:end;padding:6px 10px 0 40%}
.whead .hero b{font-size:calc(21px * var(--ts));font-weight:800;font-stretch:112%;line-height:1.1}
/* the title keeps to the left, the figure to the right, so they never overlap */
.whead .hero{min-height:120px;height:auto;padding-right:40%}.whead .hero .art{left:auto;width:40%;padding:6px 8px 0 0}.whead .hero b{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.adapt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-size:calc(13px * var(--ts))}
.adapt .chips{display:flex;gap:6px}
.adapt .chips{gap:10px}.adapt .ach{display:grid;justify-items:center;gap:3px}.adapt .ach small{font-size:calc(10px * var(--ts));font-weight:700;color:var(--muted)}.adapt .ach.on small{color:var(--ink)}
.adapt .ach>span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.adapt .ach.on>span{background:var(--accent);color:var(--accent-ink)}
.adapt .chips .ic{width:17px;height:17px}
.stephead{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.stephead .bub{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.stephead .bub .ic{width:18px;height:18px}
.stephead p{margin:2px 0 0;color:var(--muted);font-size:calc(14px * var(--ts))}
.stephead h3{min-height:36px;display:flex;align-items:center}
.mlist{display:grid}
.mlist div{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
.mlist button{width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:calc(13px * var(--ts));font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip .ic{width:15px;height:15px}
.chip.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;padding:0 16px;border-radius:12px;background:var(--surface);font-weight:600;text-align:left;box-shadow:inset 0 0 0 1.5px transparent}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}.opt.on .radio{border:6px solid var(--accent)}
.opt .tick{margin-left:12px;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:transparent}.opt .tick svg{width:15px;height:15px}.opt.on .tick{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt .tag{color:var(--accent);font-size:calc(12px * var(--ts));font-weight:700}
.equip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.eq{display:grid;justify-items:center;gap:8px;font-size:calc(13px * var(--ts));font-weight:600}
.eq span{width:100%;aspect-ratio:1;border-radius:16px;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.eq span .ic{width:34px;height:34px;stroke-width:1.5}
.eq.on span{color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.eq span{position:relative}.eq.on span{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}.eq.on span::after{content:"✓";position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:calc(12px * var(--ts));font-weight:800;display:grid;place-items:center}.eq:not(.on) span{opacity:.6}
.eq:not(.on){color:var(--muted)}
.sumrows{background:var(--surface);border-radius:16px;padding:6px 14px}
.srow{display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.srow .bub{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.srow .bub .ic{width:17px;height:17px}
.srow small{display:block;color:var(--muted);font-size:calc(12px * var(--ts))}
.srow .ok{color:var(--accent);opacity:0;transition:opacity .25s}
.srow.done .ok{opacity:1}
.srow .val{transition:opacity .25s}
.srow:not(.done) .val{opacity:0}
.preview{display:grid}
.preview div{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:calc(14px * var(--ts))}
.preview span:first-child,.preview span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.preview .blk{margin:10px 0 2px;font-size:calc(11px * var(--ts));font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;border:0}
.preview .blk span{color:var(--muted)}
.preview .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}.preview .pe{display:flex;gap:4px}.preview .pe button{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface2);color:var(--muted)}.preview .pe .ic{width:15px;height:15px}
.preview .why{display:block;color:var(--muted);font-size:calc(12px * var(--ts));line-height:1.35;margin-top:2px}
.whybox{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:calc(13px * var(--ts));display:grid;gap:2px}
.whybox .eyebrow{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:calc(12px * var(--ts));color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.needbars{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.needbars li{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;font-size:calc(13px * var(--ts))}
.mvcredit{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:calc(13px * var(--ts))}
.mvcredit li{display:grid;gap:2px}
.needbars .nb{display:flex;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.needbars b{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:calc(12px * var(--ts))}
.evid p{margin:0;font-size:calc(14px * var(--ts));line-height:1.5}
.src{margin:0;padding-left:18px;display:grid;gap:6px;font-size:calc(12px * var(--ts));color:var(--muted)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:calc(14px * var(--ts));color:var(--muted)}
.steps b{color:var(--ink)}
.sheet a,.panel a{color:var(--accent);font-weight:700}
.bottomcta{position:sticky;bottom:0;z-index:3;margin-top:8px;padding:28px 0 calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,var(--bg) calc(100% - 26px),transparent);display:grid;gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}

textarea{font:inherit}.edex{gap:10px}.edhead{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center}.edhead .th{width:72px;height:auto;background:var(--stage);border-radius:10px;display:block}.edhead .th svg{width:72px;height:auto;display:block}.edbtns{display:flex;gap:12px}

/* ===== native feel (mobile-native + Apple HIG + motion audit) ===== */
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}body{overscroll-behavior:none}
/* iOS zooms into any input under 16px and never zooms back out */
input,textarea,select{font-size:max(16px,calc(16px * var(--ts)))!important}
/* controls: no 300ms tap wait, no text selection or callout on long-press (content text stays selectable) */
button,a,[data-act],.chip,.opt{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* press feedback the moment a finger lands, on everything pressable, not just the main buttons */
.pcard,.tile,.ntile,.lcard,.fcard,.scard,.zcard,.opt,.chip,.rx,.navrow,.flag,.mtile,.eq span,.srow{transition:transform 160ms var(--ease-out)}
.pcard:active,.tile:active,.ntile:active,.lcard:active,.fcard:active,.scard:active,.zcard:active,.navrow:active,.rx:active,.mtile:active{transform:scale(.97)}
.opt:active,.chip:active,.flag:active,.eq:active span{transform:scale(.98)}
#tabbar button:active .ic{transform:scale(.9)}#tabbar .ic{transition:transform 120ms var(--ease-out)}
/* HIG: 11pt is the smallest text */
#tabbar button{font-size:calc(11px * var(--ts))}.dchips i{font-size:calc(11px * var(--ts))}
/* sheets rise from the bottom with the iOS drawer curve and can be dragged down to close */
.scrim{animation:scrimIn 220ms ease-out both}
.sheet{animation:sheetIn 380ms var(--ease-drawer) both;touch-action:none;will-change:transform}
.sheet .scroll,.sheet textarea,.sheet .res{touch-action:pan-y;overscroll-behavior:contain}
.sheet .grab{width:100%;height:20px;margin:-8px 0 -10px;background:none;position:relative;cursor:grab}
.sheet .grab::before{content:"";position:absolute;left:50%;top:8px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.scrim.out{animation:scrimOut 200ms ease-in both;pointer-events:none}.scrim.out .sheet{animation:sheetOut 220ms var(--ease-out) both}
@keyframes scrimIn{from{background:rgba(0,0,0,0)}}@keyframes scrimOut{to{background:rgba(0,0,0,0)}}
@keyframes sheetIn{from{transform:translateY(100%)}}@keyframes sheetOut{to{transform:translateY(100%)}}
/* a sheet pulled up past its rest keeps its surface under it instead of showing a gap */
.sheet{box-shadow:0 420px 0 0 var(--surface)}
/* Increase Contrast: brighter secondary text, visible edges, solid chrome */
@media (prefers-contrast:more){:root{--muted:#D9CFC1;--line:#7A7166}#tabbar{background:#0D0B09!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border-top:1px solid #8C8378!important}.sheet{outline:1px solid #7A7166}}

/* the player comes up like a full-screen iOS view */
.player.rise{animation:sheetIn 420ms var(--ease-drawer) both}
.full{overscroll-behavior:contain}
@media (prefers-reduced-motion:reduce){.scrim,.sheet,.player.rise,.scrim.out,.scrim.out .sheet{animation:none!important}}

/* ===== GOWOD-style: tall centred cards with the next ones peeking, Daily as its own screen, the score counts up ===== */
/* each card is the full content box and the side padding is equal, so the first card's centred snap position is scroll 0.
   (With 82% columns inside 9% padding it sat left of centre, a snap point that can't be reached, and iOS re-snapped to the
   second card whenever the layout changed at launch.) */
.carousel{grid-auto-columns:100%;scroll-snap-type:x mandatory;padding-inline:16.4%;scroll-padding-inline:0;margin-inline:-16px}
.carousel .pcard{scroll-snap-align:center;height:clamp(360px,60vh,560px);padding:26px}
.carousel.short .pcard{height:clamp(300px,calc(100svh - 420px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),560px)}
.pcard .art{padding:8% 6% 26%}
.carousel .pcard{container-type:inline-size}.carousel .pcard h2{font-size:min(calc(36px * var(--ts)),16cqi)}
.pcard h2{font-size:calc(36px * var(--ts));margin-bottom:6px}
.pcard::before{top:42%}
#screen{background:var(--bg)}
.dcard{position:relative;display:grid;align-content:end;text-align:left;height:150px;border-radius:var(--r-panel);padding:16px 18px;overflow:hidden;isolation:isolate;color:#fff}
.dcard.g-target,.flowcard.g-target,.flowcard.g-rebuild{color:#17181A}
.dcard .art{position:absolute;inset:0 0 0 42%;z-index:-1;display:grid;place-items:center;padding:8px}
.dcard b{font-size:calc(22px * var(--ts));font-weight:800;font-stretch:112%;letter-spacing:-.01em}
.dcard:first-of-type{height:200px}.dcard:first-of-type b{font-size:calc(26px * var(--ts))}
.hscroll.flows{gap:10px;padding-bottom:4px;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.flowcard{flex:none;width:72%;max-width:300px;height:170px;scroll-snap-align:start;position:relative;display:grid;align-content:end;gap:1px;text-align:left;border-radius:var(--r-panel);padding:14px 16px;overflow:hidden;isolation:isolate;color:#fff}
.flowcard .art{position:absolute;inset:0 0 34% 0;z-index:-1;display:grid;place-items:center;padding:6px}
.flowcard b{font-size:calc(19px * var(--ts));font-weight:800;font-stretch:112%}.flowcard small{font-size:calc(13px * var(--ts));opacity:.8}
.flowcard,.dcard{transition:transform 160ms var(--ease-out)}.flowcard:active,.dcard:active{transform:scale(.97)}
.bars .tr i{transform-origin:left center}

.dcard .art :is(svg,img,canvas),.flowcard .art :is(svg,img,canvas){max-height:100%;max-width:100%;width:auto;height:100%;object-fit:contain}
.dcard .art{inset:8px 8px 8px 46%}
.flowcard{height:190px}.flowcard .art{inset:8px 8px 58px 8px}
.g-library{background:linear-gradient(180deg,#2C2E33,#1C1D21);color:var(--chalk);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.g-library.pcard::before{background:radial-gradient(circle,rgba(255,255,255,.05) 0 7%,transparent 7% 30%,rgba(255,255,255,.05) 30% 31%,transparent 31% 46%,rgba(255,255,255,.06) 46% 47.2%,transparent 47.2%)}

/* ===== Profile: who you are, the program you follow, and a dashboard in three slides ===== */
.phead{display:flex;align-items:center;gap:14px;padding:6px 0 2px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;font-size:calc(24px * var(--ts));font-weight:800;font-stretch:112%;color:var(--accent);flex:none}
.pwho{display:grid;gap:2px;min-width:0}
.btn.danger{background:var(--surface2);color:var(--bad);box-shadow:none}
.tabtop{height:calc(env(safe-area-inset-top,0px) + 12px)}
.dcell.score.none p{margin:0;font-size:calc(13px * var(--ts));line-height:1.35;text-align:center}
.pname{text-align:left;font-size:calc(26px * var(--ts));font-weight:800;font-stretch:112%;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:44px}
.pprog{display:inline-flex;align-items:center;gap:8px;font-size:calc(15px * var(--ts));font-weight:600;color:var(--muted);min-height:36px;text-align:left}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(246,180,58,.2);flex:none}
.pseg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:18px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.pseg button{position:relative;z-index:1;min-height:44px;border-radius:14px;font-size:calc(14px * min(var(--ts),1.15));font-weight:700;color:var(--muted);transition:color 200ms ease}
.pseg button.on{color:var(--chalk)}
.plens{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:14px;transform:translateX(calc(var(--pi,0) * 100%));transition:transform 420ms var(--ease-drawer);background:var(--surface2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.1)}
.dgrid{display:grid;grid-template-columns:1fr 1.12fr;grid-template-rows:auto 1fr;gap:10px}
.dcell{background:var(--surface);border-radius:var(--r-panel);padding:14px;display:grid;align-content:start;gap:6px;text-align:left;min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),inset 0 1px 0 rgba(255,255,255,.05)}
.dcell.time{grid-column:1;grid-row:1}.dcell.focus{grid-column:1;grid-row:2;justify-items:center;text-align:center;align-content:center;gap:10px}.dcell.score{grid-column:2;grid-row:1/3;justify-items:center;align-content:start;gap:14px;transition:transform 160ms var(--ease-out)}
.dcell.score:active{transform:scale(.98)}
.dt{font-size:calc(14px * var(--ts));font-weight:700;justify-self:start}
.dsub{font-size:calc(15px * var(--ts));color:var(--muted);margin-top:6px}
.dbig{font-size:calc(34px * var(--ts));font-weight:800;font-stretch:112%;letter-spacing:-.02em;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.mbar{height:14px;border-radius:7px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--line) 0 2px,transparent 2px 5px);overflow:hidden;position:relative}
.mbar i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#E5481A,#F6B43A)}
.dnext{display:flex;justify-content:space-between;align-items:baseline;font-size:calc(12px * var(--ts));color:var(--muted);margin-top:2px}.dnext b{color:var(--ink);font-size:calc(14px * var(--ts))}
.ringwrap{position:relative;width:min(100%,150px);aspect-ratio:1;margin-top:6px}.ring{width:100%;height:100%;display:block}
.rnum{position:absolute;inset:0;display:grid;place-content:center;grid-auto-flow:column;align-items:baseline;gap:2px}.rnum b{font-size:calc(40px * var(--ts));font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.rnum small{font-size:calc(16px * var(--ts));font-weight:600}
.vbars{display:flex;justify-content:space-between;gap:6px;width:100%;height:130px;padding:0 6px}
.vb{flex:1;height:100%;border-radius:4px;background:var(--line);position:relative;overflow:hidden;max-width:8px;margin-inline:auto}.vb i{position:absolute;left:0;right:0;bottom:0;border-radius:4px;transform-origin:bottom}
.fic{width:64px;height:64px;border-radius:50%;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center;color:var(--ink)}.fic .ic{width:30px;height:30px}
.fnames{display:grid;gap:2px}.fnames b{font-size:calc(17px * var(--ts));font-weight:700}
.dtest{display:flex;align-items:center;justify-content:space-between;margin:0;font-size:calc(13px * var(--ts))}
#screen .stack>.panel h3{font-size:calc(18px * var(--ts))}
@media (prefers-reduced-motion:reduce){.plens{transition:none}}
.bars li{grid-template-columns:96px 1fr 62px}.bars b{white-space:nowrap;text-align:right}
body.touring .carousel .pcard{height:clamp(220px,32vh,320px)}

.chartp{gap:10px}.chead{display:flex;justify-content:space-between;align-items:flex-start}
.cval{display:flex;align-items:baseline;gap:10px;margin-top:2px}.cval b{font-size:calc(40px * var(--ts));font-weight:800;font-stretch:112%;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}.cval span{font-size:calc(14px * var(--ts));font-weight:600}
.cchips{padding-block:2px}
.chart{width:100%;height:auto;display:block;overflow:visible}.chart .cax{fill:var(--muted);font:600 11px var(--f)}.chart .cval2{fill:var(--ink);font:700 12px var(--f);font-variant-numeric:tabular-nums}
.chart .cdot{transition:r .2s}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 92px);z-index:60;max-width:min(92vw,420px);padding:12px 16px;border-radius:16px;font-size:calc(14px * var(--ts));font-weight:600;text-align:center;color:var(--ink);background:rgba(38,34,29,.92);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.08)}
/* ===== Rebuild dashboard ===== */
.rbgo{position:relative;border:0;background:none;padding:0;width:min(100%,150px);aspect-ratio:1;display:block;margin-top:6px;transition:transform 160ms var(--ease-out)}.rbgo:active{transform:scale(.95)}
.rbgo .rnum .ic{width:48px;height:48px;color:var(--chalk)}
.rbmeta{display:flex;align-items:baseline;gap:6px}.rbmeta b{font-size:calc(26px * var(--ts));font-weight:800;font-stretch:112%}.rbmeta span{font-size:calc(14px * var(--ts));color:var(--muted)}
.rbmin{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.rbmin .chip{justify-content:center;padding:9px 0}
.fpain{font-size:calc(28px * var(--ts));font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums}.dcell.focus .fic{width:72px;height:72px}
.rxrow{gap:10px;padding-bottom:4px}.rxm{flex:none;width:132px;display:grid;gap:3px;text-align:left;align-content:start}.rxm .th{display:block;background:var(--stage);border-radius:14px;overflow:hidden}.rxm b{font-size:calc(13px * var(--ts));line-height:1.25}.rxm small{font-size:calc(12px * var(--ts));color:var(--muted)}
.steps2{gap:0;padding-block:6px}.stp{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);opacity:.62}.stp:last-child{border-bottom:0}.stp.on,.stp.done{opacity:1}
.stp .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:calc(14px * var(--ts));background:var(--surface2);color:var(--muted)}.stp .sn .ic{width:16px;height:16px}
.stp.on .sn{background:var(--accent);color:var(--accent-ink)}.stp.done .sn{background:var(--accent-soft);color:var(--accent)}
.stp b{display:block;font-size:calc(16px * var(--ts))}.stp small{display:block;color:var(--muted);font-size:calc(13px * var(--ts))}.stp p{margin:6px 0 0;font-size:calc(14px * var(--ts))}
.acc details{border-bottom:1px solid var(--line);padding:2px 0}.acc details:last-child{border-bottom:0}.acc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:48px;font-weight:700;font-size:calc(16px * var(--ts))}.acc summary::-webkit-details-marker{display:none}.acc summary::after{content:"+";font-weight:800;color:var(--muted)}.acc details[open] summary::after{content:"−"}.acc details>ul,.acc details>div{margin:0 0 12px}
/* Liquid Glass: functional layer only (bars, floating buttons, sheets, player controls); content stays opaque */
:root{--g-fill:rgba(28,25,22,.46);--g-fill-strong:rgba(36,32,28,.62);--g-line:rgba(255,255,255,.13);--g-hi:rgba(255,255,255,.22);--g-blur:blur(28px) saturate(1.6)}
/* top bar: no painted band; a scroll edge effect fades and blurs content as it slides under */
.hdr{background:transparent!important;border-bottom-color:transparent!important;isolation:isolate}
.hdr::before{content:"";position:absolute;inset:0 0 -28px 0;z-index:-1;background:linear-gradient(to bottom,rgba(13,11,9,.92) 0%,rgba(13,11,9,.6) 60%,rgba(13,11,9,0) 100%);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
/* bar buttons: 44pt glass circles, monochrome symbols */
.hdr button,.ptop button{width:44px;height:44px;border-radius:50%;background:var(--g-fill);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line),0 6px 18px rgba(0,0,0,.35);color:var(--ink)}
/* tab bar: thinner, livelier glass with a specular rim; the lens is a raised drop of glass; only the selected icon carries the brand colour */
#tabbar{background:var(--g-fill)!important;-webkit-backdrop-filter:var(--g-blur)!important;backdrop-filter:var(--g-blur)!important;border:0!important;
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line),inset 0 -1px 0 rgba(255,255,255,.05),0 14px 34px rgba(0,0,0,.5)!important}
#tabbar .tlens{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08))!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12),0 4px 14px rgba(0,0,0,.3)!important;border:0!important}
#tabbar button[aria-current=page] .ic{color:var(--accent)!important}
/* sheets float, inset from the edges, on regular glass */
.scrim{background:rgba(0,0,0,.34)!important}
.sheet{width:calc(100% - 16px)!important;margin:0 8px calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:34px!important;background:var(--g-fill-strong)!important;
  -webkit-backdrop-filter:blur(34px) saturate(1.6);backdrop-filter:blur(34px) saturate(1.6);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line),0 24px 60px rgba(0,0,0,.55)!important}
.sheet .btn.sec,.sheet .btn.danger{background:rgba(255,255,255,.09)!important;box-shadow:inset 0 0 0 1px var(--g-line)!important}
/* bottom actions float over content: secondary on glass, one tinted primary */
.bottomcta{background:linear-gradient(to top,rgba(13,11,9,.75) 30%,rgba(13,11,9,0))!important}
.bottomcta .btn.sec{background:var(--g-fill)!important;-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line)!important}
.bottomcta .btn{border-radius:999px!important}
/* player transport: one glass capsule */
.pctrl{background:var(--g-fill);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);border-radius:44px;padding:8px 10px;margin-inline:8px;box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line),0 14px 34px rgba(0,0,0,.45)}
/* Reduce Transparency: the same shapes on solid surfaces */
@media (prefers-reduced-transparency:reduce){.hdr button,.ptop button,#tabbar,.sheet,.bottomcta .btn.sec,.pctrl{background:var(--surface2)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}

/* Rebuild program dashboard */
.rbgo2{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--p-white,#ECE4D6);color:#17181A;border-radius:var(--r-panel,20px);padding:16px}
.rbplay{width:72px;height:72px;border-radius:50%;background:var(--accent);color:#17181A;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}.rbplay .ic{width:30px;height:30px;margin-left:3px}
.rbgotx{display:grid;gap:2px;min-width:0}.rbgotx b{font-size:calc(19px * var(--ts))}.rbgotx>span{font-size:calc(14px * var(--ts));opacity:.7;font-weight:600}
.rbgotx .rbmin{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.rbgotx .chip{background:rgba(23,24,26,.08);color:#17181A;padding:6px 12px}.rbgotx .chip.on{background:#17181A;color:var(--p-white,#ECE4D6);box-shadow:none}
.rbtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rbtiles .tile b{font-size:calc(30px * var(--ts));line-height:1;font-variant-numeric:tabular-nums}.rbtiles .tile small{font-size:calc(14px * var(--ts));color:var(--muted);font-weight:600;margin-left:2px}
.rbnext{gap:12px}.rbnh{display:grid;gap:2px}.rbnh b{font-size:calc(17px * var(--ts))}
.rbm{display:grid;gap:6px}.rbml{display:flex;justify-content:space-between;font-size:calc(14px * var(--ts))}.rbml b{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}.rbml .ic{width:16px;height:16px;color:var(--good)}
.rbbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.rbbar i{display:block;height:100%;border-radius:4px}
.rbnext .link{justify-self:start;font-size:calc(13px * var(--ts))}
.rbtrack{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.rbph{background:var(--surface);border-radius:14px;padding:10px;display:grid;gap:3px;align-content:start;min-width:0;opacity:.55}.rbph.on{opacity:1;box-shadow:inset 0 0 0 1.5px var(--accent)}.rbph.done{opacity:.85}
.rbph span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:calc(12px * var(--ts));font-weight:800;background:var(--surface2)}.rbph.on span{background:var(--accent);color:#17181A}.rbph.done span{background:var(--good);color:#06150E}.rbph span .ic{width:14px;height:14px}
.rbph b{font-size:calc(13px * var(--ts));line-height:1.2}.rbph small{font-size:calc(11px * var(--ts));color:var(--muted);line-height:1.25}
.rbguide{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rbguide .tile{justify-items:start;gap:6px;min-height:72px}.rbguide .tile .ic{width:20px;height:20px;color:var(--accent)}.rbguide .tile b{font-size:calc(14px * var(--ts))}
/* tab bar: thinner, clear Liquid Glass */
#tabbar{padding:4px!important;border-radius:28px!important;background:rgba(18,16,14,.16)!important;-webkit-backdrop-filter:blur(12px) saturate(1.9) brightness(1.08)!important;backdrop-filter:blur(12px) saturate(1.9) brightness(1.08)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 0 0 1px rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.35)!important}
#tabbar button{padding:4px 4px 3px!important;gap:1px;border-radius:24px;text-shadow:0 1px 2px rgba(0,0,0,.55)}
#tabbar .ic{width:22px;height:22px;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.5))}
#tabbar button{font-size:calc(10px * var(--ts))!important}
#tabbar .tlens{top:4px!important;bottom:4px!important;left:4px!important;width:calc((100% - 8px)/3)!important;border-radius:24px!important;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.07))!important}
#app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 86px)}
@media (prefers-reduced-transparency:reduce){#tabbar{background:var(--surface2)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
.pcards{grid-auto-columns:100%}
.pseg.two{grid-template-columns:repeat(2,1fr)}.pseg.two .plens{width:calc((100% - 8px)/2)}
.rbpair{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;align-items:stretch}
.rbtrack.v{grid-auto-flow:row;grid-auto-columns:auto;gap:6px}.rbtrack.v .rbph{grid-template-columns:22px 1fr;gap:8px;align-items:center;padding:8px 10px}.rbtrack.v .rbph>div{display:grid;gap:1px;min-width:0}
.rbnext.sm{padding:12px;gap:10px;align-content:start}.rbnext.sm .rbnh b{font-size:calc(15px * var(--ts))}.rbnext.sm .rbml{font-size:calc(13px * var(--ts))}.rbnext.sm .rbbar{height:6px}.rbnext.sm .link{font-size:calc(12px * var(--ts));padding:0;text-align:left}

/* sign-in: a floating card over a warm scene */
#gate.lgn{background:#0f0c0a;overflow:auto;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px))}
.lscene{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(90% 55% at 50% 18%,#5a3413 0%,#2a1a0f 45%,#0f0c0a 78%)}
.lsun{position:absolute;left:50%;top:14%;width:520px;height:520px;margin-left:-260px;border-radius:50%;background:radial-gradient(circle,rgba(246,180,58,.55) 0%,rgba(229,72,26,.18) 38%,rgba(229,72,26,0) 68%);filter:blur(8px);animation:lsun 9s ease-in-out infinite alternate}
.lring{position:absolute;left:50%;top:calc(14% + 260px);border-radius:50%;border:1.5px solid rgba(246,180,58,.12);transform:translate(-50%,-50%)}
.lring.r1{width:420px;height:420px}.lring.r2{width:640px;height:640px;border-color:rgba(246,180,58,.08)}.lring.r3{width:900px;height:900px;border-color:rgba(246,180,58,.05)}
@keyframes lsun{from{transform:translateY(0) scale(1)}to{transform:translateY(18px) scale(1.06)}}
.lwrap{position:relative;width:min(100%,400px);display:grid;gap:16px}
.lcard{position:relative;background:#f6f1e8;color:#17140f;border-radius:32px;padding:30px 22px 22px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 #fff;display:grid;justify-items:center;text-align:center}
.lplate{position:relative;z-index:2;width:92px;height:92px;border-radius:50%;margin-top:-4px;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 50%,#f6f1e8 0 52%,transparent 53%),conic-gradient(from 210deg,#2b2b2e,#4a4a4f 18%,#1d1d20 36%,#3d3d42 58%,#18181b 78%,#2b2b2e);
  box-shadow:0 10px 22px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.25),inset 0 2px 1px rgba(255,255,255,.25),inset 0 -3px 6px rgba(0,0,0,.45)}
.lplate::after{content:"";position:absolute;inset:12px;border-radius:50%;box-shadow:inset 0 3px 6px rgba(0,0,0,.28),inset 0 -1px 0 rgba(255,255,255,.7)}
.lplate .gmark{width:56px;height:56px;--ink:#17140f}
.ltitle{margin:16px 0 0;font-size:calc(26px * min(var(--ts),1.2));font-weight:800;font-stretch:112%;letter-spacing:-.02em;line-height:1.1;text-wrap:balance;color:#17140f}
.lsub{margin:6px 0 0;font-size:calc(14px * min(var(--ts),1.2));line-height:1.4;color:#6b6257;max-width:30ch}
.lform{width:100%;display:grid;gap:10px;margin-top:20px;text-align:left}
.lf{position:relative;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 14px;border-radius:16px;background:#ebe4d8;box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .18s ease,background .18s ease;cursor:text}
.lf:focus-within{background:#fff;box-shadow:inset 0 0 0 1.5px #17140f,0 0 0 4px rgba(23,20,15,.06)}
.lf>svg{width:20px;height:20px;flex:none;fill:none;stroke:#6b6257;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lf:focus-within>svg{stroke:#17140f}
.lf>span{flex:1;min-width:0;display:grid;gap:1px}
.lf small{font-size:12px;font-weight:600;color:#7a7065}
.lf input{border:0;background:none;outline:none;padding:0;font:inherit;font-size:16px;font-weight:600;color:#17140f;width:100%;min-width:0}
.lf input::placeholder{color:#a69b8e;font-weight:500}
.leye{flex:none;width:40px;height:40px;margin-right:-8px;border-radius:12px;display:grid;place-items:center;color:#6b6257}
.leye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.leye.on .slash{display:none}
.llink{font-weight:700;color:#b5650f;font-size:calc(14px * min(var(--ts),1.2));padding:6px 2px}
.lforgot{justify-self:end;margin:-2px 0 -4px}
.lmsg{margin:0;min-height:1.3em;font-size:14px;text-align:center}.lmsg.c-bad{color:#b3261e}.lmsg.muted{color:#6b6257}
.lgo{position:relative;height:54px;border-radius:16px;background:#17140f;color:#f6f1e8;font-weight:800;font-size:16px;letter-spacing:-.005em;box-shadow:0 8px 18px rgba(23,20,15,.25),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .12s ease}
.lgo:active{transform:scale(.98)}
.lgo .lspin,.lgo .lcheck{position:absolute;left:50%;top:50%;opacity:0;transition:opacity .2s ease}
.lgo .lspin{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:2.5px solid rgba(246,241,232,.3);border-top-color:#f6f1e8;animation:lspin .8s linear infinite}
.lgo .lcheck{width:24px;height:24px;margin:-12px 0 0 -12px;fill:none;stroke:#f6b43a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24}
.lgo.busy .lgo-t,.lgo.done .lgo-t{opacity:0}.lgo.busy .lspin{opacity:1}
.lgo.done .lcheck{opacity:1;stroke-dashoffset:0;transition:opacity .15s ease,stroke-dashoffset .35s cubic-bezier(.23,1,.32,1) .05s}
.lgo-t{transition:opacity .15s ease}
@keyframes lspin{to{transform:rotate(360deg)}}
.lor{display:flex;align-items:center;gap:12px;margin:8px 0 2px;color:#8a7f72;font-size:13px;font-weight:600}.lor::before,.lor::after{content:"";flex:1;height:1px;background:#ddd5c8}
.lsoc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ls{display:flex;align-items:center;justify-content:center;gap:9px;height:50px;border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),inset 0 0 0 1px #e2dacd;font-weight:700;font-size:15px;color:#17140f}
.ls svg{width:18px;height:18px}.ls:disabled{opacity:.55}
.ls[data-p=apple] svg{fill:#000;margin-top:-2px}
.lswitch{margin:0;text-align:center;color:rgba(246,241,232,.75);font-size:calc(14px * min(var(--ts),1.2))}.lswitch .llink{color:#f6b43a}
.loff{width:100%;margin-top:14px;display:grid;gap:6px;justify-items:center;font-size:13px;color:#6b6257;text-align:center}.loff .ic{width:18px;height:18px}
#gate.revealing .lsun,#gate.revealing .lring{display:none}
#app.lrevealing{position:relative;z-index:55;will-change:clip-path;background:var(--bg);min-height:100vh;box-shadow:0 0 0 100vmax var(--bg)}#tabbar.lrevealing{z-index:56;will-change:clip-path}
.lrim{position:fixed;z-index:60;border-radius:50%;pointer-events:none;transform-origin:50% 50%;will-change:transform;
  background:conic-gradient(from 210deg,#2b2b2e,#4a4a4f 18%,#1d1d20 36%,#3d3d42 58%,#18181b 78%,#2b2b2e);
  -webkit-mask:radial-gradient(circle,transparent 52%,#000 53%);mask:radial-gradient(circle,transparent 52%,#000 53%)}
@media (prefers-reduced-motion:reduce){.lsun{animation:none}.lgo .lspin{animation-duration:2s}}
/* ===== Today: the session ring. The character hovers over a stand and four glass tabs circle them ===== */
@property --glow{syntax:"<color>";inherits:true;initial-value:#FF6A2B}
.orb{position:relative;isolation:isolate;margin-inline:-16px;height:clamp(380px,calc(100svh - 226px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),680px);
  touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:0;--glow:#FF6A2B;--ob:84px;transition:--glow .7s var(--ease-out)}
.orb.short{height:clamp(314px,calc(100svh - 422px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),560px);--ob:14px}
body.touring .orb{height:clamp(300px,42vh,380px)}
.orb>*{position:absolute}
/* the light behind it all takes the colour of the tab in front; it fades out above and below, with no edge */
.o-bg{inset:-34px 0 calc(var(--ob)*-1);overflow:hidden;pointer-events:none;z-index:0;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 13%,#000 84%,transparent);mask-image:linear-gradient(180deg,transparent,#000 13%,#000 84%,transparent)}
.o-bgi{position:absolute;inset:34px 0 var(--ob)}.o-bgi>*{position:absolute}
.o-wash{position:absolute;inset:0;background:radial-gradient(95% 50% at 50% 38%,color-mix(in srgb,var(--glow) 22%,transparent),transparent 72%),radial-gradient(70% 26% at 50% 86%,color-mix(in srgb,var(--glow) 13%,transparent),transparent 75%)}
.o-halo{left:var(--cx);top:var(--hy);width:var(--hs);height:var(--hs);transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--glow) 26%,transparent) 0 7%,rgba(255,255,255,.13) 7% 7.6%,transparent 7.6% 30%,rgba(255,255,255,.10) 30% 30.7%,transparent 30.7% 46%,rgba(255,255,255,.085) 46% 46.8%,transparent 46.8% 63%,rgba(255,255,255,.05) 63% 63.6%,transparent 63.6%);
  -webkit-mask-image:linear-gradient(180deg,#000 55%,transparent 92%);mask-image:linear-gradient(180deg,#000 55%,transparent 92%)}
.o-floor{left:var(--cx);top:var(--py);width:var(--fs);height:var(--fs);transform:translate(-50%,-50%) scaleY(.34);border-radius:50%;
  background:radial-gradient(circle,transparent 0 30%,rgba(255,255,255,.11) 30% 30.9%,transparent 30.9% 43%,rgba(255,255,255,.08) 43% 43.8%,transparent 43.8% 58%,rgba(255,255,255,.055) 58% 58.7%,transparent 58.7%)}
/* the stand */
.o-pglow{left:var(--cx);top:calc(var(--py) + 8px);width:calc(var(--prx)*3.1);height:calc(var(--pry)*3.4);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 55%,transparent),transparent);filter:blur(10px);opacity:.75}
.o-pside{left:calc(var(--cx) - var(--prx));top:calc(var(--py) - var(--pry));width:calc(var(--prx)*2);height:calc(var(--pry)*2 + var(--pth));border-radius:50%/var(--pry);pointer-events:none;z-index:1;
  background:linear-gradient(90deg,#070605,#2a2520 22%,#3b342c 50%,#2a2520 78%,#070605);
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--glow) 55%,transparent),0 14px 26px -6px rgba(0,0,0,.8)}
.o-ptop{left:var(--cx);top:var(--py);width:calc(var(--prx)*2);height:calc(var(--prx)*2);transform:translate(-50%,-50%) scaleY(.34);border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,color-mix(in srgb,var(--glow) 80%,#fff) 0 5%,color-mix(in srgb,var(--glow) 38%,transparent) 5% 20%,rgba(255,255,255,.3) 20% 22%,color-mix(in srgb,var(--glow) 30%,#1c1814) 22% 52%,rgba(255,255,255,.2) 52% 54%,color-mix(in srgb,var(--glow) 16%,#231e19) 54% 84%,color-mix(in srgb,var(--glow) 70%,#fff) 84% 91%,#14110e 91%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--glow) 45%,transparent),0 0 46px 2px color-mix(in srgb,var(--glow) 60%,transparent),inset 0 0 40px color-mix(in srgb,var(--glow) 28%,transparent)}
.o-pulse{left:var(--cx);top:var(--py);width:calc(var(--prx)*2);height:calc(var(--prx)*2);border-radius:50%;pointer-events:none;z-index:2;border:3px solid var(--glow);opacity:0;transform:translate(-50%,-50%) scaleY(.34) scale(1)}
.o-pulse.on{animation:opulse .9s var(--ease-out)}
@keyframes opulse{0%{opacity:.9;transform:translate(-50%,-50%) scaleY(.34) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scaleY(.34) scale(2.5)}}
.o-beam{left:calc(var(--cx) - var(--prx)*.86);top:var(--by);width:calc(var(--prx)*1.72);height:calc(var(--py) + var(--pry)*.8 - var(--by));pointer-events:none;z-index:2;
  border-radius:0 0 50% 50%/0 0 calc(var(--pry)*.84) calc(var(--pry)*.84);
  background:linear-gradient(0deg,color-mix(in srgb,var(--glow) 50%,transparent),color-mix(in srgb,var(--glow) 12%,transparent) 55%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);
  mix-blend-mode:screen;opacity:.7;animation:obreathe 3.6s ease-in-out infinite alternate}
@keyframes obreathe{from{opacity:.5}to{opacity:.85}}
.o-shadow{left:var(--cx);top:var(--py);width:calc(var(--prx)*1.15);height:calc(var(--pry)*1.1);border-radius:50%;pointer-events:none;z-index:2;
  background:radial-gradient(closest-side,rgba(0,0,0,.7),transparent);transform:translate(-50%,-50%);animation:oshadow 3.6s ease-in-out infinite alternate}
@keyframes oshadow{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(-50%,-50%) scale(.8);opacity:.7}}
/* the path the tabs travel: dotted where it passes behind him */
.o-line{inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.o-line ellipse{fill:none;stroke-width:1.4}
.o-line.back{z-index:3;clip-path:inset(0 0 calc(100% - var(--cy)) 0)}
.o-line.back ellipse{stroke:rgba(255,255,255,.28);stroke-dasharray:1.5 7;stroke-linecap:round}
.o-line.front{z-index:7;clip-path:inset(var(--cy) 0 0 0)}
.o-line.front ellipse{stroke:color-mix(in srgb,var(--glow) 45%,rgba(255,255,255,.35));opacity:.75}
/* the character */
.o-aura{left:var(--cx);top:calc(var(--ht) + var(--ch)*.46);width:calc(var(--ch)*.82);height:calc(var(--ch)*1.05);transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:5;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--glow) 30%,transparent),transparent)}
.o-hero{left:var(--cx);top:var(--hbt);width:var(--hbw);height:var(--hbh);margin-left:calc(var(--hbw)*-.5);pointer-events:none;z-index:6}
.o-bob{position:absolute;inset:0;animation:obob 3.6s ease-in-out infinite alternate}
@keyframes obob{from{transform:translateY(0)}to{transform:translateY(-10px)}}
.o-hero .fig{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none;aspect-ratio:auto;margin:0;cursor:default}
/* the glass tabs */
.o-tab{left:0;top:0;width:var(--tw);height:var(--th);margin:calc(var(--th)*-.5) 0 0 calc(var(--tw)*-.5);will-change:transform;text-align:left;border-radius:calc(22px*var(--u));
  font-size:calc(16px*var(--u));color:var(--ink);--tint:#FF6A2B;--dim:0;--f:0;--sh:0;transition:opacity .5s ease;-webkit-tap-highlight-color:transparent}
.o-tab::before{content:"";position:absolute;inset:0;border-radius:inherit;transform:translateY(calc(5px*var(--u)));
  background:linear-gradient(180deg,color-mix(in srgb,var(--tint) 40%,#17130f),color-mix(in srgb,var(--tint) 16%,#080706));box-shadow:0 20px 30px -12px rgba(0,0,0,.75)}
.o-glass{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:linear-gradient(158deg,color-mix(in srgb,var(--tint) 34%,rgba(52,46,40,.5)) 0%,rgba(30,27,23,.5) 52%,rgba(16,14,12,.66) 100%);
  -webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);
  box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line),inset 0 -12px 20px -8px rgba(0,0,0,.45)}
.o-rings{position:absolute;right:-12%;top:-34%;height:150%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--tint) 46%,transparent) 0 7%,rgba(255,255,255,.2) 7% 8%,transparent 8% 30%,rgba(255,255,255,.14) 30% 31.2%,transparent 31.2% 46%,rgba(255,255,255,.1) 46% 47.4%,transparent 47.4%)}
.o-pic{position:absolute;right:-7%;top:1%;width:74%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.o-pic .fig{display:block;width:100%;height:auto;-webkit-user-drag:none;pointer-events:none}
.o-sheen{position:absolute;inset:0 -60%;background:linear-gradient(112deg,transparent 30%,rgba(255,255,255,.2) 44%,rgba(255,255,255,.04) 52%,transparent 60%);transform:translateX(calc(var(--sh)*1%))}
.o-txt{position:absolute;left:9.5%;right:6%;bottom:10%}
.o-txt b{display:block;font-weight:800;font-stretch:118%;letter-spacing:-.015em;line-height:1.05;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.o-txt i{display:block;font-style:normal;margin-top:.22em;font-size:.68em;font-weight:500;color:var(--muted);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.o-go{position:absolute;left:8%;top:10%;width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);opacity:var(--f);transform:scale(calc(.6 + var(--f)*.4));box-shadow:0 4px 12px -2px rgba(0,0,0,.5)}
.o-go svg{width:58%;height:58%}
.o-glass::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim)}
.o-edge{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--f);
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--tint) 78%,#fff),0 0 30px -4px color-mix(in srgb,var(--tint) 75%,transparent)}
.o-tab:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
.o-tab:active .o-glass{filter:brightness(1.12)}
.o-nav{left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;display:grid;place-items:center;color:var(--muted);z-index:19;
  background:var(--g-fill);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line);transition:opacity .5s ease,color .2s}
.o-nav svg{width:16px;height:16px;transition:transform 160ms var(--ease-out)}
.o-nav:active{color:var(--ink)}.o-nav:active svg{transform:scale(.82)}
.orb.intro .o-tab,.orb.intro .o-nav{opacity:0}
/* opening a session: the tab's colour opens out from it as a ring, the page changes behind it, then it lifts */
.o-warp{position:fixed;inset:0;z-index:50;overflow:hidden;--tint:#F6B43A}
.o-warp i{position:absolute;left:var(--x);top:var(--y);width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;will-change:transform,opacity;opacity:0}
.o-wd{background:radial-gradient(circle,var(--bg) 0 56%,color-mix(in srgb,var(--tint) 30%,var(--bg)) 78%,color-mix(in srgb,var(--tint) 88%,#fff) 96%,transparent 100%)}
.o-wr{border:2px solid color-mix(in srgb,var(--tint) 70%,#fff)}

/* the same stage without the ring: Rebuild and Profile */
.orb.solo{--ob:28px;margin-top:2px}
.orb.solo .o-bg{inset:-28px 0 -28px}
.orb.rbpick{height:clamp(300px,calc(100svh - 430px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),440px)}
.orb.rbprog,.orb.prof{height:clamp(210px,calc(100svh - 560px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),300px)}
body.touring .orb.solo{height:clamp(200px,30vh,280px)}
.o-hero.pick{pointer-events:auto}.o-hero.pick .fig{pointer-events:auto;cursor:crosshair}
/* under the Rebuild stage: what you tapped, and Continue */
.o-pickbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:8px 8px 8px 18px;border-radius:20px;
  background:var(--g-fill);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line);position:relative;z-index:2}
.o-pickbar .o-pbt{min-width:0;font-size:calc(15px * var(--ts));line-height:1.3;color:var(--muted)}
.o-pickbar .o-pbt b{color:var(--ink);font-weight:800}
.o-pickbar .btn{width:auto;flex:none;min-height:44px;padding:0 18px}
.o-pickbar.got{box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1.5px color-mix(in srgb,var(--glow,#F6B43A) 70%,transparent),0 0 28px -8px color-mix(in srgb,var(--glow,#F6B43A) 70%,transparent)}
html:not(.fig3d) .orb.solo,html:not(.fig3d) .o-pickbar,html:not(.fig3d) .rbpickonly,html.fig3d .rbpickno{display:none}
/* the pane switches on Rebuild and Profile: glass, like the tab bar */
.pseg{background:var(--g-fill);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line)}

/* Profile, Dashboard: the numbers float around the character */
.orb.prof.cards{height:clamp(360px,calc(100svh - 330px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),470px)}
.o-stat{z-index:20;width:min(122px,31%);padding:10px 12px;border-radius:18px;display:grid;gap:5px;align-content:start;text-align:left;min-width:0;
  background:var(--g-fill);-webkit-backdrop-filter:var(--g-blur);backdrop-filter:var(--g-blur);box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line),0 12px 24px -12px rgba(0,0,0,.6);transition:transform 160ms var(--ease-out)}
button.o-stat:active{transform:scale(.97)}
.o-stat.tr{right:12px;top:3%}.o-stat.time{left:12px;top:3%}.o-stat.score{right:12px;top:3%}.o-stat.focus{left:12px;top:50%}.o-stat.areas{right:12px;top:50%}
.o-stat .dt{font-size:calc(12px * var(--ts));color:var(--muted)}
.o-stat .dbig{font-size:calc(24px * var(--ts))}
.o-stat .mbar{height:10px;margin-top:2px}
.o-stat.score{justify-items:center}.o-stat.score .ringwrap{width:76px;margin:0}.o-stat .rnum b{font-size:calc(24px * var(--ts))}.o-stat .rnum small{font-size:calc(12px * var(--ts))}
.o-stat.score small{font-size:calc(12px * var(--ts))}
.o-stat.focus small{font-size:calc(12px * var(--ts))}.o-stat .fnames b{font-size:calc(14px * var(--ts));line-height:1.2}
.o-stat .vbars{height:64px;padding:0 2px;gap:4px}
html:not(.fig3d) .orb.prof.cards{display:block}html:not(.fig3d) .orb.prof .o-hero{visibility:hidden}

/* Profile panes: glass panels without the blur (they sit on a plain background, so a blur would cost and show nothing) */
#pane.gl .panel,#pane.gl .tile{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 var(--g-hi),inset 0 0 0 1px var(--g-line)}
#pane.gl .chip{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--g-line)}
#pane.gl .chip.on{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--ink);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 70%,transparent),0 0 18px -6px var(--accent)}

function lerp(A,B,t){return A.map((v,i)=>v+(B[i]-v)*t)}
/* ================= demo figure =================
   Each stretch has its own start (A) and end-range (B) pose. Bones keep fixed lengths; feet and hands
   that are "planted" stay put while the body moves (two-bone IK), so nothing slides or stretches.
   Angles are in degrees, screen space: 0 = forward (right), 90 = down, -90 = up, 180 = back (left).
   Pose fields: p pelvis | root [joint,[x,y]] to pin a knee/foot instead | t torso | bend spine curve |
   h head | L1/L2 legs (near/far) {a:[thigh,shin]} or {plant:[x,y]}, f foot angle |
   A1/A2 arms {a:[upper,fore], s:[scale,scale]} or {plant:[x,y]} or {rot} (straight arm turning about
   the body's long axis, for top-down views) | view:'front' | top:true (seen from above, no floor). */

const vadd=(p,v,l=1)=>[p[0]+v[0]*l,p[1]+v[1]*l];
function ik2(h,t,a,b,dir){
  const dx=t[0]-h[0],dy=t[1]-h[1],raw=Math.hypot(dx,dy)||.001;
  const d=Math.max(Math.abs(a-b)+.01,Math.min(a+b-.01,raw)),base=Math.atan2(dy,dx);
  const al=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d)))),ang=base-dir*al;
  return[[h[0]+a*Math.cos(ang),h[1]+a*Math.sin(ang)],[h[0]+d*Math.cos(base),h[1]+d*Math.sin(base)]];
}
function lerpF(a,b,t){
  if(typeof a==="number")return a+((typeof b==="number"?b:a)-a)*t;
  if(Array.isArray(a))return a.map((v,i)=>lerpF(v,b?b[i]:undefined,t));
  if(a&&typeof a==="object"){const o={};for(const k in a)o[k]=lerpF(a[k],b?b[k]:undefined,t);return o}
  return a;
}

function bodyMap(zones){
  const on=z=>zones.includes(z)?" on":"";
  const S_=(tag,attrs,z)=>`<${tag} class="s${z?" z"+on(z):""}" ${attrs}/>`;
  const fig1=(cx,back)=>{
    const d=cx-50;let s="";
    s+=S_("ellipse",`cx="${cx}" cy="16" rx="8" ry="10"`);
    s+=S_("rect",`x="${cx-4}" y="25" width="8" height="8"`);
    s+=S_("path",`d="M${36+d} 33 Q${cx} 29 ${64+d} 33 L${62+d} 90 Q${cx} 96 ${38+d} 90 Z"`);
    s+=S_("ellipse",`cx="${30+d}" cy="56" rx="5" ry="15"`)+S_("ellipse",`cx="${70+d}" cy="56" rx="5" ry="15"`);
    s+=S_("ellipse",`cx="${26+d}" cy="85" rx="4" ry="13"`)+S_("ellipse",`cx="${74+d}" cy="85" rx="4" ry="13"`);
    if(!back){
      s+=S_("ellipse",`cx="${42+d}" cy="120" rx="7.5" ry="20"`,"quads")+S_("ellipse",`cx="${58+d}" cy="120" rx="7.5" ry="20"`,"quads");
      s+=S_("ellipse",`cx="${47.5+d}" cy="113" rx="2.5" ry="11"`,"adductors")+S_("ellipse",`cx="${52.5+d}" cy="113" rx="2.5" ry="11"`,"adductors");
      s+=S_("ellipse",`cx="${43+d}" cy="164" rx="5" ry="18"`)+S_("ellipse",`cx="${57+d}" cy="164" rx="5" ry="18"`);
      s+=S_("ellipse",`cx="${33+d}" cy="38" rx="7" ry="6"`,"shoulders")+S_("ellipse",`cx="${67+d}" cy="38" rx="7" ry="6"`,"shoulders");
      s+=S_("ellipse",`cx="${44+d}" cy="46" rx="7" ry="6"`,"chest")+S_("ellipse",`cx="${56+d}" cy="46" rx="7" ry="6"`,"chest");
      s+=S_("ellipse",`cx="${43+d}" cy="93" rx="5" ry="5"`,"hipflex")+S_("ellipse",`cx="${57+d}" cy="93" rx="5" ry="5"`,"hipflex");
      s+=S_("rect",`x="${cx-5}" y="58" width="10" height="24" rx="4"`,"core");
      s+=S_("ellipse",`cx="${40+d}" cy="70" rx="3.5" ry="11"`,"obliques")+S_("ellipse",`cx="${60+d}" cy="70" rx="3.5" ry="11"`,"obliques");
      s+=S_("ellipse",`cx="${30+d}" cy="55" rx="3.5" ry="9"`,"biceps")+S_("ellipse",`cx="${70+d}" cy="55" rx="3.5" ry="9"`,"biceps");
      s+=S_("ellipse",`cx="${43+d}" cy="160" rx="2.5" ry="13"`,"shins")+S_("ellipse",`cx="${57+d}" cy="160" rx="2.5" ry="13"`,"shins");
    }else{

      s+=S_("ellipse",`cx="${43+d}" cy="164" rx="6" ry="16"`,"calves")+S_("ellipse",`cx="${57+d}" cy="164" rx="6" ry="16"`,"calves");
      s+=S_("ellipse",`cx="${43+d}" cy="98" rx="8" ry="8"`,"glutes")+S_("ellipse",`cx="${57+d}" cy="98" rx="8" ry="8"`,"glutes");

  const items=d.i.slice(0,40).map(r=>Array.isArray(r)?r:[]).filter(([id])=>typeof id==="string"&&(LIBI[id]&&!LIBI[id].custom||own.some(e=>e.id===id))).map(([id,x])=>{x=x&&typeof x==="object"?x:{};
    return{id,dose:{k:["reps","hold","rephold"].includes(x.k)?x.k:"hold",sets:num(x.sets,1,10,1),reps:num(x.reps,1,100,10),secs:num(x.secs,3,600,30),sides:!!x.sides,rest:num(x.rest,0,600,60),note:cl(x.note,140)}}});

/* ================= protocol planner =================
   Each protocol has a fixed structure taken from Rebuilding Milo and checked against the research:
   ACTIVATE (before training, RAMP per the Lifter Prep & Recovery Protocol): sore areas you pick, Raise (2-3 min easy cardio),
     rehab warm-up if a Rebuild program asks for one (isometrics before lifting)
     -> Mobilise: the joints today's movements need, dynamic first, static holds max 30 s and max 60 s per
        area (longer static holds before lifting cost strength and power)
     -> Activate: brace the core (McGill), then switch on the muscles movement 1 relies on.
   RECOVER (after): region by region, biggest load first: release (roller / ball) for that region, then long
     passive holds for what you trained, winding down to the floor.
   DAILY: Mobility for your weakest areas (capped at ~10 min of static stretching per area per week, the
     point where gains level off), then Strength at end range (builds range as well as stretching does).
   TARGET: Mobility for one area, then Lock it in with a strength drill in the new range.
   Every block skips exercises your active Rebuild program says to avoid (e.g. no Achilles stretching). */

const isoLocal=t=>{const d=new Date(t);return isNaN(d)?"":`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const doneDay=w=>{const l=w.loggedAt?isoLocal(w.loggedAt):"";return l&&l>w.date?l:w.date};
// the last n past sessions you logged scores for (falls back to sessions marked done)
// the last sessions you did, newest first: the most recently logged ones, then listed by the workout's own date (the date shown)
function scoredRecent(n){const p=past().filter(w=>didIt(w)||w.result).sort((a,b)=>doneDay(b).localeCompare(doneDay(a))||String(b.loggedAt||"").localeCompare(String(a.loggedAt||"")));
  return p.slice(0,n).sort((a,b)=>b.date.localeCompare(a.date)||doneDay(b).localeCompare(doneDay(a)))}
function nextSession(){return upcoming()[0]||null}
// what to recover from: everything you did today (whatever day it was programmed for), or else yesterday's sessions
function recentSessions(){const t=todayIso(),done=past().filter(didIt),td=done.filter(w=>doneDay(w)===t);return td.length?td:done.filter(w=>doneDay(w)===addDays(t,-1))}
const nextWorkout=()=>upcoming().find(w=>w.moves.length)||null;
const loggedToday=()=>sessionsDoneOn(todayIso()).filter(w=>w.moves.length);
function sessionsDoneOn(day){return past().filter(w=>didIt(w)&&doneDay(w)===day)}
const recLabel=rec=>`Recover · ${dayLabel(doneDay(rec[0]))}${rec.length>1?` · ${rec.length} workouts`:""}`;
// Load on each area from the last 3 days: today 1, yesterday .8, 2 days .5, 3 days .3
function recentLoad(){
  const t=todayIso(),wt=[1,.8,.5,.3],load={};AREAS.forEach(a=>load[a.k]=0);
  // done, or a workout you added yourself for today or the last few days (logging it means you did it)
  S.training.forEach(w=>{if(w.example||!(didIt(w)||(!isSynced(w)&&w.date<=t)))return;const ago=daysFrom(doneDay(w),t);if(ago<0||ago>3)return;const d=demandOf(w.moves,moveWeights(w));for(const k in d)load[k]+=d[k]*wt[ago]});
  return load;
}
function wShort(w){const t=wTitle(w).split(/\s*[·|•]\s*/).filter(Boolean).pop()||"Your next workout";return t.length>32?t.slice(0,30).trim()+"…":t}
function wTitle(w){
  if(!w.title)return(w.text||"").split("\n").map(s=>s.trim()).find(Boolean)?.slice(0,40)||"Workout";
  // Synced titles join workout parts and were capped at 80 chars: drop a part cut mid-word, repeats and "|" separators
  let p=w.title.split(/\s*[·|]\s*/).filter(Boolean);if(w.title.length>=78&&p.length>1)p.pop();
  p=p.map(x=>/[a-z]/.test(x)||x.length<5?x:x.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase()));
  return[...new Set(p)].join(" · ")||w.title}
// the warm-up follows the session's own order (movement 1 is primed fully);
// warm-up and accessory parts of the written workout go last so they never count as movement 1
function prepFor(w){const mw=moveWeights(w),ord=movesInOrder((w.text||"")+"\n"+(w.title||"")),at=m=>{const i=ord.indexOf(m);return i<0?99:i};
  const moves=w.moves.slice().sort((a,b)=>((mw[a]??1)<1)-((mw[b]??1)<1)||at(a)-at(b));
  startWizard({kind:"activate",sport:S.sports[0]||"crossfit",moves,mw,from:wTitle(w)})}
function recoverFrom(list){const moves=[...new Set(list.flatMap(w=>w.moves))],mw={};list.forEach(w=>{const x=moveWeights(w);for(const m in x)mw[m]=Math.max(mw[m]??0,x[m])});startWizard({kind:"recover",sport:S.sports[0]||"crossfit",moves,mw,from:list.length===1?wTitle(list[0]):`${list.length} workouts · ${dayLabel(doneDay(list[0]))}`})}
ACT.prepNext=()=>{const n=nextSession();if(n)prepFor(n)};
ACT.recoverRecent=()=>{const r=recentSessions();if(r.length)recoverFrom(r)};
ACT.prepW=d=>{const w=S.training.find(x=>x.id===d.id);if(w)prepFor(w)};
ACT.recW=d=>{const w=S.training.find(x=>x.id===d.id);if(!w)return;const same=didIt(w)?sessionsDoneOn(doneDay(w)).filter(x=>x.moves.length):[];recoverFrom(same.length>1&&same.includes(w)?same:[w])};
ACT.doneW=d=>{const w=S.training.find(x=>x.id===d.id);if(!w)return;if(isPast(w)&&isSynced(w)&&!w.result)w.marked=!w.marked;else{w.done=!w.done;w.marked=w.done}save();render()};

/* Back from a break: a gap of 7+ days since the last session with scores.
   Detraining research: strength holds for ~2-3 weeks off, but tissue tolerance and bar speed drop sooner,
   so the first week back runs about one program week behind (roughly 5% under the written %), then rejoins. */
function breakInfo(){
  const t=todayIso(),logged=S.training.filter(w=>w.date<t&&(w.result||w.done)&&!w.example).sort((a,b)=>b.date.localeCompare(a.date));
  if(!logged.length)return null;
  const last=logged[0],gap=daysFrom(last.date,t);if(gap<7)return null;
  const wk=list=>Math.max(0,...list.flatMap(w=>[...(w.text||"").matchAll(/week\s*(\d+)/gi)].map(m=>+m[1])));
  return{last,gap,lastWeek:wk(logged.slice(0,6)),nowWeek:wk(upcoming().slice(0,7)),until:addDays(t,6)};
}
function reentryFor(w){
  const b=breakInfo();if(!b||w.date>b.until||!w.moves.length)return"";
  const pcts=[...(w.text||"").matchAll(/(\d{2,3}(?:[.,]\d)?)\s*%/g)].map(m=>parseFloat(m[1].replace(",","."))).filter(v=>v>=50&&v<=100);
  if(pcts.length){const top=Math.max(...pcts);return`top sets around ${Math.round((top-5)*2)/2}% instead of ${top}%. Stop the build when the bar slows.`}
  return"keep it to RPE 7: same movements, a little lighter, nothing to failure.";
}
ACT.breakRecover=()=>{const b=breakInfo(),n=nextSession();startWizard({kind:"activate",sport:S.sports[0]||"crossfit",moves:n?n.moves:[],from:"Back from a Break"})};
const breakPanel=()=>{const b=breakInfo();if(!b)return"";
  return`<div class="panel"><h3>Back from a Break</h3><p class="muted" style="margin:0;font-size:calc(14px * var(--ts))">${b.gap} days off. Go about 5% lighter this week.</p>
   <button class="btn sec" data-act="breakRecover">Longer Warm-Up</button></div>`};
const wRow=w=>{

   ${up&&reentryFor(w)?`<small class="c-warn">Go ~5% lighter</small>`:""}

   <div class="wa">${up&&w.moves.length?`<button class="link" data-act="prepW" data-id="${w.id}">Prepare</button>`:""}${w.moves.length&&(!up||w.date===todayIso())?`<button class="link" data-act="recW" data-id="${w.id}">${(n=>n>1?`Recover all ${n}`:"Recover")(didIt(w)?sessionsDoneOn(doneDay(w)).length:0)}</button>`:""}</div></div>`;
};

const trMoves=()=>[...TR.auto.filter(m=>!TR.removed.includes(m)),...TR.added.filter(m=>!TR.auto.includes(m)||TR.removed.includes(m))].filter((m,i,a)=>a.indexOf(m)===i);

function drawWRes(){const q=($("#wq").value||"").trim().toLowerCase();const ms=trMoves();$("#wres").innerHTML=q?Object.keys(MOVES).filter(m=>!ms.includes(m)&&m.toLowerCase().includes(q)).slice(0,5).map(m=>`<button data-act="trAdd" data-m="${esc(m)}"><span>${esc(m)}</span>${ic("plus")}</button>`).join("")||`<p class="muted" style="margin:0;font-size:calc(14px * var(--ts))">No movement matches "${esc(q)}".</p>`:""}
ACT.trRm=d=>{TR.added=TR.added.filter(m=>m!==d.m);if(TR.auto.includes(d.m)&&!TR.removed.includes(d.m))TR.removed.push(d.m);drawWMoves()};
