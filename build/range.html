<title>Range Mobility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: phone-app column (max 480px) — home carousel, step-by-step protocol builder, full-screen guided player. Deliberately dark-only, like a gym-floor app. */
:root{
  --bg:#0D1015;--surface:#161A21;--surface2:#1E232C;--line:#2A303A;
  --ink:#EEF1F5;--muted:#8B94A2;--accent:#3FD0C9;--accent-ink:#04201F;--accent-soft:#143534;
  --warn:#E6A94B;--bad:#F07167;--good:#4CC38A;
  --fig:#D5DCE5;--fig-torso:#EEF2F6;--fig-far:#5A6373;--fig-prop:#3A4250;--fig-prop-hi:#8A94A4;--fig-floor:#2A303A;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 96px;position:relative}
#app.sub{padding-bottom:32px}
h1,h2,h3{margin:0;font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.08;text-wrap:balance}
h1{font-size:30px}h2{font-size:23px}h3{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.brand{font-weight:800;font-stretch:125%;font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent)}
.hdr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent;transition:border-color .2s}
/* cover the strip behind the phone's status bar too, so content never shows above the header */
.hdr::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:calc(env(safe-area-inset-top,0px) + 1px);background:var(--bg)}
body.scrolled .hdr{border-bottom-color:var(--line)}
.hdr .brand{text-align:center}
.hdr button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.stack{display:grid;gap:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn:disabled{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.link{color:var(--accent);font-weight:700;font-size:14px}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--surface2)}
.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-good{color:var(--good)}.c-top{color:var(--accent)}
/* figure */
.fig{display:block;width:100%;height:auto}
.fig .seg{fill:none;stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round}
.fig .seg.torso{stroke:var(--fig-torso)}
.fig .seg.far{stroke:var(--fig-far)}
.fig .j{fill:var(--fig)}.fig .jf{fill:var(--fig-far)}
.fig .head{fill:var(--fig-torso)}
.fig .shadow{fill:#000;opacity:.25}
.fig .hl{fill:none;stroke:var(--accent);stroke-linecap:round}
.fig .hlc{fill:var(--accent)}
.fig .mat{fill:#1F252F;stroke:#2A303A}
.fig .pipe{stroke:var(--fig-prop-hi);stroke-width:4;stroke-linecap:round}
.fig .pipeend{fill:var(--fig-prop-hi)}
.fig .floor{stroke:var(--fig-floor);stroke-width:2}
.fig .prop{fill:none;stroke:var(--fig-prop);stroke-width:4;stroke-linecap:round}
.fig .propfill{fill:var(--fig-prop)}
.fig .band{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 3;opacity:.8}
/* home */
.greet{padding:20px 0 14px}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;scroll-padding-inline:16px}
.carousel::-webkit-scrollbar{display:none}
.pcard{scroll-snap-align:start;position:relative;height:clamp(330px,56vh,460px);border-radius:20px;overflow:hidden;text-align:center;display:grid;align-content:end;padding:22px;isolation:isolate}
.pcard .art{position:absolute;inset:0;z-index:-1;display:grid;place-items:center;padding:12% 8% 30%}
.pcard h2{font-size:30px}
.pcard p{margin:4px 0 0;font-size:14px;opacity:.85}
.g-activate{background:linear-gradient(165deg,#1C4A4A 0%,#11262A 55%,#0E1418 100%)}
.g-recover{background:linear-gradient(165deg,#2B2F5E 0%,#191C35 55%,#0F1119 100%)}
.g-daily{background:linear-gradient(165deg,#5A4636 0%,#30261F 55%,#15110F 100%)}
.g-target{background:linear-gradient(165deg,#4B2846 0%,#2A1828 55%,#120C12 100%)}
.g-rebuild{background:linear-gradient(165deg,#24504A 0%,#162B33 55%,#0E1418 100%)}
.g-a{background:linear-gradient(165deg,#24474F,#121B20)}.g-b{background:linear-gradient(165deg,#3A3460,#17162A)}.g-c{background:linear-gradient(165deg,#4E3E2C,#1B1611)}.g-d{background:linear-gradient(165deg,#25463A,#101C17)}
.dots{display:flex;justify-content:center;gap:6px;padding:14px 0}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:4px;text-align:left}
.tile b{font-size:30px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:1}
.banner{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
/* tabbar */
/* training */
.wlist{display:grid}
.wrow{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow .wd{display:grid;gap:4px;font-size:13px;justify-items:start}
.wrow .wt{display:grid;gap:6px;text-align:left;min-width:0}
.wrow .wt small{color:var(--muted);font-size:12px}
.wrow .wa{display:grid;gap:8px;justify-items:end}
.mchip{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--surface2)}
.chipset .mchip{white-space:nowrap}
.field{display:grid;gap:6px;min-width:0}
.field input,.field textarea{width:100%;background:var(--surface2);border:0;border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit;resize:vertical}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.nexttiles{display:grid;gap:10px}
.ntile{background:var(--surface);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left}
.ntile b{font-size:16px;font-weight:800;font-stretch:112%}
.ntile .go{grid-row:1/3;grid-column:2;color:var(--accent);font-weight:700;font-size:14px}
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:10}
#tabbar button{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px}
#tabbar button[aria-current="page"]{color:var(--ink)}
#tabbar .ic{width:26px;height:26px}
/* sport select */
.sports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;display:grid;align-content:end;padding:14px;text-align:left;isolation:isolate}
.scard .art{position:absolute;inset:0;z-index:-1;padding:10% 6% 34%;display:grid;place-items:center}
.scard b{font-size:18px;font-weight:800;font-stretch:112%}
.addsport{border:1.5px dashed var(--line);display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px}
.zcard{border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 120px;align-items:center;padding:16px;text-align:left;gap:8px}
/* wizard */
.whead{background:var(--surface);border-radius:16px;overflow:hidden}
.whead .hero{position:relative;height:120px;display:grid;align-content:end;padding:12px 14px;isolation:isolate}
.whead .hero .art{position:absolute;inset:0;z-index:-1;display:grid;justify-items:end;padding:6px 10px 0 40%}
.whead .hero b{font-size:21px;font-weight:800;font-stretch:112%;line-height:1.1}
.adapt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-size:13px}
.adapt .chips{display:flex;gap:6px}
.adapt .chips span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.adapt .chips span.on{background:var(--accent);color:var(--accent-ink)}
.adapt .chips .ic{width:17px;height:17px}
.stephead{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.stephead .bub{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.stephead .bub .ic{width:18px;height:18px}
.stephead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.mlist{display:grid}
.mlist div{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
.mlist button{width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip .ic{width:15px;height:15px}
.chip.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;padding:0 16px;border-radius:12px;background:var(--surface);font-weight:600;text-align:left;box-shadow:inset 0 0 0 1.5px transparent}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt .tag{color:var(--accent);font-size:12px;font-weight:700}
.equip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.eq{display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:600}
.eq span{width:100%;aspect-ratio:1;border-radius:16px;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.eq span .ic{width:34px;height:34px;stroke-width:1.5}
.eq.on span{color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.eq:not(.on){color:var(--muted)}
.sumrows{background:var(--surface);border-radius:16px;padding:6px 14px}
.srow{display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.srow .bub{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.srow .bub .ic{width:17px;height:17px}
.srow small{display:block;color:var(--muted);font-size:12px}
.srow .ok{color:var(--accent);opacity:0;transition:opacity .25s}
.srow.done .ok{opacity:1}
.srow .val{transition:opacity .25s}
.srow:not(.done) .val{opacity:0}
.preview{display:grid}
.preview div{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.preview span:first-child,.preview span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.preview .blk{margin:10px 0 2px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;border:0}
.preview .blk span{color:var(--muted)}
.preview .why{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.whybox{background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:13px;display:grid;gap:2px}
.whybox .eyebrow{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.needbars{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.needbars li{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.needbars .nb{display:flex;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.needbars b{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.evid p{margin:0;font-size:14px;line-height:1.5}
.src{margin:0;padding-left:18px;display:grid;gap:6px;font-size:12px;color:var(--muted)}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.steps b{color:var(--ink)}
.sheet a,.panel a{color:var(--accent);font-weight:700}
.bottomcta{position:sticky;bottom:0;padding:12px 0 calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent);display:grid;gap:10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:min(100%,480px);max-height:88%;border-radius:20px 20px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;overflow:hidden}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sheet .scroll{overflow:auto;min-height:0;display:grid;gap:14px;align-content:start}
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;box-shadow:inset 0 0 0 1.5px var(--accent)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;padding:13px 0;outline:none}
.res{display:grid}
.res button{text-align:left;padding:12px 2px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.res small{color:var(--muted)}
.selchip{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(18px);background:var(--accent-ink)}
/* player */
.player{position:fixed;inset:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pl{max-width:480px;height:100%;margin:0 auto;display:grid;grid-template-rows:auto auto auto 1fr auto}
.ptop{display:grid;grid-template-columns:44px 1fr 44px 44px;align-items:center;padding:4px 8px 0}
.ptop button{width:44px;height:44px;display:grid;place-items:center}
.segbar{display:flex;gap:3px;padding:0 16px 8px}
.segbar i{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
.segbar i.done{background:var(--accent)}
.segbar i b{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.stage{position:relative;background:linear-gradient(180deg,#1A2029,#12161C);aspect-ratio:240/150;max-height:34vh;width:100%;cursor:pointer;overflow:hidden}
.stage .fig{height:100%;width:auto;margin:0 auto}
.stage .ov{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;gap:48px;background:rgba(0,0,0,.45)}
.stage .ov button{display:grid;justify-items:center;gap:4px;font-size:13px;font-weight:700}
.stage .ov .ic{width:40px;height:40px}
.stage .sidetag{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:rgba(0,0,0,.4);padding:4px 8px;border-radius:6px}
.ptitle{text-align:center;padding:14px 16px 10px}
.ptitle h2{font-size:21px}
.ptitle .meta{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.pcards{display:grid;grid-auto-flow:column;grid-auto-columns:calc(100% - 44px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-inline:16px;scroll-padding-inline:16px;scrollbar-width:none;min-height:0}
.pcards::-webkit-scrollbar{display:none}
.icard{scroll-snap-align:start;background:var(--surface);border-radius:16px;padding:14px 16px;overflow:auto;min-height:0;display:grid;gap:10px;align-content:start}
.icard ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.icard ul li::marker{color:var(--accent)}
.icard .easy{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:13px}
.bm{display:block;width:100%;max-width:230px;margin:0 auto}
.bm .s{fill:#232934;stroke:#3A4250;stroke-width:1}
.bm .z.on{fill:var(--accent);stroke:var(--accent)}
.bm text{fill:var(--muted);font:700 9px var(--f);letter-spacing:.1em;text-transform:uppercase}
.ztags{display:flex;flex-wrap:wrap;gap:6px}
.ztags span{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.pctrl{display:grid;grid-template-columns:56px 1fr auto 1fr 56px;align-items:center;justify-items:center;padding:12px 12px 14px}
.pctrl .sm{width:48px;height:48px;display:grid;place-items:center;color:var(--ink)}
.pctrl .easybtn{font-size:11px;font-weight:700;line-height:1.1;text-align:center;color:var(--muted);width:56px;height:48px}
.pctrl .easybtn.on{color:var(--accent)}
.ringbtn{width:86px;height:86px;position:relative;display:grid;place-items:center}
.ringbtn svg.r{position:absolute;inset:0;transform:rotate(-90deg)}
.ringbtn .num{font-size:30px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums}
.ringbtn .ic{width:30px;height:30px}
.r .bg{fill:none;stroke:var(--line);stroke-width:4}
.r .fg{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.r .fg.ready{stroke:var(--muted)}
.pdots{display:flex;justify-content:center;gap:6px;padding-top:10px}
.pdots i{width:6px;height:6px;border-radius:3px;background:var(--line)}
.pdots i.on{background:var(--ink)}
/* library */
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;display:grid;align-content:start}
.lcard .art{background:var(--surface2);aspect-ratio:240/150}
.lcard div.t{padding:10px 12px 12px;display:grid;gap:2px}
.lcard b{font-size:14px;line-height:1.25}
.lcard small{color:var(--muted);font-size:12px}
.hscroll{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none}
.detailstage{background:linear-gradient(180deg,#1A2029,#12161C);border-radius:16px;overflow:hidden}
.panel{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
/* profile */
.score{display:flex;align-items:baseline;gap:10px}
.score b{font-size:64px;font-weight:800;font-stretch:112%;line-height:.9;font-variant-numeric:tabular-nums}
.radar{display:block;width:100%;max-width:300px;margin:0 auto}
.radar text{fill:var(--muted);font:700 10px var(--f);letter-spacing:.08em;text-transform:uppercase}
.bars{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:96px 1fr 30px;gap:10px;align-items:center;font-size:13px}
.bars .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}

let P=null,tick=null,audio=null,wake=null,ovTimer=null;
function beep(f=880,d=.12){if(!S.settings.sound||!audio)return;try{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.2,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function say(t){if(!S.settings.voice)return;try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){}}
/* Turns one plan item into timed segments. Mobility items have a hold; rehab items have a dose:
   hold (sets × seconds), rephold (sets × reps × seconds), pyramid (McGill-style 6-4-2 of 10 s holds),
   reps (tempo sets you tap to finish, then rest) or time (walking). */
function segsFor(it,i){
  const ex=LIBI[it.id],d=it.dose,out=[],first=i===0;
  if(!d){
    const bias=(S.sideBias||{})[ex.a];
    (ex.sides?["Right side","Left side"]:[null]).forEach((sd,k)=>{const tight=bias&&sd&&sd[0]===bias;out.push({type:"ready",i,side:sd,secs:first&&!k?S.settings.ready:5,label:k?"Switch sides":first?"Get ready":"Next up"});out.push({type:"hold",i,side:tight?sd+" · tighter, +50%":sd,hold:tight?Math.round(it.hold*1.5):it.hold})});
    return out;
  }
  out.push({type:"ready",i,secs:first?S.settings.ready:8,label:first?"Get ready":"Next up"});
  if(d.k==="time"){out.push({type:"hold",i,hold:d.secs,dosed:1,label:fmt(d.secs)+" walk"});return out}
  const sides=d.sides?["Right","Left"]:[null];
  const sets=d.k==="pyramid"?d.reps:Array.from({length:d.sets},()=>d.k==="reps"?(it.reps||d.reps):d.k==="rephold"?d.reps:1);
  const lab=(si,ri,reps,sd)=>[sets.length>1?`Set ${si+1}/${sets.length}`:"",reps>1?`Rep ${ri+1}/${reps}`:"",sd||""].filter(Boolean).join(" · ");
  sets.forEach((reps,si)=>sides.forEach((sd,k)=>{
    if(si>0||k>0)out.push({type:"ready",i,secs:k>0?(d.k==="reps"?10:6):(d.k==="reps"?(d.rest||60):d.k==="pyramid"?25:20),label:k>0?"Switch sides":"Rest"});
    if(d.k==="reps")out.push({type:"set",i,reps,side:sd,label:[lab(si,0,1,sd),"tap the ring when done"].filter(Boolean).join(" · ")});
    else for(let r=0;r<(d.k==="hold"?1:reps);r++){
      if(r>0)out.push({type:"ready",i,secs:3,label:"Relax",quiet:1});
      out.push({type:"hold",i,hold:d.secs,dosed:1,short:d.secs<10,side:sd,label:lab(si,r,d.k==="hold"?1:reps,sd)});
    }
  }));
  return out;
}
function doseText(it){
  const d=it.dose;if(!d)return"";
  const side=d.sides?" each side":"";
  if(d.k==="time")return`${Math.round(d.secs/60)} min`;
  if(d.k==="hold")return`${d.sets} × ${d.secs} s hold${side}`;
  if(d.k==="rephold")return`${d.sets>1?d.sets+" × ":""}${d.reps} reps · ${d.secs} s holds${side}`;
  if(d.k==="pyramid")return`${d.reps.join("-")} reps · 10 s holds${side}`;
  return`${d.sets} × ${it.reps||d.reps}${side}${d.tempo?` · tempo ${d.tempo.join("-")}`:""}${d.note?` · ${d.note}`:""}`;
}
function openPlayer(items,meta){

   <div class="segbar" id="segbar">${items.map(()=>"<i><b></b></i>").join("")}</div></div>
   <div class="stage" id="stage" data-act="pStage" role="button" aria-label="Show play and reset" tabindex="0"><div id="pfig"></div><span class="sidetag" id="pside" hidden></span><div class="ov" id="pov" hidden><button data-act="pToggle">${icf("play")}<span id="povl">Play</span></button><button data-act="pReset">${ic("reset")}Reset</button></div></div>
   <div class="ptitle"><h2 id="pname"></h2><div class="meta" id="pmeta"></div></div>
   <div style="display:grid;grid-template-rows:1fr auto;min-height:0"><div class="pcards" id="pcards"></div><div class="pdots" id="pdots"><i class="on"></i><i></i></div></div>
   <div class="pctrl">
     <button class="easybtn ${P.easy?"on":""}" id="peasy" data-act="pEasy" aria-pressed="${P.easy}">Easy<br>Mode</button>
     <button class="sm" data-act="pPrev" aria-label="Previous stretch">${icf("prev")}</button>
     <button class="ringbtn" data-act="pToggle" aria-label="Play or pause"><svg class="r" viewBox="0 0 86 86"><circle class="bg" cx="43" cy="43" r="39"/><circle class="fg" id="parc" cx="43" cy="43" r="39" stroke-dasharray="245" stroke-dashoffset="245"/></svg><span id="pcore"></span></button>
     <button class="sm" data-act="pNext" aria-label="Next stretch">${icf("next")}</button>
     <button class="sm" data-act="pList" aria-label="Routine list">${ic("list")}</button>
   </div></div></div>`;

    if(!flash)add("Rehab warm-up",preRehab());
    const mob=pickMobility(o,C,Math.max(60,left*(flash?.75:.6)),pool,state);add("Mobilise",mob.items);
    const core=o.minutes>=10?[CORE_PREP[Math.random()<.5?0:1]].map(([id,dose,why])=>({id,dose,why})):[];
    const prep=[];MOVE_PREP.forEach(p=>{if(moves.some(m=>p.moves.includes(m)))p.drills.forEach(([id,dose,why])=>{const m=moves.find(x=>p.moves.includes(x));prep.push({id,dose,why:`${m}: this ${why}.`})})});
    add("Activate",fit([...core,...prep],Math.max(0,left)));
  }else if(o.kind==="recover"){
    if(o.minutes>=10&&okEq("r_walk"))add("Downshift",[{id:"r_walk",dose:D_.time(120),why:"Easy movement first. Muscle contraction moves swelling and waste out of tired tissue better than ice or lying still."}]);
    pool=pool.filter(ex=>!ex.dyn);add("Long holds",pickMobility(o,C,left,pool,state).items);
  }else if(o.kind==="daily"){
    const mob=pickMobility(o,C,left*(flash?1:.72),pool,state);add("Mobility",mob.items);
    if(!flash){
      const wk=weekStretch(),top=AREAS.filter(a=>need[a.k]>.05).sort((a,b)=>((wk[b.k]||0)>=WEEK_TARGET)-((wk[a.k]||0)>=WEEK_TARGET)||need[b.k]-need[a.k]).slice(0,3);
      const str=[];top.forEach(a=>(END_RANGE[a.k]||[]).forEach(([id,dose])=>str.push({id,dose,why:`Strength at the end of your ${AN[a.k]} range. Loaded range work improves mobility as much as stretching and also protects against injury.${(wk[a.k]||0)>=WEEK_TARGET?" You've already done your 10 minutes of stretching here this week.":""}`})));
      add("Strength at end range",fit(str,left));
    }
  }else{
    const mob=pickMobility(o,C,left*(flash?1:.7),pool,state);
    // a zone with few stretches: repeat them as rounds instead of ending early
    let items=mob.items.slice(),used=mob.used,round=2;const cap=left*(flash?1:.7);
    while(items.length&&round<=4){const nx=mob.items.filter(it=>{const c=itemSecs(it);if(used+c>cap+8)return false;used+=c;return true});if(!nx.length)break;nx.forEach(it=>items.push({...it,why:`Round ${round}. Repeating builds more range than one long hold.`}));round++}
    add("Mobility",items);
    if(!flash)add("Lock it in",fit((END_RANGE[o.zone]||[]).map(([id,dose])=>({id,dose,why:`Use the range you just opened under load, so it carries into your lifts.`})),left));
  }
  const items=blocks.flatMap(b=>b.items);
  return{items,blocks,secs:items.reduce((t,it)=>t+itemSecs(it),0),need,parts,excluded:hooks.x.size?hooks.name:""};
}

function parseMoves(text){

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

const todayIso=()=>iso(new Date());

/* Back from a break: a gap of 7+ days since the last session with scores.
   Detraining research: strength holds for ~2-3 weeks off, but tissue tolerance and bar speed drop sooner,
   so the first week back runs about one program week behind (roughly 5% under the written %), then rejoins. */
function breakInfo(){
  const t=todayIso(),logged=S.training.filter(w=>w.date<t&&(w.result||w.done)&&!w.example).sort((a,b)=>b.date.localeCompare(a.date));
  if(!logged.length)return null;
  const last=logged[0],gap=daysFrom(last.date,t);if(gap<7)return null;
  const wk=list=>Math.max(0,...list.flatMap(w=>[...(w.text||"").matchAll(/week\s*(\d+)/gi)].map(m=>+m[1])));
  return{last,gap,lastWeek:wk(logged.slice(0,6)),nowWeek:wk(upcoming().slice(0,7)),until:addDays(t,6)};
}
function reentryFor(w){
  const b=breakInfo();if(!b||w.date>b.until||!w.moves.length)return"";
  const pcts=[...(w.text||"").matchAll(/(\d{2,3}(?:[.,]\d)?)\s*%/g)].map(m=>parseFloat(m[1].replace(",","."))).filter(v=>v>=50&&v<=100);
  if(pcts.length){const top=Math.max(...pcts);return`top sets around ${Math.round((top-5)*2)/2}% instead of ${top}%. Stop the build when the bar slows.`}
  return"keep it to RPE 7: same movements, a little lighter, nothing to failure.";
}

/* import: SugarWOD's own CSV export, or range-training.json from the sugarwod-sync tool */
function parseCsv(text){
  const s=String(text).replace(/^﻿/,""),rows=[];let row=[],f="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'&&s[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function csvDate(raw){
  const s=String(raw||"").trim(),p=n=>String(n).padStart(2,"0");let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${p(+m[2])}-${p(+m[3])}`;
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return`${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/))){let[a,b,y]=[+m[1],+m[2],+m[3]];if(y<100)y+=2000;const[mo,d]=a>12?[b,a]:[a,b];return`${y}-${p(mo)}-${p(d)}`}
  return null;
}
function importText(name,text){
  let rows=[];
  if(/\.json$/i.test(name)||/^\s*[{[]/.test(text)){
    const j=JSON.parse(text);const list=Array.isArray(j)?j:j.workouts;
    if(!Array.isArray(list))throw new Error("This JSON file has no workouts list. Use the file from `sugarwod-sync export`.");
    rows=list.map(w=>({date:w.date,title:w.title||"",text:w.text||w.description||"",result:w.result||""}));
  }else{
    const r=parseCsv(text),head=(r[0]||[]).map(h=>h.trim().toLowerCase());
    if(!head.includes("date")||!head.includes("description"))throw new Error("This CSV isn't a SugarWOD export. Use workouts.csv from Export Workouts on your SugarWOD profile.");
    const g=(row,k)=>{const i=head.indexOf(k);return i>=0?(row[i]||"").trim():""};
    rows=r.slice(1).filter(x=>x.some(c=>c.trim())).map(x=>({date:csvDate(g(x,"date")),title:g(x,"title"),text:g(x,"description"),result:g(x,"best_result_display")||g(x,"best_result_raw")}));
  }
  const r=mergeRows(rows,"import");save();return r;
}
function mergeRows(rows,source){
  const key=w=>`${w.date}|${(w.title||"").toLowerCase().trim()}|${(w.text||"").toLowerCase().replace(/\s+/g," ").slice(0,60)}`;
  const have=new Set(S.training.map(key));let added=0,skipped=0;const fresh=[],recent=addDays(todayIso(),-3);
  rows.forEach((w,i)=>{
    if(!w.date||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)){skipped++;return}
    if(have.has(key(w))){const o=S.training.find(x=>key(x)===key(w));if(o){if(w.result&&!o.result&&o.date>=recent)fresh.push(o);if(w.result)o.result=w.result;if(w.loggedAt)o.loggedAt=w.loggedAt}return}
    have.add(key(w));added++;
    const row={id:"i"+Date.now().toString(36)+i,date:w.date,title:w.title||"",text:w.text||"",result:w.result||"",loggedAt:w.loggedAt||null,source,moves:parseMoves((w.title||"")+"\n"+(w.text||"")),done:w.date<todayIso()};
    S.training.push(row);if(row.result&&row.date>=recent)fresh.push(row);
  });
  return{total:rows.length,added,skipped,fresh};
}
/* ---- SugarWOD auto-sync ----
   A scheduled GitHub workflow logs in to SugarWOD, reads the whiteboard and publishes an encrypted file
   (sugarwod.json.enc) next to the installed app. Range decrypts it here with your passphrase (AES-GCM,
   PBKDF2) and merges new workouts. The passphrase stays on this device. */
const SYNC_FILE="sugarwod.json.enc";
let syncAvail=null; // null = unknown, true/false after the first check
async function unsealBox(box,pass){
  const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(box.salt),iterations:box.iter||250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(box.iv)},key,u(box.ct))));
}
async function autoSync(force){
  S.sync=S.sync||{};
  if(!force&&S.sync.checked&&Date.now()-S.sync.checked<20*60e3)return;
  let box;
  try{const r=await fetch(SYNC_FILE+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;box=await r.json();syncAvail=box&&box.format==="range-sealed/1"}catch(e){syncAvail=false}
  if(!syncAvail||!S.sync.key){if(stack[stack.length-1].name==="training")render();return}
  try{
    const data=await unsealBox(box,S.sync.key);
    const r=mergeRows((data.workouts||[]).map(w=>({date:w.date,title:w.title,text:w.text,result:w.result,loggedAt:w.loggedAt})),"sugarwod-auto");
    S.sync={...S.sync,checked:Date.now(),syncedAt:data.syncedAt||null,count:(data.workouts||[]).length,lastAdded:r.added,error:""};
    if(r.fresh.length)recoverNudge(r.fresh);
  }catch(e){S.sync={...S.sync,checked:Date.now(),error:"The passphrase doesn't match. Use the same RANGE_SYNC_KEY you saved in GitHub."}}
  save();const top=stack[stack.length-1].name;if(top==="training"||top==="home")render();
}
const agoText=t=>{if(!t)return"never";const m=Math.round((Date.now()-new Date(t))/6e4);return m<2?"just now":m<60?`${m} min ago`:m<1440?`${Math.round(m/60)} h ago`:`${Math.round(m/1440)} d ago`};

/* ================= notifications =================
   "Scores in, time to recover". Two routes:
   1. In the app: when a sync brings in a score you just logged, Range shows a notification.
   2. In the background: the GitHub sync sends a Web Push (VAPID) to this phone, even with Range closed.
      Needs VAPID keys on GitHub (push-key.txt is published next to the app) and this phone's subscription
      saved as the PUSH_SUBSCRIPTION secret. On iPhone this works in the home-screen app (iOS 16.4+). */
const canNotify=()=>"Notification" in window;
const notifyOn=()=>canNotify()&&Notification.permission==="granted"&&S.notify&&S.notify.on;
async function showNote(title,body,url,tag){
  if(!canNotify()||Notification.permission!=="granted")return false;
  try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r){await r.showNotification(title,{body,tag,icon:"icon-192.png",data:{url}});return true}}catch(e){}
  try{const n=new Notification(title,{body,tag});n.onclick=()=>{focus();openUrl(url)};return true}catch(e){return false}
}
function recoverNudge(list){
  if(!notifyOn())return;
  const w=list.slice().sort((a,b)=>b.date.localeCompare(a.date))[0],f=focusOf({kind:"recover",moves:w.moves});
  showNote(`Scores in: ${wTitle(w)}`,`Nice work. Take 10 minutes to recover your ${f.map(k=>AN[k].toLowerCase()).join(" and ")||"body"}.`,`./#recover=${w.date}`,`recover-${w.date}`);
}
function openUrl(u){
  const m=String(u||"").match(/#recover=(\d{4}-\d{2}-\d{2})/);if(!m)return;
  const ws=S.training.filter(w=>w.date===m[1]&&w.moves.length);if(ws.length)recoverFrom(ws);
}
if(navigator.serviceWorker)navigator.serviceWorker.addEventListener("message",e=>{if(e.data&&e.data.type==="open")openUrl(e.data.url)});
ACT.notifTog=async()=>{
  if(!canNotify()){$("#ntMsg").textContent="This browser can't show notifications. On iPhone, add Range to your home screen first (Share → Add to Home Screen) and open it from there.";return}
  if(S.notify&&S.notify.on){S.notify={...S.notify,on:false};save();render();return}
  const p=await Notification.requestPermission();
  if(p!=="granted"){$("#ntMsg").textContent="Notifications are blocked. Allow them for Range in your phone's settings.";return}
  S.notify={...(S.notify||{}),on:true};save();render();
};
ACT.notifTest=async()=>{const w=scoredRecent(1)[0];const ok=await showNote(w?`Scores in: ${wTitle(w)}`:"Range","This is how the recover reminder looks. Tap it to start recovery.",w?`./#recover=${w.date}`:"./","range-test");$("#ntMsg").textContent=ok?"Sent. Check your notifications.":"Couldn't show it. Check that notifications are allowed for Range."};
const b64u=s=>{const p="=".repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/"));return Uint8Array.from(b,c=>c.charCodeAt(0))};
ACT.pushSetup=async()=>{
  const msg=$("#ntMsg");msg.textContent="Setting up…";
  let key="";try{const r=await fetch("push-key.txt",{cache:"no-store"});if(r.ok)key=(await r.text()).trim()}catch(e){}
  if(!key){msg.textContent="No push key next to the app yet. On your computer run: node src/cli.js vapid, add VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY as GitHub secrets, run the workflow once, then try again.";return}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    const box=$("#subBox");box.hidden=false;box.value=JSON.stringify(sub);box.select();
    try{await navigator.clipboard.writeText(box.value);msg.textContent="Copied. In GitHub add it as the secret PUSH_SUBSCRIPTION. From the next sync on, a new score sends you a recover reminder even when Range is closed."}
    catch(e){msg.textContent="Copy the text below and add it in GitHub as the secret PUSH_SUBSCRIPTION."}
  }catch(e){msg.textContent="This phone couldn't subscribe. On iPhone, open Range from the home screen icon (iOS 16.4 or later)."}
};

/* ================= Rebuild screens ================= */
const PAIN_OK=3;             // pain during a session up to 3/10 is fine (Rebuilding Milo, HSR guidance)
const PAIN_STOP=5;           // above 5/10 the session was too much (Silbernagel pain-monitoring model)
const dayMs=864e5;
function rbPhases(R,cls){return(R.phasesBy&&R.phasesBy[cls])||R.phases}
function rbItems(){
  const st=S.rehab,R=REGIONS[st.region],ph=rbPhases(R,st.cls)[st.phase];
  const weeks=Math.floor((Date.now()-st.phaseStart)/(7*dayMs));
  let items=ph.items.map(([id,dose])=>({id,dose,reps:dose.hsr?HSR[Math.min(weeks,HSR.length-1)]:undefined}));
  if(st.phase===0&&R.extraBy&&R.extraBy[st.cls])items=items.concat(R.extraBy[st.cls].map(([id,dose])=>({id,dose})));
  return items;
}
function painGrid(act,sel){return`<div class="painrow">${Array.from({length:11},(_,i)=>`<button class="pain${sel===i?" on":""} p${i<=PAIN_OK?"lo":i<=PAIN_STOP?"mid":"hi"}" data-act="${act}" data-v="${i}" aria-label="${i} out of 10">${i}</button>`).join("")}</div><div class="painlbl"><span>No pain</span><span>Worst imaginable</span></div>`}
function rbStatus(){
  const st=S.rehab,R=REGIONS[st.region],phs=rbPhases(R,st.cls),ph=phs[st.phase],logs=st.logs;
  if(!logs.length)return{k:"start",t:"Rate your test movement before each session. Range uses it to decide when to hold back and when to move on."};
  const last=logs[logs.length-1],prev=logs[logs.length-2];
  if((last.sessionPain??0)>PAIN_STOP||(prev&&last.testPain>=prev.testPain+2))return{k:"back",t:`Back off. ${last.sessionPain>PAIN_STOP?`Pain reached ${last.sessionPain}/10 during the session.`:`Your test movement went from ${prev.testPain} to ${last.testPain}.`} Repeat the previous level or use about 20% less load next time, and keep pain at ${PAIN_OK}/10 or lower.`};
  const days=(Date.now()-st.started)/dayMs;
  if(days>=21&&logs.length>=6){const a=logs.slice(0,3).reduce((t,l)=>t+l.testPain,0)/3,b=logs.slice(-3).reduce((t,l)=>t+l.testPain,0)/3;if(a-b<1)return{k:"stuck",t:"Three weeks without real change. See a physiotherapist. They can find what a self-screen misses."}}
  const inPhase=logs.filter(l=>l.phase===st.phase),last3=inPhase.slice(-3);
  const phaseDays=(Date.now()-st.phaseStart)/dayMs;
  if(phaseDays>=ph.min&&last3.length>=3&&last3.every(l=>l.testPain<=PAIN_OK&&(l.sessionPain??0)<=PAIN_OK)){
    return ph.last?{k:"done",t:"You've met the goals of the final phase. Keep 1–2 sessions a week as maintenance."}:{k:"ready",t:`Ready for phase ${st.phase+2}: ${phs[st.phase+1].n}. Your last three sessions stayed at ${PAIN_OK}/10 or lower.`};
  }
  const left=Math.max(0,Math.ceil(ph.min-phaseDays));
  return{k:"ok",t:`On track.${left?` At least ${left} more day${left===1?"":"s"} in this phase.`:""} Pain up to ${PAIN_OK}/10 during sessions is fine if it's no worse the next morning.`};
}
function spark(logs){
  if(logs.length<2)return"";
  const w=280,h=70,pad=8,n=logs.length,x=i=>pad+i*(w-2*pad)/(n-1),y=v=>h-pad-v/10*(h-2*pad);
  const pts=logs.map((l,i)=>`${x(i).toFixed(1)},${y(l.testPain).toFixed(1)}`).join(" ");
  const L=logs[n-1];
  return`<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Test movement pain over ${n} sessions, latest ${L.testPain} out of 10">
   <line x1="${pad}" x2="${w-pad}" y1="${y(PAIN_OK)}" y2="${y(PAIN_OK)}" class="sl"/><text x="${w-pad}" y="${y(PAIN_OK)-4}" text-anchor="end" class="st">${PAIN_OK}/10</text>
   <polyline points="${pts}" class="sp"/>${logs.map((l,i)=>`<circle cx="${x(i)}" cy="${y(l.testPain)}" r="${i===n-1?4:2.5}" class="sd"/>`).join("")}</svg>`;
}
SCREENS.rebuild=()=>{
  const head=`<div class="hdr" style="grid-template-columns:1fr"><div class="brand">Range<b>.</b></div></div>`;
  if(!S.rehab)return head+`<div class="stack" style="padding-top:8px">

ACT.rbAns=d=>{const R=REGIONS[RB.r],q=R.screens[RB.step];

function rbClassify(){
  const R=REGIONS[RB.r],votes={},flags={};
  const w=o=>o?Object.entries(o[1]).reduce((t,[k,v])=>t+(k.startsWith("_")?1:v),0):0,sideW={R:0,L:0};
  R.screens.forEach((q,i)=>{let a=RB.ans[i];
    if(q.side&&a&&typeof a==="object"){const oR=q.o[a.R],oL=q.o[a.L];sideW.R+=w(oR);sideW.L+=w(oL);a=w(oL)>w(oR)?a.L:a.R}
    const o=q.o[a];if(!o)return;for(const[k,v]of Object.entries(o[1])){if(k.startsWith("_"))flags[k]=1;else votes[k]=(votes[k]||0)+v}});
  const keys=Object.keys(R.classes),best=keys.slice().sort((a,b)=>(votes[b]||0)-(votes[a]||0))[0];
  const side=sideW.R>sideW.L?"right":sideW.L>sideW.R?"left":sideW.R>0?"both":null;
  return{cls:best,clear:(votes[best]||0)>0,votes,flags,side};
}

  const R=REGIONS[RB.r],res=rbClassify(),C=R.classes[res.cls],phs=rbPhases(R,res.cls),notes=[];

  RB.result={...res,notes};

  if(!ED.name){$("#edMsg").textContent="Give the protocol a name.";$("#edName").focus();return}
  if(!ED.items.length){$("#edMsg").textContent="Add at least one exercise.";return}
  if(ED.id){const i=S.myProtocols.findIndex(x=>x.id===ED.id);S.myProtocols[i]={...S.myProtocols[i],...ED}}
  else S.myProtocols.push({...ED,id:"p"+Date.now().toString(36),created:Date.now(),logs:[]});
  save();ED=null;stack=[{name:"rebuild",p:{}}];render();scrollTo(0,0)};
ACT.edDel=()=>sheet(`<h3>Delete this protocol?</h3><div class="scroll"><p class="muted" style="margin:0">Its pain log is deleted too.</p></div><div style="display:grid;gap:8px"><button class="btn" style="background:var(--bad)" data-act="edDelYes">Delete</button><button class="btn sec" data-act="closeSheet">Keep it</button></div>`);
ACT.edDelYes=()=>{S.myProtocols=S.myProtocols.filter(x=>x.id!==ED.id);save();ED=null;closeSheet();stack=[{name:"rebuild",p:{}}];render()};
ACT.myStart=d=>{const p=S.myProtocols.find(x=>x.id===d.id);if(!p)return;
  const run=t=>openPlayer(p.items.map(it=>({id:it.id,dose:it.dose})),{kind:"rehab",title:p.name,proto:p.id,...t});
  if(p.test&&p.test.n)testSheet({n:p.test.n,how:p.test.how,fig:p.test.fig,side:p.test.side,optional:true},run);else run({testPain:null})};
const myProtosPanel=()=>`<div class="stack" style="gap:8px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="eyebrow">My protocols · from your physio</span><button class="link" data-act="myNew">${ic("plus","")} Add</button></div>
  ${S.myProtocols.length?S.myProtocols.map(p=>{const L=(p.logs||[]).slice(-1)[0];return`<div class="panel">
   <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><h3>${esc(p.name)}</h3><button class="link" data-act="myEdit" data-id="${p.id}">Edit</button></div>
   <p class="muted" style="margin:0;font-size:14px">${[p.from,p.freq,`${p.items.length} exercise${p.items.length===1?"":"s"}`].filter(Boolean).map(esc).join(" · ")}</p>
   <div class="rxlist">${p.items.map(it=>{const e=LIBI[it.id];return e?`<button class="rx" data-act="openEx" data-id="${e.id}"><span class="th">${fig(e.fig||e.id,null,{zones:e.z,t:.8})}</span><span><b>${esc(e.n)}</b><small>${esc(doseText(it))}</small></span></button>`:""}).join("")}</div>
   ${p.notes?`<div class="note-warn">${esc(p.notes)}</div>`:""}
   ${(p.logs||[]).length>1?spark(p.logs):L?`<p class="muted" style="margin:0;font-size:13px">Last session ${new Date(L.at).toLocaleDateString()}${L.sessionPain!=null?` · pain ${L.sessionPain}/10`:""}</p>`:""}
   <button class="btn" data-act="myStart" data-id="${p.id}">${icf("play")}Start</button></div>`}).join(""):`<button class="panel" data-act="myNew" style="text-align:left"><b>Got exercises from a physiotherapist?</b><span class="muted" style="font-size:14px">Add them here and Range guides you through them with demos, timers and a pain log.</span></button>`}</div>`;

/* ================= profile ================= */
function radar(sc){
  const cx=100,cy=100,R=78,n=AREAS.length;const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let g="";[25,50,75,100].forEach(v=>{g+=`<polygon points="${AREAS.map((_,i)=>pt(i,R*v/100).join(",")).join(" ")}" style="fill:none;stroke:var(--line)"/>`});
  AREAS.forEach((a,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)"/>`;const[lx,ly]=pt(i,R+16);g+=`<text x="${lx}" y="${ly+3}" text-anchor="${Math.abs(lx-cx)<5?"middle":lx>cx?"start":"end"}">${a.n}</text>`});
  g+=`<polygon points="${AREAS.map((a,i)=>pt(i,R*sc[a.k]/100).join(",")).join(" ")}" style="fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round"/>`;
  AREAS.forEach((a,i)=>{const[x,y]=pt(i,R*sc[a.k]/100);g+=`<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--accent)"/>`});
  return `<svg class="radar" viewBox="-44 -8 288 216" role="img" aria-label="Mobility scores by area">${g}</svg>`;
}
const KN={activate:"Activate",recover:"Recover",daily:"Daily",target:"Target",single:"Single stretch"};
SCREENS.profile=()=>{
  const sc=scores(),ov=overall(sc),lv=level(ov),last=S.tests[S.tests.length-1];
  const left=last?30-Math.floor((Date.now()-last.at)/864e5):0;
  const wk=Date.now()-7*864e5;
  return `<div class="hdr" style="grid-template-columns:1fr"><div class="brand">Range<b>.</b></div></div>
  <div class="stack" style="padding-top:8px">
  <h1>Profile</h1>
  <div class="panel">
    <span class="eyebrow">Mobility score${S.scores?"":" · example"}</span>
    <div class="score"><b>${ov}</b><span class="pill ${lv.c}">${lv.t}</span></div>
    ${radar(sc)}
    <ul class="bars">${AREAS.map(a=>{const v=sc[a.k],l=level(v);return`<li><span>${a.n}</span><span class="tr"><i style="width:${v}%;background:${l.v}"></i></span><b>${v}</b></li>`}).join("")}</ul>
    ${last&&left>0?`<p class="muted" style="margin:0;font-size:13px">Last tested ${new Date(last.at).toLocaleDateString()}. Your next test is due in ${left} day${left===1?"":"s"}.</p><button class="btn sec" data-act="openTest">Retest early</button>`:`<button class="btn" data-act="openTest">Test my mobility</button>`}
  </div>
  <div class="stats3">
    <div class="tile"><span class="eyebrow">Streak</span><b>${streak()}</b></div>
    <div class="tile"><span class="eyebrow">Min / week</span><b>${S.sessions.filter(s=>s.at>=wk).reduce((t,s)=>t+s.mins,0)}</b></div>
    <div class="tile"><span class="eyebrow">Sessions</span><b>${S.sessions.length}</b></div>
  </div>
  <div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline"><h3>Stretching this week</h3><span class="muted" style="font-size:12px">Target 10 min per area</span></div>
    <ul class="bars">${(()=>{const wk=weekStretch();return AREAS.map(a=>{const m=(wk[a.k]||0)/60,v=Math.min(100,m/10*100);return`<li><span>${a.n}</span><span class="tr"><i style="width:${v}%;background:${m>=10?"var(--good)":"var(--accent)"}"></i></span><b>${m.toFixed(m<10&&m>0?1:0)}</b></li>`}).join("")})()}</ul>
    <p class="muted" style="margin:0;font-size:12px">Static stretching gains level off at about 10 minutes per area per week. Past that, Daily sessions move on to other areas.</p></div>
  <button class="btn sec" data-act="howItWorks">How Range works</button>
  <div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h3>My sports</h3><button class="link" data-act="sportsSheet">Edit</button></div>
    <div class="chipset">${S.sports.map(k=>`<span class="chip">${SPI[k].n}</span>`).join("")}</div></div>
  <div class="panel"><h3>My equipment</h3><div class="chipset">${EQUIP.map(e=>`<button class="chip ${S.equip.includes(e.k)?"on":""}" data-act="profEq" data-e="${e.k}">${ic(e.k)}${e.n}</button>`).join("")}</div></div>
  <div class="panel"><h3>Player</h3>
    <button class="toggle" data-act="setTog" data-k="sound"><span>Sound cues</span><span class="sw ${S.settings.sound?"on":""}"></span></button>
    <button class="toggle" data-act="setTog" data-k="voice"><span>Voice coach</span><span class="sw ${S.settings.voice?"on":""}"></span></button>
    <button class="toggle" data-act="setTog" data-k="easy"><span>Start in Easy Mode</span><span class="sw ${S.settings.easy?"on":""}"></span></button>
    <div class="toggle" style="border:0"><span>Get-ready countdown</span><span class="chipset">${[5,10,15].map(v=>`<button class="chip ${S.settings.ready===v?"on":""}" data-act="setReady" data-v="${v}">${v}s</button>`).join("")}</span></div>
  </div>
  ${notifPanel()}
  <div class="panel"><h3>Your data</h3><p class="muted" style="margin:0;font-size:14px">Range keeps everything on this device. To move it to the installed app or another phone, copy it here and paste it there.</p>
    <div class="frow"><button class="btn sec" style="flex:1" data-act="copyData">Copy my data</button><button class="btn sec" style="flex:1" data-act="pasteData">Paste data</button></div>
    <p id="dataMsg" class="muted" style="margin:0;font-size:13px" aria-live="polite"></p><textarea id="dataBox" class="field" rows="3" hidden style="width:100%;background:var(--surface2);color:var(--ink);border:0;border-radius:10px;padding:10px"></textarea></div>
  <div class="panel"><h3>History</h3><div class="hist">${S.sessions.length?S.sessions.slice(-12).reverse().map(s=>`<div><span>${esc(s.title||KN[s.kind]||"Session")}<br><small>${new Date(s.at).toLocaleDateString()} · ${s.count} stretches${s.feel!=null?" · felt "+["stiff","tight","OK","loose","great"][s.feel]:""}</small></span><span style="font-variant-numeric:tabular-nums">${s.mins} min</span></div>`).join(""):`<p class="muted" style="margin:0">No sessions yet. Finish a protocol from Today and it appears here.</p>`}</div></div>
  ${S.tests.length?`<div class="panel"><h3>Test history</h3><div class="hist">${S.tests.slice().reverse().map(t=>`<div><span>${new Date(t.at).toLocaleDateString()}<br><small>${AREAS.map(a=>a.n+" "+t.scores[a.k]).join(" · ")}</small></span><b style="font-variant-numeric:tabular-nums">${overall(t.scores)}</b></div>`).join("")}</div></div>`:""}
  </div>`;
};
ACT.howItWorks=()=>sheet(`<h3>How Range works</h3><div class="scroll evid">
 <p><b>Mobility sessions</b> split your time by need: your test scores, what today's movements require, what you trained in the last 3 days and what's coming up. Each area starts with a static stretch and ends with an active drill that uses the new range, so it carries into your lifts.</p>
 <p><b>Dose.</b> Before training, static holds stay at 30 seconds or less per muscle inside a dynamic warm-up, which has little to no effect on strength or power. Flexibility gains level off at about 4 minutes per session and 10 minutes per area per week. Strength training builds range about as well as stretching does, and unlike stretching it reduces injuries.</p>
 <p><b>Rebuild programs</b> follow the method in <i>Rebuilding Milo</i>: find what triggers the pain, classify it by movement rather than by scan, calm it down, then rebuild in stages. Tendons get heavy isometric holds first, then heavy slow resistance (4 sets of 15 down to 4 sets of 6 at a 3-1-3 tempo over several weeks), then springy work. Back programs use McGill's Big Three with walking.</p>
 <p><b>Pain rules.</b> Pain up to 3/10 during a session is fine if it settles by the next morning. Above 5/10, or a test movement that's 2 or more points worse the next day, means back off. These rules come from the pain-monitoring model used in tendon research.</p>
 <p class="muted">Range isn't a diagnosis. See a physiotherapist if pain is severe, getting worse, or not improving after 3 weeks.</p>
 <span class="eyebrow">Sources</span>
 <ul class="src">
  <li>Horschig A, Sonthana K. <i>Rebuilding Milo: The Lifter's Guide to Fixing Common Injuries.</i> Victory Belt, 2021.</li>
  <li>Ingram et al. Optimising the dose of static stretching to improve flexibility. <i>Sports Medicine</i>, 2025. <a href="https://repository.essex.ac.uk/29342/" target="_blank" rel="noopener">Link</a></li>
  <li>Behm et al. Acute effects of muscle stretching on physical performance, ROM and injury incidence. <i>Appl Physiol Nutr Metab</i>, 2016. <a href="https://nectar.northampton.ac.uk/id/eprint/8154/" target="_blank" rel="noopener">Link</a></li>
  <li>Afonso et al. Strength training versus stretching for improving range of motion. <i>Healthcare</i>, 2021. <a href="https://www2.mdpi.com/2227-9032/9/4/427" target="_blank" rel="noopener">Link</a></li>
  <li>Lauersen et al. Exercise interventions to prevent sports injuries. <i>BJSM</i>, 2014. <a href="https://bjsm.bmj.com/content/48/11/871" target="_blank" rel="noopener">Link</a></li>
  <li>Kongsgaard et al. Heavy slow resistance training in patellar tendinopathy. <i>Scand J Med Sci Sports</i>, 2009. <a href="https://pubmed.ncbi.nlm.nih.gov/19793213/" target="_blank" rel="noopener">Link</a></li>
  <li>Silbernagel et al. Continued sports activity using a pain-monitoring model in Achilles tendinopathy. <i>AJSM</i>, 2007. <a href="https://physicaltherapyfirst.com/blog/continued-sports-activity-using-a-pain-monitoring-model-during-rehabilitation-in-patients-with-achilles-tendinopathy/" target="_blank" rel="noopener">Summary</a></li>
  <li>Challoumas et al. Management of patellar tendinopathy: network meta-analysis. 2021. <a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8634001/" target="_blank" rel="noopener">Link</a></li>
  <li>Konrad et al. Foam rolling vs stretching for performance. <i>Front Physiol</i>, 2021. <a href="https://www.frontiersin.org/articles/10.3389/fphys.2021.720531/full" target="_blank" rel="noopener">Link</a></li>
 </ul></div><button class="btn sec" data-act="closeSheet">Close</button>`);
ACT.profEq=(d,el)=>{const i=S.equip.indexOf(d.e);if(i>=0)S.equip.splice(i,1);else S.equip.push(d.e);save();el.classList.toggle("on",S.equip.includes(d.e))};
ACT.setReady=d=>{S.settings.ready=+d.v;save();render()};

/* ================= mobility test ================= */
let T=null;
ACT.openTest=()=>{T={i:0,ans:{},side:{...(S.sideBias||{})}};const last=S.tests[S.tests.length-1];if(last&&last.ans)T.ans={...last.ans};drawTest()};
function drawTest(){
  document.body.style.overflow="hidden";
  if(T.i>=TEST.length){
    const sc={};TEST.forEach(q=>sc[q.k]=OPT_SCORES[T.ans[q.k]]);const ov=overall(sc),lv=level(ov);
    const weakest=AREAS.slice().sort((a,b)=>sc[a.k]-sc[b.k]).slice(0,2).map(a=>a.n).join(" and ");
    $("#layer").innerHTML=`<div class="full"><div class="inner"><div class="hdr" style="grid-template-columns:1fr"><div class="brand" style="text-align:center">Range<b>.</b></div></div>
    <div class="stack" style="align-content:start"><span class="eyebrow">Your results</span><div class="score"><b>${ov}</b><span class="pill ${lv.c}">${lv.t}</span></div>
    <p class="muted" style="margin:0">Your routines will now spend the most time on your ${weakest}.</p>${radar(sc)}
    <ul class="bars">${AREAS.map(a=>{const v=sc[a.k],l=level(v);return`<li><span>${a.n}</span><span class="tr"><i style="width:${v}%;background:${l.v}"></i></span><b>${v}</b></li>`}).join("")}</ul></div>
    <div class="bottomcta"><button class="btn" data-act="testSave">Save my scores</button><button class="btn sec" data-act="testExit">Discard</button></div></div></div>`;
    return;
  }
  const q=TEST[T.i];
  $("#layer").innerHTML=`<div class="full"><div class="inner">
   <div><div class="hdr"><button data-act="testBack" aria-label="Back">${ic("back")}</button><div class="brand">Range<b>.</b></div><button data-act="testExit" aria-label="Close test">${ic("x")}</button></div>
   <div class="tprog">${TEST.map((_,k)=>`<i class="${k<=T.i?"on":""}"></i>`).join("")}</div></div>
   <div class="stack" style="align-content:start">
    <span class="eyebrow">Position ${T.i+1} of ${TEST.length} · ${AN[q.k]}</span><h1>${q.t}</h1>
    <div class="detailstage">${fig(TEST_FIG[q.k],null,{anim:true,zones:AREA_ZONES[q.k]})}</div>
    <p class="muted" style="margin:0">${q.how}</p>
    <div class="stack" style="gap:8px">${q.o.map((o,k)=>`<button class="opt ${T.ans[q.k]===k?"on":""}" data-act="testPick" data-k="${k}"><span>${o}</span><span class="muted" style="font-size:12px">Level ${k+1}</span></button>`).join("")}</div>
    ${["ankles","hips","shoulders","thoracic"].includes(q.k)?`<div class="stack" style="gap:6px"><span class="eyebrow">Test both sides. Which is tighter?</span><div class="chipset">${[["L","Left"],["","About even"],["R","Right"]].map(([v,n])=>`<button class="chip ${(T.side[q.k]||"")===v?"on":""}" data-act="testSide" data-v="${v}">${n}</button>`).join("")}</div></div>`:""}
   </div>
   <div class="bottomcta"><button class="btn" data-act="testNext" ${T.ans[q.k]==null?"disabled":""}>${T.i===TEST.length-1?"See my results":"Next position"}</button></div>
  </div></div>`;
  $(".full").scrollTop=0;
}
ACT.testSide=d=>{T.side[TEST[T.i].k]=d.v;drawTest()};
ACT.testPick=d=>{T.ans[TEST[T.i].k]=+d.k;drawTest()};
ACT.testNext=()=>{T.i++;drawTest()};
ACT.testBack=()=>{if(T.i>0){T.i--;drawTest()}else ACT.testExit()};
ACT.testExit=()=>{T=null;$("#layer").innerHTML="";document.body.style.overflow=""};
ACT.testSave=()=>{const sc={};TEST.forEach(q=>sc[q.k]=OPT_SCORES[T.ans[q.k]]);S.scores=sc;S.sideBias={...T.side};S.tests.push({at:Date.now(),scores:sc,ans:T.ans,side:{...T.side}});save();ACT.testExit();render()};

/* keyboard for player */
document.addEventListener("keydown",e=>{
  if(!P||$("#psheet"))return;
  if(e.code==="Space"&&e.target.tagName!=="BUTTON"){e.preventDefault();setRunning(!P.running)}
  if(e.key==="ArrowRight")ACT.pNext();if(e.key==="ArrowLeft")ACT.pPrev();
});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"&&P&&P.running&&!wake){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}});

addEventListener("scroll",()=>document.body.classList.toggle("scrolled",scrollY>4),{passive:true});
setTimeout(()=>autoSync(false),400);
if(/^#recover=/.test(location.hash)){const u=location.hash;history.replaceState(null,"",location.pathname+location.search);setTimeout(()=>openUrl(u),300)}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")autoSync(false)});

/* move data between the web link and the installed app (each keeps its own storage) */
ACT.copyData=async()=>{
  const txt=JSON.stringify({format:"range-backup/1",data:{...S,sync:{}}});
  const msg=$("#dataMsg");
  try{await navigator.clipboard.writeText(txt);msg.textContent="Copied. Open Range where you want the data, go to Profile → Paste data."}
  catch(e){const ta=$("#dataBox");ta.value=txt;ta.hidden=false;ta.select();msg.textContent="Your browser blocked copying. Select all the text in the box and copy it."}
};
ACT.pasteData=()=>{sheet(`<h3>Paste data</h3><div class="scroll"><p class="muted" style="margin:0;font-size:14px">Paste the data you copied from Range on another device. This replaces what's here.</p>
  <label class="field"><span class="eyebrow">Range data</span><textarea id="pasteBox" rows="6" placeholder='{"format":"range-backup/1", …}'></textarea></label><p id="pasteMsg" class="muted" style="margin:0;font-size:14px"></p></div>
  <button class="btn" data-act="applyPaste">Replace my data</button>`)};
ACT.applyPaste=()=>{
  try{const j=JSON.parse($("#pasteBox").value);if(j.format!=="range-backup/1"||!j.data)throw 0;
    S=Object.assign(S,j.data);save();closeSheet();render()}
  catch(e){$("#pasteMsg").textContent="That isn't Range data. Copy it again with Profile → Copy my data.";$("#pasteMsg").style.color="var(--bad)"}
};
render();
</script>
