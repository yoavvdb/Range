/* import: SugarWOD's own CSV export, or range-training.json from the sugarwod-sync tool */
function parseCsv(text){
  const s=String(text).replace(/^﻿/,""),rows=[];let row=[],f="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'&&s[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  return rows;
}
function csvDate(raw){
  const s=String(raw||"").trim(),p=n=>String(n).padStart(2,"0");let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return`${m[1]}-${p(+m[2])}-${p(+m[3])}`;
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return`${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/))){let[a,b,y]=[+m[1],+m[2],+m[3]];if(y<100)y+=2000;const[mo,d]=a>12?[b,a]:[a,b];return`${y}-${p(mo)}-${p(d)}`}
  return null;
}
function importText(name,text){
  let rows=[];
  if(/\.json$/i.test(name)||/^\s*[{[]/.test(text)){
    const j=JSON.parse(text);const list=Array.isArray(j)?j:j.workouts;
    if(!Array.isArray(list))throw new Error("This JSON file has no workouts list. Use the file from `sugarwod-sync export`.");
    rows=list.map(w=>({date:w.date,title:w.title||"",text:w.text||w.description||"",result:w.result||""}));
  }else{
    const r=parseCsv(text),head=(r[0]||[]).map(h=>h.trim().toLowerCase());
    if(!head.includes("date")||!head.includes("description"))throw new Error("This CSV isn't a SugarWOD export. Use workouts.csv from Export Workouts on your SugarWOD profile.");
    const g=(row,k)=>{const i=head.indexOf(k);return i>=0?(row[i]||"").trim():""};
    rows=r.slice(1).filter(x=>x.some(c=>c.trim())).map(x=>({date:csvDate(g(x,"date")),title:g(x,"title"),text:g(x,"description"),result:g(x,"best_result_display")||g(x,"best_result_raw")}));
  }
  const r=mergeRows(rows,"import");save();return r;
}
const wKey=w=>`${w.date}|${(w.title||"").toLowerCase().trim()}|${(w.text||"").toLowerCase().replace(/\s+/g," ").slice(0,60)}`;
function mergeRows(rows,source){
  const key=wKey;
  const have=new Set(S.training.map(key));let added=0,skipped=0;const fresh=[],recent=addDays(todayIso(),-3);
  rows.forEach((w,i)=>{
    if(!w.date||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)){skipped++;return}
    if(have.has(key(w))){const o=S.training.find(x=>key(x)===key(w));if(o){const nowScored=w.result&&(!o.result||(w.loggedAt&&w.loggedAt!==o.loggedAt));if(w.result)o.result=w.result;if(w.loggedAt)o.loggedAt=w.loggedAt;if(nowScored&&doneDay(o)>=recent)fresh.push(o)}return}
    // a score for a day we only had the programming for: replace that synced entry instead of adding a second one
    const plan=w.result&&S.training.find(x=>x.date===w.date&&x.source===source&&!x.result);
    if(plan){plan.title=w.title||"";plan.text=w.text||"";plan.result=w.result;plan.loggedAt=w.loggedAt||null;plan.moves=parseMoves(plan.title+"\n"+plan.text);have.add(key(w));if(doneDay(plan)>=recent)fresh.push(plan);return}
    have.add(key(w));added++;
    const row={id:"i"+Date.now().toString(36)+i,date:w.date,title:w.title||"",text:w.text||"",result:w.result||"",loggedAt:w.loggedAt||null,source,moves:parseMoves((w.title||"")+"\n"+(w.text||"")+"\n"+(w.extra||"")),done:w.date<todayIso()};
    S.training.push(row);if(row.result&&doneDay(row)>=recent)fresh.push(row);
  });
  return{total:rows.length,added,skipped,fresh};
}
/* ---- Workout feed ----
   An hourly GitHub workflow reads the gym's public workout feed (no login, no key) and publishes it as wod.json
   next to the app. Range loads it here, keeps your chosen track (RX-Club by default) and turns each day into a workout. */
// inside the native iOS shell the page is a local file, so the workout feed is read from the web
const SYNC_FILE=location.protocol==="capacitor:"?"https://yoavvdb.github.io/Range/wod.json":"wod.json";
let syncAvail=null; // null = unknown, true/false after the first check
// AES-GCM + PBKDF2 unseal: used by the encrypted GitHub backup of your own data
async function unsealBox(box,pass){
  const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(box.salt),iterations:box.iter||250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(box.iv)},key,u(box.ct))));
}
const FEED_SKIP=/^(rest day|full rest day)$/i;
function feedRows(data,track){
  const rows=[];
  for(const [date,items] of Object.entries(data.days||{})){
    const mine=(items||[]).filter(w=>w.track===track).sort((a,b)=>(a.order||0)-(b.order||0));
    if(!mine.length)continue;
    const body=mine.filter(w=>w.text);
    const title=(body.length?body:mine).slice(0,2).map(w=>w.title.replace(/:$/,"")).filter(Boolean).join(" + ")||"Workout";
    const text=mine.map(w=>(w.title?w.title+"\n":"")+(w.text||"")).join("\n\n");
    // the gym's own movement tags are loose ("Clean" on a clean prep), so they only fill in when the text names nothing we know
    const extra=parseMoves(title+"\n"+text).length?"":mine.flatMap(w=>w.movements||[]).join("\n");
    rows.push({date,title,text,extra});
  }
  return rows;
}
async function autoSync(force){
  if(API)return acctPull(force);
  S.sync=S.sync||{};
  if(!force&&S.sync.feed&&S.sync.checked&&Date.now()-S.sync.checked<20*60e3)return; // the first run of the new feed always goes through
  let data;
  try{const r=await fetch(SYNC_FILE+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;data=await r.json();syncAvail=!!(data&&data.format==="range-wod/1")}catch(e){syncAvail=false}
  if(!syncAvail){if(stack[stack.length-1].name==="profile")render();return}
  try{
    // the tracks the gym programs, biggest first; RX-Club unless you picked another
    const cnt={};Object.values(data.days||{}).forEach(l=>l.forEach(w=>{if(w.track)cnt[w.track]=(cnt[w.track]||0)+1}));
    const tracks=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
    let track=S.sync.track;if(!track||!tracks.includes(track))track=tracks.includes("RX-Club")?"RX-Club":tracks[0]||"";
    const rows=feedRows(data,track);
    // the feed is the whiteboard as it is now: drop earlier synced programming (the old login sync included) that is no longer on it,
    // unless you ticked it, so the next session is never an outdated version
    const inFeed=new Set(rows.map(w=>wKey({date:w.date,title:w.title,text:w.text})));
    // another track's workouts go at once (even ones you ticked), so Activate and Recover only ever see the track you follow
    S.training=S.training.filter(w=>!(w.source==="sugarwod-public"&&w.track&&w.track!==track)&&!((w.source==="sugarwod-public"||(w.source==="sugarwod-auto"&&w.date>=todayIso()))&&!w.result&&!w.marked&&!inFeed.has(wKey(w))));
    const r=mergeRows(rows,"sugarwod-public");
    S.training.forEach(w=>{if(w.source==="sugarwod-public"&&!w.track)w.track=track});
    S.sync={...S.sync,feed:1,track,tracks,checked:Date.now(),syncedAt:data.fetchedAt||null,count:rows.length,lastAdded:r.added,error:""};
  }catch(e){S.sync={...S.sync,checked:Date.now(),error:"Couldn't read the workout feed."}}

}

function radar(sc){

  AREAS.forEach((a,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)"/>`;const[lx,ly]=pt(i,R+16);g+=`<text x="${lx}" y="${ly+3}" text-anchor="${Math.abs(lx-cx)<5?"middle":lx>cx?"start":"end"}">${a.n}</text>`});
  g+=`<polygon points="${AREAS.map((a,i)=>pt(i,R*sc[a.k]/100).join(",")).join(" ")}" style="fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round"/>`;

ACT.howItWorks=()=>sheet(`<h3>How Range Works</h3><div class="scroll evid">
 <p><b>Mobility sessions</b> split your time by need: your test scores, what today's movements require, what you trained in the last 3 days and what's coming up. Each area starts with a static stretch and ends with an active drill that uses the new range, so it carries into your lifts.</p>
 <p><b>Dose.</b> Before training, static holds stay at 30 seconds or less per muscle inside a dynamic warm-up, which has little to no effect on strength or power. Flexibility gains level off at about 4 minutes per session and 10 minutes per area per week. Strength training builds range about as well as stretching does, and unlike stretching it reduces injuries.</p>
 <p><b>Rebuild programs</b> follow the method in <i>Rebuilding Milo</i>: find what triggers the pain, classify it by movement rather than by scan, calm it down, then rebuild in stages. Tendons get heavy isometric holds first, then heavy slow resistance (4 sets of 15 down to 4 sets of 6 at a 3-1-3 tempo over several weeks), then springy work. Back programs use McGill's Big Three with walking.</p>
 <p><b>Pain rules.</b> Pain up to 3/10 during a session is fine if it settles by the next morning. Above 5/10, or a test movement that's 2 or more points worse the next day, means back off. These rules come from the pain-monitoring model used in tendon research.</p>
 <p class="muted">Range isn't a diagnosis. See a physiotherapist if pain is severe, getting worse, or not improving after 3 weeks.</p>
 <span class="eyebrow">Sources</span>
 <ul class="src">

  <li>Kongsgaard et al. Heavy slow resistance training in patellar tendinopathy. <i>Scand J Med Sci Sports</i>, 2009. <a href="https://pubmed.ncbi.nlm.nih.gov/19793213/" target="_blank" rel="noopener">Link</a></li>

// each check scores on its tighter side; an area is the weighted average of the checks that count toward it,
// and its tighter side is whichever side lost more across its one-sided checks
function testScores(ans){const sum={},wt={},lean={},side={},sc={};
  TEST.forEach(q=>{const r=ans[q.id+"R"],l=ans[q.id+"L"],v=q.uni?(r==null||l==null?null:Math.min(tScore(q,r),tScore(q,l))):tScore(q,ans[q.id]);if(v==null)return;
    Object.entries(q.w||{[q.k]:1}).forEach(([a,w])=>{sum[a]=(sum[a]||0)+v*w;wt[a]=(wt[a]||0)+w;if(q.uni)lean[a]=(lean[a]||0)+(tScore(q,l)-tScore(q,r))*w})});
  AREAS.forEach(({k})=>{sc[k]=wt[k]?Math.round(sum[k]/wt[k]):50;side[k]=lean[k]>0?"R":lean[k]<0?"L":""});
  return{sc,side}}
// answers are kept as you go (S.testDraft), so a reload or a closed tab picks the test up where you left it
const TDRAFT_MS=7*864e5,testDraft=()=>{const d=S.testDraft;return d&&d.ans&&Date.now()-(d.at||0)<TDRAFT_MS?d:null};

/* ================= backup to your GitHub repository =================
   After changes, Range saves your data (encrypted with your passphrase, the same RANGE_SYNC_KEY as the
   SugarWOD sync) to backup/range-backup.enc in your Range repository. On a new phone, a new app address or
   after anything wipes the browser's storage, connect once and restore. The token stays on this device. */
const BK_PATH="backup/range-backup.enc";
async function sealBox(obj,pass){
  const enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj))));
  const b=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
  return{format:"range-sealed/1",iter:250000,salt:b(salt),iv:b(iv),ct:b(ct)};
}
async function ghFile(cfg,method,body){
  const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${BK_PATH}`,{method,cache:"no-store",headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  if(method==="GET"&&r.status===404)return null;
  if(r.status===401)throw new Error("GitHub didn't accept the token. Create a new one (see the steps) and paste it again.");
  if(r.status===403||r.status===404)throw new Error("The token can't reach that repository. Check the name (username/repo) and that the token has Contents: Read and write for it.");
  if(!r.ok)throw new Error("GitHub said "+r.status+". Try again in a minute.");
  return r.json();
}
async function backupNow(){
  if(!BK||API)return;
  const data={...S};if(data.sync)data.sync={...data.sync,key:undefined}; // the passphrase itself isn't stored
  const box=await sealBox({format:"range-backup/1",at:Date.now(),data},BK.pass);

  tourPlace();requestAnimationFrame(()=>tourPlace());setTimeout(()=>{if(TOUR&&TOUR.i===i)tourPlace()},250);const nb=TOUR.root.querySelector("[data-act=tourNext]");nb&&nb.focus({preventScroll:true})}
function tourPlace(){if(!TOUR||TOUR.i<0)return;const st=TOUR.steps[TOUR.i],n=TOUR.steps.length,last=TOUR.i===n-1;
  if(!st.demo&&(stack.length>1||stack[0].name!==st.tab))return;let el=st.el();if(!tvis(el)){tourShow(st);el=st.el();if(!tvis(el))return}
  const root=TOUR.root,tip=root.querySelector(".ttip"),ins=tourInsets();
  // the visible part of the page: on iPhone the layout viewport can be wider than the screen, so use the visual viewport
  const vv=window.visualViewport,vx=vv?vv.offsetLeft:0,vy=vv?vv.offsetTop:0,vw=vv?vv.width:document.documentElement.clientWidth,vh=vv?vv.height:innerHeight;
  const tw=Math.min(448,vw-32);Object.assign(tip.style,{left:(vx+(vw-tw)/2)+"px",width:tw+"px"});
  if(tip.dataset.i!==String(TOUR.i)){tip.dataset.i=TOUR.i;tip.innerHTML=`<div class="tth"><span class="tdots" aria-label="Step ${TOUR.i+1} of ${n}">${TOUR.steps.map((_,k)=>`<i class="${k===TOUR.i?"on":k<TOUR.i?"done":""}"></i>`).join("")}</span>${last?"":`<button class="link muted" data-act="tourSkip">Skip</button>`}</div>
    <h3>${tval(st.t)}</h3><p>${tval(st.d)}</p>
    <div class="frow">${TOUR.i?`<button class="btn sec" data-act="tourBack">Back</button>`:""}<button class="btn" data-act="tourNext">${last?"Got It":TOUR.i?"Next":"Show Me"}</button></div>`}
  const tb=$("#tabbar"),tbr=!st.demo&&!tb.hidden&&tb.getBoundingClientRect(),hdr=st.demo?null:tq("#screen .hdr"),hb=hdr?hdr.getBoundingClientRect().bottom:0,sc=st.demo&&tq("#layer .full");
  const top0=Math.max(hb,vy+ins.t)+8,bot0=(tbr?Math.min(tbr.top,vy+vh):vy+vh-ins.b)-8,th=tip.offsetHeight,gap=12,pad=6;
  // the highlighted area: the element, plus the one it goes with (the test figure and its "This is:" line)
  const rectOf=()=>{const a=el.getBoundingClientRect(),w=st.with&&st.with();if(!tvis(w))return a;const b=w.getBoundingClientRect();return{top:Math.min(a.top,b.top),bottom:Math.max(a.bottom,b.bottom),left:Math.min(a.left,b.left),right:Math.max(a.right,b.right)}};
  let R=rectOf();
  // scroll the whole element into the visible part with room for the note (the page gets extra room at the bottom during
  // the tour, so a card near the end of a short page can still come up above the tab bar)
  const inH=!!(el.closest&&el.closest(".hdr")); // something in the header (the settings gear) stays where it is; the note goes below it
  const inT=!!(el.closest&&el.closest("#tabbar")); // a tab-bar button: ring it where it is, the note sits just above the bar
  if(!TOUR.scrolled){TOUR.scrolled=true;const fits=inH||inT||(R.top>=top0&&R.bottom+gap+th<=bot0)||(R.top-gap-th>=top0&&R.bottom<=bot0);
    if(!fits){const dy=R.top-top0-pad-2;if(sc)sc.scrollTop+=dy;else window.scrollTo({top:Math.max(0,scrollY+dy),behavior:"instant"});R=rectOf()}}
  // hug the element (6 px all round), clipped to the app column and to what's on screen
  const col=(sc?sc.querySelector(".inner"):$("#app")).getBoundingClientRect(),cl=Math.max(vx+4,col.left+16-pad),cr=Math.min(vx+vw-4,col.right-16+pad);
  const x=Math.max(cl,R.left-pad),w=Math.min(cr,R.right+pad)-x,y=inH?R.top-pad:Math.max(top0-pad,R.top-pad);
  let h=Math.min(R.bottom+pad,bot0+pad)-y,ty;
  if(bot0-(y+h)-gap>=th)ty=y+h+gap;else if(y-(top0-pad)-gap>=th)ty=y-gap-th;
  else{h=Math.max(48,bot0-th-gap-y);ty=Math.min(y+h+gap,bot0-th)}
  if(inH){h=R.bottom+pad-y;ty=y+h+gap}
  if(inT){const ty0=R.top-pad;Object.assign(root.querySelector(".tring").style,{});const holesT=[[R.left-pad,ty0,R.right-R.left+2*pad,R.bottom-R.top+2*pad,(parseFloat(getComputedStyle(el).borderTopLeftRadius)||14)+pad]];
    const W=innerWidth,H=innerHeight,svg=root.querySelector(".tdim");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    const rr=(X,Y,W2,H2,c)=>{c=Math.max(0,Math.min(c,W2/2,H2/2));return`M${X+c} ${Y}H${X+W2-c}A${c} ${c} 0 0 1 ${X+W2} ${Y+c}V${Y+H2-c}A${c} ${c} 0 0 1 ${X+W2-c} ${Y+H2}H${X+c}A${c} ${c} 0 0 1 ${X} ${Y+H2-c}V${Y+c}A${c} ${c} 0 0 1 ${X+c} ${Y}Z`};
    svg.querySelector("path").setAttribute("d",`M0 0H${W}V${H}H0Z`+holesT.map(o=>rr(...o)).join(""));const o=holesT[0];
    Object.assign(root.querySelector(".tring").style,{left:o[0]+"px",top:o[1]+"px",width:o[2]+"px",height:o[3]+"px",borderRadius:o[4]+"px"});
    tip.style.top=Math.max(top0,o[1]-gap-th)+"px";return}
  const rad=(parseFloat(getComputedStyle(el).borderTopLeftRadius)||6)+pad;
  const holes=[[x,y,w,h,rad]];
  const tab=tbr&&!st.demo&&st.tab!=="home"&&tb.querySelector(`[data-t=${st.tab}]`);if(tab){const q=tab.getBoundingClientRect();holes.push([q.left+2,q.top+2,q.width-4,q.height-4,12])}
  const rr=(X,Y,W,H,c)=>{c=Math.max(0,Math.min(c,W/2,H/2));return`M${X+c} ${Y}H${X+W-c}A${c} ${c} 0 0 1 ${X+W} ${Y+c}V${Y+H-c}A${c} ${c} 0 0 1 ${X+W-c} ${Y+H}H${X+c}A${c} ${c} 0 0 1 ${X} ${Y+H-c}V${Y+c}A${c} ${c} 0 0 1 ${X+c} ${Y}Z`};
  const W=innerWidth,H=innerHeight,svg=root.querySelector(".tdim");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.querySelector("path").setAttribute("d",`M0 0H${W}V${H}H0Z`+holes.map(o=>rr(...o)).join(""));
  Object.assign(root.querySelector(".tring").style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px",borderRadius:rad+"px"});
  tip.style.top=(inH?ty:Math.max(top0-pad,Math.min(ty,bot0-th)))+"px"}
ACT.tourNext=()=>{if(!TOUR)return;if(TOUR.i>=TOUR.steps.length-1)return tourEnd();tourGo(TOUR.i+1)};
ACT.tourBack=()=>{if(TOUR&&TOUR.i>0)tourGo(TOUR.i-1)};
ACT.tourSkip=()=>tourEnd();
ACT.tourStart=()=>{tourStart()};
function tourEnd(quiet){if(!TOUR)return;removeEventListener("resize",TOUR.onR);removeEventListener("orientationchange",TOUR.onR);document.removeEventListener("keydown",TOUR.onK);
  if(window.visualViewport){visualViewport.removeEventListener("resize",TOUR.onR);visualViewport.removeEventListener("scroll",TOUR.onR)}
  tdemoClose();TOUR.root.remove();TOUR=null;document.body.classList.remove("touring");S.tourDone=true;delete S.tourPending;save();if(quiet)return;stack=[{name:"home",p:{}}];render();window.scrollTo(0,0)}
// a small line on Today while the account can't be reached
const offNote=()=>API||!(SB_OFFLINE||(!SBU&&GATE_SKIPPED))?"":SBU||sbHasSession()?`<div class="gnote">${ic("sync")}<span>Offline. Your changes save to your account when you're back online.</span></div>`
  :`<div class="gnote">${ic("sync")}<span>Offline — sign in later.</span><button class="link" data-act="sbAuth" data-m="in">Sign In</button></div>`;

function gateBoot(){
  if(NOGATE){gateReady=true;if(sbHasSession())sbBoot();return}
  const back=/access_token|type=recovery/.test(location.hash)||/[?&]code=/.test(location.search),rec=/type=recovery/.test(location.hash);
  if(!sbHasSession()&&!back){gateShow();gateReady=true;return}
  // a saved session goes straight in; the launch screen stays up while it's checked (at most 4 s)
  const t=setTimeout(()=>{gateReady=true},4000);
  sbBoot().then(()=>{clearTimeout(t);gateReady=true;
    if(SBU){if(!S.onboarded&&!usedRange(S)&&!TOUR&&!rec)obStart();else{if(!S.onboarded){S.onboarded=true;save()}tourOwed()}}
    else if(!SB_OFFLINE)gateShow("in");else{render();tourOwed()}})}
// the app always opens on Today: a test left half-way is kept and offered as "Resume My Test", never reopened on its own
if(API)acctBoot();else{rbRestore();render();gateBoot()}
// launch screen: the logo reveal plays with nothing else running; then the 3D figures load behind it, and it lifts
// once they're drawn (at least 3.1s, at most 7s), so the home screen appears complete with no jump
(()=>{const sp=document.getElementById("splash");if(!sp)return;
  const end=()=>{if(sp.classList.contains("out"))return;clearInterval(iv);start3d();sp.classList.add("out");setTimeout(()=>sp.remove(),720)};
  setTimeout(start3d,2700);
  const iv=setInterval(()=>{const t=performance.now();if(t>7000||(t>3100&&(API||gateReady)&&started3d&&(S.settings.fig3d===false||FIG3D.settled||document.getElementById("gate"))))end()},100);
  sp.addEventListener("click",end)})();
// iOS shows a snapshot of the app while it reopens: cover the screen when the app goes to the background so that
// snapshot is the launch screen, not a stale home screen, and lift the cover right away when it comes back
document.addEventListener("visibilitychange",()=>{let c=document.getElementById("cover");
  if(document.hidden){if(c||document.getElementById("splash"))return;c=document.createElement("div");c.id="cover";c.setAttribute("aria-hidden","true");
    c.innerHTML=`<svg viewBox="0 0 200 200"><path d="M41.1 134A68 68 0 1 1 158.9 134" fill="none" stroke="#28303A" stroke-width="15" stroke-linecap="round"/><path d="M41.1 134A68 68 0 1 1 158.9 66" fill="none" stroke="var(--accent)" stroke-width="15" stroke-linecap="round"/><circle cx="158.9" cy="66" r="14" fill="var(--ink)"/></svg>`;document.body.appendChild(c)}
  else if(c){c.classList.add("out");setTimeout(()=>c.remove(),300)}});
