<style>
/* Layout: phone-app column (max 480px) — home carousel, step-by-step protocol builder, full-screen guided player. Deliberately dark-only, like a gym-floor app. */
:root{
  --bg:#131416;--surface:#1C1D20;--surface2:#26272B;--line:#323338;
  --ink:#F2EFE8;--muted:#A19D95;--accent:#3FD0C9;--accent-ink:#04201F;--accent-soft:#163331;
  --chalk:#F2EFE8;--chalk-ink:#151618;
  --p-red:#B8352B;--p-blue:#2B5BBE;--p-yellow:#E0B030;--p-green:#1F7A4A;--p-white:#E4E1D9;
  --r-hero:24px;--r-panel:18px;--r-ctl:14px;
  --warn:#E6A94B;--bad:#F07167;--good:#4CC38A;
  --fig:#D5DCE5;--fig-torso:#EEF2F6;--fig-far:#5A6373;--fig-prop:#A3ACB9;--fig-prop-hi:#4F5968;--fig-floor:#C3CAD4;
  --fig-skin:#EDC4A6;--fig-skin2:#D6A584;--fig-shirt:#D8473A;--fig-shirt2:#93281F;--fig-shorts:#5C3A6E;--fig-shorts2:#35223F;--fig-hair:#1D1A22;--fig-shoe:#3A2442;--fig-shoe2:#241628;--fig-hl:#16B5AC;--fig-ghost:#2B3442;--fig-arrow:#0E8C84;--stage:linear-gradient(180deg,#F1F3F6,#E2E7ED);
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-fig="mannequin"]{--stage:radial-gradient(ellipse at 50% 30%,#FFFFFF,#D9DFE6 80%);--fig-hl:#FF6A3D;--fig-arrow:#FF6A3D}
:root[data-fig="gymkit"]{--stage:linear-gradient(180deg,#EEF0F2,#D7DBE0);--fig-skin:#C68B63;--fig-skin2:#A8704C;--fig-shirt:#1F2329;--fig-shirt2:#121418;--fig-shorts:#6B7380;--fig-shorts2:#4A505A;--fig-shoe:#F4F5F7;--fig-shoe2:#C9CDD3;--fig-hair:#16120F;--fig-hl:#22C6B9}
:root[data-fig="xray"]{--stage:radial-gradient(ellipse at 50% 35%,#17243B,#070B14 80%);--fig-hl:#FF4D6D;--fig-arrow:#FF4D6D}
:root[data-fig="anatomy"]{--fig-skin:#C4C9CF;--fig-skin2:#8B9199;--fig-shirt:#C4C9CF;--fig-shirt2:#8B9199;--fig-shorts:#5B6169;--fig-shorts2:#41464D;--fig-hair:#C4C9CF;--fig-shoe:#B3B9C0;--fig-shoe2:#7E848C;--fig-hl:#7EE04A;--fig-ghost:#E8ECF1;--fig-arrow:#7EE04A;--fig-floor:#3A4048;--fig-prop:#5A616B;--fig-prop-hi:#A1A9B4;--stage:radial-gradient(ellipse at 50% 35%,#4B525C,#22262C 75%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
#app{max-width:480px;margin:0 auto;min-height:100%;padding-inline:16px;padding-block:0 96px;position:relative}
#app.sub{padding-bottom:32px}
h1,h2,h3{margin:0;font-weight:800;font-stretch:112%;letter-spacing:-.01em;line-height:1.08;text-wrap:balance}
h1{font-size:30px}h2{font-size:23px}h3{font-size:17px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.brand{font-weight:800;font-stretch:125%;font-size:17px;letter-spacing:.14em;text-transform:uppercase}
.brand b{color:var(--accent)}
.hdr{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;height:56px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;margin-inline:-16px;padding-inline:16px;border-bottom:1px solid transparent;transition:border-color .2s}
/* cover the strip behind the phone's status bar too, so content never shows above the header */
.hdr::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:calc(env(safe-area-inset-top,0px) + 1px);background:var(--bg)}
body.scrolled .hdr{border-bottom-color:var(--line)}
.hdr .brand{text-align:center}
.hdr button{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.stack{display:grid;gap:16px}
a.btn{text-decoration:none}.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:12px;font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn:disabled{background:color-mix(in srgb,var(--accent) 22%,var(--surface2));color:color-mix(in srgb,var(--ink) 45%,transparent);cursor:not-allowed}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.syncbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;border:1px solid rgba(63,208,201,.35);transition:transform .12s}.syncbtn:active{transform:scale(.95)}.syncbtn .ic{width:16px;height:16px}.syncbtn.busy .ic{animation:spin .9s linear infinite}.syncbtn.ok{background:transparent}
@keyframes spin{to{transform:rotate(360deg)}}
.link{color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:4px;vertical-align:middle}.link .ic{width:18px;height:18px;flex:none}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--surface2)}
.c-bad{color:var(--bad)}.c-warn{color:var(--warn)}.c-good{color:var(--good)}.c-top{color:var(--accent)}
/* figure */
.fig{display:block;width:100%;height:auto}
.fig .seg{fill:none;stroke:var(--fig);stroke-linecap:round;stroke-linejoin:round}
.fig .seg.torso{stroke:var(--fig-torso)}
.fig .seg.far{stroke:var(--fig-far)}
.fig .j{fill:var(--fig)}.fig .jf{fill:var(--fig-far)}
.fig .head{fill:var(--fig-torso)}
img.fig.f3,canvas.fig.f3{display:block;width:100%;height:auto;aspect-ratio:1.6;object-fit:contain;touch-action:pan-y;max-width:100%}canvas.fig.f3{margin:0 auto}.stage .fig.f3{height:100%;width:auto;margin:0 auto}canvas.fig.f3.anim{cursor:grab}
.fig .shadow{fill:#000;opacity:.25}
.fig .hl{fill:none;stroke:var(--accent);stroke-linecap:round}
.fig .hlc{fill:var(--accent)}
.fig .mat{fill:#DDE3EA;stroke:#C9D1DB}
.fig .pipe{stroke:var(--fig-prop-hi);stroke-width:4;stroke-linecap:round}
.fig .pipeend{fill:var(--fig-prop-hi)}.fig .kit rect,.fig .kit circle{fill:var(--fig-prop-hi);stroke:var(--bg);stroke-width:1.5}
.fig .floor{stroke:var(--fig-floor);stroke-width:2}
.fig .ghost{stroke:var(--fig-ghost);opacity:.13;stroke-linecap:round;fill:none}.fig .ghostc{fill:var(--fig-ghost);opacity:.13}.fig .marrow{fill:none;stroke:var(--fig-arrow);stroke-width:3.6;stroke-linecap:round;opacity:.9}.fig .marrowh{fill:var(--fig-arrow);stroke:var(--fig-arrow);stroke-width:1.5;stroke-linejoin:round;opacity:.9}
.fig .prop{fill:none;stroke:var(--fig-prop);stroke-width:4;stroke-linecap:round}
.fig .propfill{fill:var(--fig-prop)}
.fig .band{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 3;opacity:.8}
/* home */
.greet{padding:20px 0 14px}
.carousel{display:grid;grid-auto-flow:column;grid-auto-columns:80%;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;scroll-padding-inline:16px}
.carousel::-webkit-scrollbar{display:none}
.pcard{scroll-snap-align:start;position:relative;height:clamp(290px,44vh,380px);border-radius:20px;overflow:hidden;text-align:center;display:grid;align-content:end;padding:22px;isolation:isolate}
.pcard .art{position:absolute;inset:0;z-index:-1;display:grid;place-items:center;padding:6% 6% 36%}
.pcard .go{display:inline-flex;align-items:center;gap:6px;margin:12px auto 0;padding:7px 16px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;font-weight:700}
.pcard h2{font-size:30px}
.pcard p{margin:4px 0 0;font-size:14px;opacity:.85}
.g-activate{background:linear-gradient(165deg,#1C4A4A 0%,#11262A 55%,#0E1418 100%)}
.g-recover{background:linear-gradient(165deg,#2B2F5E 0%,#191C35 55%,#0F1119 100%)}
.g-daily{background:linear-gradient(165deg,#5A4636 0%,#30261F 55%,#15110F 100%)}
.g-target{background:linear-gradient(165deg,#4B2846 0%,#2A1828 55%,#120C12 100%)}
.g-rebuild{background:linear-gradient(165deg,#24504A 0%,#162B33 55%,#0E1418 100%)}
.g-a{background:linear-gradient(165deg,#24474F,#121B20)}.g-b{background:linear-gradient(165deg,#3A3460,#17162A)}.g-c{background:linear-gradient(165deg,#4E3E2C,#1B1611)}.g-d{background:linear-gradient(165deg,#25463A,#101C17)}
.dots{display:flex;justify-content:center;gap:6px;padding:14px 0}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line);transition:width .2s}
.dots i.on{width:18px;background:var(--ink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:4px;text-align:left}
.tile b{font-size:30px;font-weight:800;font-stretch:112%;font-variant-numeric:tabular-nums;line-height:1}
.banner{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
/* tabbar */
/* training */
.wlist{display:grid}
.wres{display:grid;gap:1px}.wrow .wt .wres small{color:var(--ink)}.wrow .wt .wres small.muted{color:var(--muted)}
.wrow{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.wrow .wd{display:grid;gap:4px;font-size:13px;justify-items:start}
.wrow .wt{display:grid;gap:6px;text-align:left;min-width:0}
.wrow .wt small{color:var(--muted);font-size:12px}
.wrow .wa{display:grid;gap:8px;justify-items:end}
.mchip{font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;background:var(--surface2)}
.chipset .mchip{white-space:nowrap}
.field{display:grid;gap:6px;min-width:0}
.field input,.field textarea{width:100%;background:var(--surface2);border:0;border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit;resize:vertical}.field input{min-height:44px;-webkit-appearance:none;appearance:none}.field input[type=date]{display:block;min-width:0;max-width:100%}
.frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.nexttiles{display:grid;gap:10px}
.ntile{background:var(--surface);border-radius:14px;padding:14px;display:grid;gap:6px;text-align:left}
.ntile b{font-size:16px;font-weight:800;font-stretch:112%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ntile .go{justify-self:start;margin-top:4px;padding:6px 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,480px);background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:10}
#tabbar button{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:4px}
#tabbar button[aria-current="page"]{color:var(--accent)}
#tabbar .ic{width:26px;height:26px}
/* sport select */
.sports{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scard{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:3/4;display:grid;align-content:end;padding:14px;text-align:left;isolation:isolate}
.scard .art{position:absolute;inset:0;z-index:-1;padding:10% 6% 34%;display:grid;place-items:center}
.scard b{font-size:18px;font-weight:800;font-stretch:112%}
.addsport{border:1.5px dashed var(--line);display:grid;place-items:center;align-content:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px}
.zcard{border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 120px;align-items:center;padding:16px;text-align:left;gap:8px}
/* wizard */
.whead{background:var(--surface);border-radius:16px;overflow:hidden}
.whead .hero{position:relative;height:120px;display:grid;align-content:end;padding:12px 14px;isolation:isolate}
.whead .hero .art{position:absolute;inset:0;z-index:-1;display:grid;justify-items:end;padding:6px 10px 0 40%}
.whead .hero b{font-size:21px;font-weight:800;font-stretch:112%;line-height:1.1}
/* the title keeps to the left, the figure to the right, so they never overlap */
.whead .hero{min-height:120px;height:auto;padding-right:40%}.whead .hero .art{left:auto;width:40%;padding:6px 8px 0 0}.whead .hero b{overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.adapt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;font-size:13px}
.adapt .chips{display:flex;gap:6px}
.adapt .chips{gap:10px}.adapt .ach{display:grid;justify-items:center;gap:3px}.adapt .ach small{font-size:10px;font-weight:700;color:var(--muted)}.adapt .ach.on small{color:var(--ink)}
.adapt .ach>span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.adapt .ach.on>span{background:var(--accent);color:var(--accent-ink)}
.adapt .chips .ic{width:17px;height:17px}
.stephead{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.stephead .bub{width:36px;height:36px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.stephead .bub .ic{width:18px;height:18px}
.stephead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stephead h3{min-height:36px;display:flex;align-items:center}
.mlist{display:grid}
.mlist div{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);font-weight:600}
.mlist button{width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip .ic{width:15px;height:15px}
.chip.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:54px;padding:0 16px;border-radius:12px;background:var(--surface);font-weight:600;text-align:left;box-shadow:inset 0 0 0 1.5px transparent}
.opt.on{box-shadow:inset 0 0 0 1.5px var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.opt .radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}.opt.on .radio{border:6px solid var(--accent)}
.opt .tick{margin-left:12px;width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;color:transparent}.opt .tick svg{width:15px;height:15px}.opt.on .tick{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.opt .tag{color:var(--accent);font-size:12px;font-weight:700}
.equip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.eq{display:grid;justify-items:center;gap:8px;font-size:13px;font-weight:600}
.eq span{width:100%;aspect-ratio:1;border-radius:16px;display:grid;place-items:center;background:var(--surface);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line)}
.eq span .ic{width:34px;height:34px;stroke-width:1.5}
.eq.on span{color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.eq span{position:relative}.eq.on span{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}.eq.on span::after{content:"✓";position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center}.eq:not(.on) span{opacity:.6}
.eq:not(.on){color:var(--muted)}
.sumrows{background:var(--surface);border-radius:16px;padding:6px 14px}
.srow{display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.srow:last-child{border-bottom:0}
.srow .bub{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.srow .bub .ic{width:17px;height:17px}
.srow small{display:block;color:var(--muted);font-size:12px}
.srow .ok{color:var(--accent);opacity:0;transition:opacity .25s}
.srow.done .ok{opacity:1}
.srow .val{transition:opacity .25s}
.srow:not(.done) .val{opacity:0}
.preview{display:grid}
.preview div{display:grid;grid-template-columns:24px 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.preview span:first-child,.preview span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.preview .blk{margin:10px 0 2px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);display:flex;justify-content:space-between;border:0}
.preview .blk span{color:var(--muted)}

  return true}

function lerp(A,B,t){return A.map((v,i)=>v+(B[i]-v)*t)}
/* ================= demo figure =================
   Each stretch has its own start (A) and end-range (B) pose. Bones keep fixed lengths; feet and hands
   that are "planted" stay put while the body moves (two-bone IK), so nothing slides or stretches.
   Angles are in degrees, screen space: 0 = forward (right), 90 = down, -90 = up, 180 = back (left).
   Pose fields: p pelvis | root [joint,[x,y]] to pin a knee/foot instead | t torso | bend spine curve |
   h head | L1/L2 legs (near/far) {a:[thigh,shin]} or {plant:[x,y]}, f foot angle |
   A1/A2 arms {a:[upper,fore], s:[scale,scale]} or {plant:[x,y]} or {rot} (straight arm turning about
   the body's long axis, for top-down views) | view:'front' | top:true (seen from above, no floor). */

function ik2(h,t,a,b,dir){
  const dx=t[0]-h[0],dy=t[1]-h[1],raw=Math.hypot(dx,dy)||.001;
  const d=Math.max(Math.abs(a-b)+.01,Math.min(a+b-.01,raw)),base=Math.atan2(dy,dx);
  const al=Math.acos(Math.max(-1,Math.min(1,(a*a+d*d-b*b)/(2*a*d)))),ang=base-dir*al;
  return[[h[0]+a*Math.cos(ang),h[1]+a*Math.sin(ang)],[h[0]+d*Math.cos(base),h[1]+d*Math.sin(base)]];
}
function lerpF(a,b,t){

  /* ---------- movement arrow ---------- */
  function arrow(BA,BB,toCam){
    const cand=[a=>a.arms["1"].w,a=>a.arms["2"].w,a=>a.legs["1"].ft,a=>a.legs["2"].ft,a=>a.legs["1"].k,a=>a.legs["2"].k,a=>a.h,a=>a.p];
    let best=null,bd=0,bi=-1;cand.forEach((g,i)=>{const a=g(BA),b=g(BB),d=len(sub(b,a));if(d>bd+1){bd=d;best=[a,b];bi=i}});
    if(!best||bd<7)return null;
    let[a,b]=best;const off=bi===6?add(mul(toCam,6),mul(BA.F,16)):mul(toCam,13);a=add(a,off);b=add(b,off);
    const mid=lerp3(a,b,.5),out=norm(sub(mid,add(BA.p,mul(toCam,13)))),bend=add(mid,mul(out,bd*.2));
    const curve=new T.QuadraticBezierCurve3(_v(a),_v(bend),_v(b));
    const g=new T.Group(),tube=part(new T.TubeGeometry(curve,24,1.3,10,false),M.arrow,false);g.add(tube);
    const tan=curve.getTangent(1),tip=part(geo.cone,M.arrow,false);const q=new T.Quaternion().setFromUnitVectors(new T.Vector3(0,1,0),tan);
    tip.matrix.compose(_v(b),q,new T.Vector3(3.6,8,3.6));g.add(tip);
    return g;
  }

  /* ---------- scene per figure ---------- */
  const cache={};
  function figData(key){
    if(cache[key])return cache[key];
    const P=FIGS[key]||FIGS[FIG_ALIAS[key]]||FIGS.h7;
    const JA=solveFig(P.A),JB=solveFig(P.B),BA=lift(JA,P.A,JA.p[0]),BB=lift(JB,P.B,JA.p[0]),FM=poseAt(P,.5),BM=lift(solveFig(FM),FM,JA.p[0]);
    // camera: side view seen from the near side, a little from the front; front view from the front
    const pts=[];[BA,BB,BM,...(P.ext||[]).map(F=>lift(solveFig(F),F,JA.p[0]))].forEach(B=>{pts.push(B.p,B.n,B.h,add(B.h,[0,10,0]));["1","2"].forEach(s=>{pts.push(B.legs[s].k,B.legs[s].f,B.legs[s].ft,B.arms[s].e,B.arms[s].w)})});
    const mn=[0,1,2].map(i=>Math.min(...pts.map(p=>p[i]))),mx=[0,1,2].map(i=>Math.max(...pts.map(p=>p[i])));
    (P.props||[]).forEach(([k,a,b,c])=>{if(k==="box"||k==="stack"||k==="highbench"){mn[0]=Math.min(mn[0],a-JA.p[0]);mx[0]=Math.max(mx[0],a+c-JA.p[0])}if(k==="wall"||k==="frame"){mn[0]=Math.min(mn[0],a-JA.p[0]);mx[0]=Math.max(mx[0],a-JA.p[0])}});
    mn[1]=0;
    const view=BA.front?"front":BA.above?"above":"side";
    return cache[key]={P,BA,BB,mn,mx,view,cx:JA.p[0]};
  }
  function camDir(D,yawExtra){
    const wallAhead=(D.P.props||[]).some(([k,a])=>(k==="wall"||k==="frame")&&a>D.cx);
    const C=D.P.cam||{};// a pose can pick its own camera, e.g. from behind to show how wide the knees are
    const yaw=(C.yaw??(D.view==="front"?68:D.view==="above"?40:wallAhead?-24:26))*Math.PI/180+yawExtra,pitch=(C.pitch??(D.view==="above"?28:10))*Math.PI/180;
    return norm([Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)]);
  }
  function frame(key,aspect,yawExtra=0,reserve=0){
    const D=figData(key),c=[(D.mn[0]+D.mx[0])/2,(D.mn[1]+D.mx[1])/2,(D.mn[2]+D.mx[2])/2],size=[D.mx[0]-D.mn[0]+22,D.mx[1]-D.mn[1]+20,D.mx[2]-D.mn[2]+22];
    // yaw measured from the person's right side (+Z) toward their front (+X)
    const dv=camDir(D,yawExtra),dir=norm([dv[0],0,dv[2]]);
    const fov=cam.fov*Math.PI/180,w=size[0]*Math.abs(dir[2])+size[2]*Math.abs(dir[0]),h=size[1]*Math.cos(Math.asin(dv[1]))+(size[0]+size[2])*.5*dv[1];
    const dist=Math.max(h/2/Math.tan(fov/2),w/2/(Math.tan(fov/2)*aspect))*1.04+Math.max(size[0],size[2])*.18;
    // leave the bottom of the frame free for the info overlay: pull back a little and aim lower
    const d2=dist*(1+reserve*1.25),ty=c[1]*.95-reserve*size[1]*.45;
    cam.aspect=aspect;cam.position.set(c[0]+dv[0]*d2,ty+(c[1]-ty)+dv[1]*d2,c[2]+dv[2]*d2);cam.lookAt(c[0],ty,c[2]);cam.updateProjectionMatrix();
  }
  let curKey=null,curExtras=[];
  function setFigure(key,t,zones,sides,guide){
    const D=figData(key),F=poseAt(D.P,t),J=solveFig(F),B=lift(J,F,D.cx);
    pose(rig,B);
    const showG=guide&&t<.9;ghost.G.visible=showG;if(showG)pose(ghost,D.BB);
    curExtras.forEach(o=>extras.remove(o));curExtras=[];
    const add2=o=>{if(o){extras.add(o);curExtras.push(o)}};
    add2(muscles(B,zones||[],sides,D.P.work==="2"&&!B.front,B.front));
    add2(props(B,D.P.props||[],{cx:D.cx}));
    if(guide){const ak="arrow|"+M.style;if(!(ak in D))D[ak]=arrow(D.BA,D.BB,camDir(D,0));add2(D[ak])}
  }
  function draw(r,key,t,o,w,h,yaw=0,reserve=0){
    if(M.style!==(document.documentElement.dataset.fig||"gymkit")){makeMaterials();[rig,ghost].forEach(x=>scene.remove(x.G));rig=buildRig(false);ghost=buildRig(true);for(const k in cache)for(const j in cache[k])if(j.startsWith("arrow|"))delete cache[k][j]}
    const sz=w+"x"+h;if(r===R){if(liveSize!==sz){R.setSize(w,h,false);liveSize=sz}}else if(thumbSize!==sz){r.setSize(w,h,false);thumbSize=sz}
    setFigure(key,t,o.zones,o.sides,o.guide!==false);frame(key,w/h,yaw,reserve);r.render(scene,cam);return r.domElement;
  }
  function renderTo(key,t,o,w,h,yaw=0){if(!TR)TR=makeRenderer(true);return draw(TR,key,t,o,w,h,yaw)}

  /* ---------- DOM: upgrade 2D figures ---------- */
  function opts(el){return{zones:el.dataset.zones?el.dataset.zones.split(","):[],sides:!!el.dataset.sides,guide:el.dataset.mode!=="static"}}
  const near=el=>{const r=el.getBoundingClientRect();return r.bottom>-innerHeight&&r.top<innerHeight*2};
  function upgrade(scope){
    if(!ready)return;
    (scope||document).querySelectorAll("svg.fig:not([data-x3])").forEach(el=>{
      const key=el.dataset.pose;if(!key){el.dataset.x3=1;return}
      const o=opts(el),anim=el.classList.contains("anim");
      if(anim){el.dataset.x3=1;const cv=document.createElement("canvas");cv.className=el.getAttribute("class")+" f3";Object.assign(cv.dataset,el.dataset);cv.dataset.yaw="0";el.replaceWith(cv);hookDrag(cv);return}
      const t=+(el.dataset.t||.75),ck=[key,t,o.zones.join(","),o.sides,o.guide,M.style].join("|");
      if(thumbs.has(ck)){el.dataset.x3=1;const img=new Image();img.className=el.getAttribute("class")+" f3";img.alt="";img.src=thumbs.get(ck);el.replaceWith(img);return}
      if(!near(el))return; // off screen: stays 2D until you scroll near it
      el.dataset.x3=1;const img=new Image();img.className=el.getAttribute("class")+" f3";img.alt="";
      queue.push({el,img,key,t,o,ck});
    });
    pump();
  }
  function pump(){
    if(pumping||!queue.length)return;pumping=true;
    const step=()=>{
      if(!ready){pumping=false;return}
      const q=queue.shift();
      if(!q||!q.el.isConnected){if(queue.length)requestAnimationFrame(step);else pumping=false;return}
      const done=url=>{try{q.img.src=url;if(q.el.isConnected)q.el.replaceWith(q.img)}catch(e){noteError(e,"3D")}if(queue.length)requestAnimationFrame(step);else pumping=false};
      if(thumbs.has(q.ck))return done(thumbs.get(q.ck));
      try{const c=renderTo(q.key,q.t,q.o,480,300);
        c.toBlob(b=>{if(!b){pumping=false;return}let u;try{u=URL.createObjectURL(b)}catch(e){pumping=false;return}thumbs.set(q.ck,u);done(u)},"image/png")}
      catch(e){disable(e)}
    };
    requestAnimationFrame(step);
  }
  function hookDrag(cv){
    let x0=null;
    cv.addEventListener("pointerdown",e=>{x0=e.clientX;try{cv.setPointerCapture(e.pointerId)}catch(_){};cv.dataset.drag=1});
    cv.addEventListener("pointermove",e=>{if(x0==null)return;cv.dataset.yaw=(+cv.dataset.yaw||0)+(e.clientX-x0)*.012;x0=e.clientX;cv.dataset.drawn=""});
    const end=e=>{if(x0!=null&&Math.abs(+cv.dataset.yaw)<.02)cv.dataset.drag="";x0=null};
    cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  }
  function tick(ts){
    if(!ready)return;
    // while the front page or first-run setup is up, only its own figures are drawn (setup step 3 shows one),
    // never the screen hidden behind it
    const scope=document.getElementById("gate")||document;
    try{
      scope.querySelectorAll("canvas.fig.f3.anim").forEach(cv=>{
        // a static stretch is drawn once in its held position (and again only when you turn it)
        const paused=(cv.closest(".player")&&animPaused)||cv.dataset.mode==="static";if(paused&&cv.dataset.drawn)return;
        // size from the container, never from the canvas itself: on iPhone a canvas can take its pixel size as its
        // display size, which made it grow every frame and look zoomed in
        const box=cv.parentElement.getBoundingClientRect(),stg=cv.closest(".stage,.detailstage,.tsfig");
        const sr=stg?stg.getBoundingClientRect():null,tall=stg&&stg.classList.contains("tall");
        // a tall (portrait) stage gets a portrait render: the camera re-frames rather than letterboxing
        let dw,dh;if(tall){dw=Math.max(1,sr.width);dh=Math.max(1,sr.height)}else{const maxH=sr?sr.height:Infinity;dw=Math.max(1,Math.min(box.width,maxH*1.6));dh=dw/1.6}
        if(!box.width||box.bottom<0||box.top>innerHeight)return;
        const cssW=Math.round(dw)+"px",cssH=Math.round(dh)+"px";if(cv.style.width!==cssW){cv.style.width=cssW;cv.style.height=cssH}
        const dpr=Math.min(1.5,devicePixelRatio||1),w=Math.min(960,Math.round(dw*dpr)),h=Math.round(w*dh/dw);
        if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h}
        const per=+cv.dataset.period||3400,t=cv.dataset.mode==="static"?1:REDUCED?.75:cv.dataset.mode==="iso"?.86+.14*(.5-.5*Math.cos(ts/4200*2*Math.PI)):.5-.5*Math.cos(ts/per*2*Math.PI);
        const ov=stg&&stg.querySelector(".dov"),res=ov&&ov.offsetHeight?Math.min(.3,(ov.offsetHeight+8)/Math.max(1,dh)):0;
        const src=draw(R,cv.dataset.pose,t,opts(cv),w,h,+cv.dataset.yaw||0,res);
        const g=cv.getContext("2d");g.clearRect(0,0,w,h);g.drawImage(src,0,0,w,h);cv.dataset.drawn=paused?"1":"";
      });
      upgrade(scope);
    }catch(e){disable(e);return}
    requestAnimationFrame(tick);
  }
  // anything goes wrong in 3D: switch back to the 2D figure for this session, never take the app down
  function disable(err){
    if(!ready&&failed)return;ready=false;failed=true;console.warn("3D figures off:",err);noteError(err,"3D");
    document.documentElement.classList.remove("fig3d");
    document.querySelectorAll("canvas.fig.f3").forEach(cv=>{const d=document.createElement("div");d.innerHTML=fig(cv.dataset.pose,null,{anim:true,zones:cv.dataset.zones?cv.dataset.zones.split(","):null,sides:!!cv.dataset.sides,mode:cv.dataset.mode,period:+cv.dataset.period||0});cv.replaceWith(d.firstElementChild)});

  if(RB_SCREENS.test(name)&&RB){S.rbDraft={r:RB.r,flags:[...RB.flags],step:RB.step,ans:RB.ans,first:RB.first||null,sub:RB.sub||null,screen:name,at:Date.now()};save()}
  else if(S.rbDraft&&rbRestored&&!RB_SCREENS.test(name)){delete S.rbDraft;save()}}
let rbRestored=false;
function rbRestore(){const d=S.rbDraft;rbRestored=true;if(!d||!REGIONS[d.r]||Date.now()-(d.at||0)>7*864e5||S.rehab&&S.rehab.region===d.r&&S.rehab.started>d.at)return false;
  RB={r:d.r,flags:new Set(d.flags||[]),step:Math.min(d.step||0,REGIONS[d.r].screens.length-1),ans:d.ans||[],first:d.first||undefined,sub:d.sub||undefined};
  stack=[{name:"rebuild",p:{}},{name:"rbflags",p:{}}];if(d.screen!=="rbflags")stack.push({name:d.screen,p:{}});return true}

ACT.startKind=d=>{
  const k=d.kind;
  if(k==="rebuild"){ACT.tab({t:"rebuild"});return}
  // Recover goes straight to everything you logged a score for today (from SugarWOD or added by hand)
  if(k==="recover"){const td=loggedToday();if(td.length){recoverFrom(td);return}}
  // Activate goes straight to your next workout's movements
  if(k==="activate"){const nx=nextWorkout();if(nx){prepFor(nx);return}}
  if(k==="activate"||k==="recover")go("sport",{kind:k});
  else startWizard({kind:k});
};

let W=null;
const STEPS={activate:["moves","time","equip","summary"],recover:["moves","time","equip","summary"],daily:["time","equip","summary"],target:["zone","time","equip","summary"]};
const STEPICON={moves:"move",time:"clock",equip:"equip",zone:"target"},STEPCAP={moves:"Workout",time:"Time",equip:"Kit",zone:"Zone"};
function startWizard(o){
  W={kind:o.kind,mw:o.mw||null,sport:o.sport||null,moves:o.moves?o.moves.slice():o.sport?(S.moves[o.sport]||[]).slice():[],from:o.from||null,minutes:null,equip:S.equip.slice(),zone:null,step:0,done:{}};
  // Coming from a logged workout: movements are already known, start at the time step
  if(o.moves&&o.moves.length&&STEPS[W.kind][0]==="moves"){W.done.moves=true;W.step=1}
  // auto: your usual time and equipment, straight to the chosen exercises (every choice stays editable there)
  if(o.auto&&W.done.moves){W.minutes=(S.lastMin||{})[W.kind]||10;W.done.time=W.done.equip=true;W.step=STEPS[W.kind].indexOf("summary")}
  go("wizard",{});
}
function wizHead(){

  const title=W.from?W.from:sp?sp.n:W.kind==="target"&&W.zone?AN[W.zone]:kd.sub;
  const steps=STEPS[W.kind].filter(s=>s!=="summary");
  const sum=STEPS[W.kind][W.step]==="summary"&&W.plan;
  return `<div class="whead"><div class="hero ${kd.g}"><div class="art">${fig(sp?sp.pose:kd.pose)}</div><b>${esc(W.kind==="target"&&W.zone?AN[W.zone]:kd.n)}</b>${sum?`<span style="font-size:14px;font-weight:600;opacity:.85">${Math.max(1,Math.round(W.plan.secs/60))} min · ${W.plan.items.length} exercises</span>`:""}</div></div>`;
}

    ${W.moves.length?`<div class="mlist">${W.moves.map(m=>`<div><span>${esc(m)}</span><button data-act="rmMove" data-m="${esc(m)}" aria-label="Remove ${esc(m)}">${ic("x")}</button></div>`).join("")}</div>`:`<p class="muted" style="margin:0">Add the movements in today's session.</p>`}
    ${sugg.length?`<div class="stack" style="gap:8px"><span class="eyebrow">Quick add</span><div class="chipset">${sugg.map(m=>`<button class="chip" data-act="addMove" data-m="${esc(m)}">${ic("plus")}${esc(m)}</button>`).join("")}</div></div>`:""}`;

  }
  if(step==="time"){
    body=`<div class="stephead"><span class="bub">${ic("clock")}</span><div><h3>Your available time</h3></div></div>
    <div class="stack" style="gap:10px">${[3,10,15,20].map(m=>`<button class="opt ${W.minutes===m?"on":""}" data-act="pickTime" data-m="${m}"><span>${m} min</span>${m===3?'<span class="tag">Quick reset</span>':""}</button>`).join("")}</div>`;
    cta=`<button class="btn" data-act="wNext" ${W.minutes?"":"disabled"}>Next</button>`;
  }
  if(step==="equip"){
    body=`<div class="stephead"><span class="bub">${ic("equip")}</span><div><h3>Your equipment</h3><p>Unselect the equipment you don't have access to today</p></div></div>
    <div class="equip">${EQUIP.map(e=>`<button class="eq ${W.equip.includes(e.k)?"on":""}" data-act="togEq" data-e="${e.k}" aria-pressed="${W.equip.includes(e.k)}"><span>${ic(e.k)}</span>${e.n}</button>`).join("")}</div>`;
    cta=`<button class="btn" data-act="wNext">Next</button>`;
  }

    const sc=scores();

    <div class="stack" style="gap:10px">${AREAS.map(a=>{const l=level(sc[a.k]);return`<button class="opt ${W.zone===a.k?"on":""}" data-act="pickArea" data-a="${a.k}"><span>${a.n}</span><span class="${l.c}" style="font-weight:700;font-variant-numeric:tabular-nums">${sc[a.k]}</span></button>`}).join("")}</div>`;
    cta=`<button class="btn" data-act="wNext" ${W.zone?"":"disabled"}>Next</button>`;
  }
  if(step==="summary"){

    if(W.kind==="activate"||W.kind==="recover")rows.push(["move","Your workout movements",W.moves.join(", "),"moves"]);
    if(W.kind==="target")rows.push(["target","Your body zone",AN[W.zone],"zone"]);

    rows.push(["equip","Your equipment",eqn.length?eqn.join(", "):"None","equip"]);
    rows.push(["target","Your mobility focus",mobilityFocus().map(k=>AN[k]).join(", "),null]);
    if(!W.plan)W.plan=buildPlan(W);
    body=`<div class="stack" style="gap:6px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="chipset">${W.kind==="target"?`<button class="chip" data-act="wGoto" data-s="zone">${ic("target")}${esc(AN[W.zone])}</button>`:""}<button class="chip" data-act="wGoto" data-s="time">${ic("clock")}${W.minutes} min</button><button class="chip" data-act="wGoto" data-s="equip" aria-label="Equipment">${ic("equip")}Kit</button></span><span style="display:flex;gap:14px"><button class="link" data-act="whySheet">Why?</button><button class="link" data-act="reshuffle">Shuffle</button></span></div>

    <div class="preview">${W.plan.items.length?(()=>{let n=0;return(W.plan.blocks||[{name:"",items:W.plan.items}]).map((b,bi)=>`${b.name?`<p class="blk">${esc(b.name)} <span>${Math.round(b.items.reduce((t,it)=>t+itemSecs(it),0)/60)||"<1"} min</span></p>`:""}${b.items.map((it,ii)=>{const ex=LIBI[it.id];n++;return`<div class="ed"><span>${n}</span><span>${esc(ex.n)}</span><span class="rt"><span>${it.dose?esc(doseText(it).split(" · ")[0]):fmt(it.hold)+(ex.sides?" ×2":"")}</span><span class="pe"><button data-act="wSwap" data-b="${bi}" data-i="${ii}" aria-label="Swap ${esc(ex.n)}">${ic("reset")}</button><button data-act="wRm" data-b="${bi}" data-i="${ii}" aria-label="Remove ${esc(ex.n)}">${ic("x")}</button></span></span></div>`}).join("")}`).join("")})():`<div><span></span><span class="muted">No stretches match this equipment and time. Add equipment or pick more time.</span><span></span></div>`}</div>

function wSwapOptions(it){const ex=LIBI[it.id],ov=e=>e.z.filter(z=>ex.z.includes(z)).length,have=new Set(W.plan.items.map(x=>x.id));

   ${(W.plan.credit=planCredit(W.plan.items,W.kind==="target"||W.kind==="daily"?[]:W.moves))&&Object.keys(W.plan.credit).length?`<div class="stack" style="gap:6px"><span class="eyebrow">${W.kind==="recover"?"What each movement worked":"What each movement needs"}</span>

/* Turns one plan item into timed segments. Mobility items have a hold; rehab items have a dose:
   hold (sets × seconds), rephold (sets × reps × seconds), pyramid (McGill-style 6-4-2 of 10 s holds),
   reps (tempo sets you tap to finish, then rest) or time (walking). */
function segsFor(it,i){
  const ex=LIBI[it.id],d=it.dose,out=[],first=i===0;
  if(!d){
    const bias=(S.sideBias||{})[ex.a];
    const rbSide=S.rehab&&(S.rehab.side==="left"?"L":S.rehab.side==="right"?"R":null);
    (ex.sides?(rbSide==="L"&&ex.roll?["Left side","Right side"]:["Right side","Left side"]):[null]).forEach((sd,k)=>{const tight=bias&&sd&&sd[0]===bias&&!(ex.roll&&rbSide===bias);out.push({type:"ready",i,side:sd,secs:first&&!k?S.settings.ready:5,label:k?"Switch sides":first?"Get ready":"Next up"});out.push({type:"hold",i,side:tight?sd+" · tighter, +50%":sd,hold:tight?Math.round(it.hold*1.5):it.hold})});
    return out;
  }
  out.push({type:"ready",i,secs:first?S.settings.ready:8,label:first?"Get ready":"Next up"});
  if(d.k==="time"){out.push({type:"hold",i,hold:d.secs,dosed:1,label:fmt(d.secs)+(it.id==="r_walk"?" walk":"")});return out}
  const sides=d.sides?(it.lead==="left"?["Left","Right"]:["Right","Left"]):[null];
  const sets=d.k==="pyramid"?d.reps:Array.from({length:d.sets},()=>d.k==="reps"?(it.reps||d.reps):d.k==="rephold"?d.reps:1);
  const lab=(si,ri,reps,sd)=>[sets.length>1?`Set ${si+1}/${sets.length}`:"",reps>1?`Rep ${ri+1}/${reps}`:"",sd||""].filter(Boolean).join(" · ");
  sets.forEach((reps,si)=>sides.forEach((sd,k)=>{
    if(si>0||k>0)out.push({type:"ready",i,secs:k>0?(d.k==="reps"?10:6):(d.k==="reps"?(d.rest||60):d.k==="pyramid"?25:20),label:k>0?"Switch sides":"Rest"});
    if(d.k==="reps")out.push({type:"set",i,reps,side:sd,label:[lab(si,0,1,sd),"tap the ring when done"].filter(Boolean).join(" · ")});
    else for(let r=0;r<(d.k==="hold"?1:reps);r++){
      if(r>0)out.push({type:"ready",i,secs:3,label:"Relax",quiet:1});
      out.push({type:"hold",i,hold:d.secs,dosed:1,short:d.secs<10,side:sd,label:lab(si,r,d.k==="hold"?1:reps,sd)});
    }
  }));
  return out;
}
function doseText(it){
  const d=it.dose;if(!d)return"";
  const side=d.sides?" each side":"";
  if(d.k==="time")return d.secs<120?`${d.secs} s`:d.secs%60?`${Math.floor(d.secs/60)} min ${d.secs%60} s`:`${d.secs/60} min`;
  if(d.k==="hold")return`${d.sets} × ${d.secs} s${LIBI[it.id]&&LIBI[it.id].dyn?"":" hold"}${side}`;
  if(d.k==="rephold")return`${d.sets>1?d.sets+" sets of ":""}${d.reps} reps · ${/squat/i.test((LIBI[it.id]||{}).n||"")?`${d.secs} s at the bottom of each`:`hold each ${d.secs} s`}${side}`;
  if(d.k==="pyramid")return`${d.reps.join("-")} reps · 10 s holds${side}`;
  return`${d.sets} × ${it.reps||d.reps}${side}${d.tempo?` · tempo ${d.tempo.join("-")}`:""}${d.note?` · ${d.note}`:""}`;
}

function segSecs(s){if(s.type==="ready")return s.secs;if(s.type==="set")return 0;if(s.dosed)return Math.max(3,Math.round(s.hold*(P&&P.easy&&!s.short?.75:1)));return Math.max(15,Math.round(s.hold*(P&&P.easy?.75:1)))}

/* ================= protocol planner =================
   Each protocol has a fixed structure taken from Rebuilding Milo and checked against the research:
   ACTIVATE (before training): rehab warm-up if a Rebuild program asks for one (isometrics before lifting)
     -> Mobilise: the joints today's movements need, dynamic first, static holds max 30 s and max 60 s per
        area (longer static holds before lifting cost strength and power)
     -> Activate: brace the core (McGill), then switch on the muscles your movements rely on.
   RECOVER (after): region by region, biggest load first: release (roller / ball) for that region, then long
     passive holds for what you trained, winding down to the floor.
   DAILY: Mobility for your weakest areas (capped at ~10 min of static stretching per area per week, the
     point where gains level off), then Strength at end range (builds range as well as stretching does).
   TARGET: Mobility for one area, then Lock it in with a strength drill in the new range.
   Every block skips exercises your active Rebuild program says to avoid (e.g. no Achilles stretching). */

  const s=String(text).replace(/^﻿/,""),rows=[];let row=[],f="",q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'&&s[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}
    else if(c==='"')q=true;else if(c===","){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&s[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}

  if((m=s.match(/^(\d{4})(\d{2})(\d{2})$/)))return`${m[1]}-${m[2]}-${m[3]}`;
  if((m=s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})/))){let[a,b,y]=[+m[1],+m[2],+m[3]];if(y<100)y+=2000;const[mo,d]=a>12?[b,a]:[a,b];return`${y}-${p(mo)}-${p(d)}`}

  rows.forEach((w,i)=>{
    if(!w.date||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)){skipped++;return}
    if(have.has(key(w))){const o=S.training.find(x=>key(x)===key(w));if(o){const nowScored=w.result&&(!o.result||(w.loggedAt&&w.loggedAt!==o.loggedAt));if(w.result)o.result=w.result;if(w.loggedAt)o.loggedAt=w.loggedAt;if(nowScored&&doneDay(o)>=recent)fresh.push(o)}return}

    const plan=w.result&&S.training.find(x=>x.date===w.date&&x.source===source&&!x.result);

/* ---- SugarWOD auto-sync ----
   A scheduled GitHub workflow logs in to SugarWOD, reads the whiteboard and publishes an encrypted file
   (sugarwod.json.enc) next to the installed app. Range decrypts it here with your passphrase (AES-GCM,
   PBKDF2) and merges new workouts. The passphrase stays on this device. */
const SYNC_FILE="sugarwod.json.enc";
let syncAvail=null; // null = unknown, true/false after the first check
async function unsealBox(box,pass){
  const u=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);

}
async function autoSync(force){
  if(API)return acctPull(force);
  S.sync=S.sync||{};
  if(!force&&S.sync.checked&&Date.now()-S.sync.checked<20*60e3)return;
  let box;
  try{const r=await fetch(SYNC_FILE+"?t="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;box=await r.json();syncAvail=box&&box.format==="range-sealed/1"}catch(e){syncAvail=false}
  if(!syncAvail||!S.sync.key){if(stack[stack.length-1].name==="profile")render();return}
  try{
    const data=await unsealBox(box,S.sync.key);
    const rows=(data.workouts||[]).map(w=>({date:w.date,title:w.title,text:w.text,result:w.result,loggedAt:w.loggedAt}));
    const r=mergeRows(rows,"sugarwod-auto");
    // the file is the whiteboard as it is now: drop synced programming for today onward that the gym has since changed or removed
    // (unless you scored it or ticked it), so the next session is never an outdated version
    const inFile=new Set(rows.map(wKey)),last=rows.reduce((m,w)=>w.date>m?w.date:m,"");
    if(rows.length)S.training=S.training.filter(w=>!(w.source==="sugarwod-auto"&&w.date>=todayIso()&&w.date<=last&&!w.result&&!w.marked&&!inFile.has(wKey(w))));
    S.sync={...S.sync,checked:Date.now(),syncedAt:data.syncedAt||null,count:(data.workouts||[]).length,lastAdded:r.added,error:""};
    if(r.fresh.length)recoverNudge(r.fresh);
  }catch(e){S.sync={...S.sync,checked:Date.now(),error:"The passphrase doesn't open the sync file. Use the RANGE_SYNC_KEY saved in GitHub. If you just changed it there, the file switches to the new one at the next sync (hourly, or run it now: GitHub → Actions → SugarWOD sync → Run workflow)."}}
  save();const top=stack[stack.length-1].name;if(top==="profile"||top==="home")render();
}

function newDose(id){const e=LIBI[id],pd=progDose(id);if(pd){delete pd.hsr;return{sets:1,reps:10,secs:5,sides:false,rest:60,note:"",...pd}}return e&&!e.rehab&&e.hold?{k:"hold",sets:2,secs:Math.min(60,e.hold||30),sides:!!e.sides}:{k:"reps",sets:3,reps:10,secs:5,sides:false,rest:60,note:""}}
function readEd(){
  if(!ED||!$("#edName"))return;
  const v=id=>{const el=$(id);return el?el.value.trim():null},set=(k,x)=>{if(x!=null)ED[k]=x};
  set("name",v("#edName"));set("from",v("#edFrom"));set("freq",v("#edFreq"));set("notes",v("#edNotes"));
  if(v("#edTestN")!=null){ED.test.n=v("#edTestN");ED.test.how=v("#edTestHow")}
  ED.items.forEach((it,i)=>{const g=k=>{const el=$(`#ed${k}${i}`);return el?el.value:null};const d=it.dose;
    if(g("Sets")!=null)d.sets=Math.max(1,+g("Sets")||1);if(g("Reps")!=null)d.reps=Math.max(1,+g("Reps")||1);if(g("Secs")!=null)d.secs=Math.max(3,+g("Secs")||3);if(g("Note")!=null)d.note=g("Note").trim()});
}

function radar(sc){
  const cx=100,cy=100,R=78,n=AREAS.length;const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let g="";[25,50,75,100].forEach(v=>{g+=`<polygon points="${AREAS.map((_,i)=>pt(i,R*v/100).join(",")).join(" ")}" style="fill:none;stroke:var(--line)"/>`});
  AREAS.forEach((a,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)"/>`;const[lx,ly]=pt(i,R+16);g+=`<text x="${lx}" y="${ly+3}" text-anchor="${Math.abs(lx-cx)<5?"middle":lx>cx?"start":"end"}">${a.n}</text>`});
  g+=`<polygon points="${AREAS.map((a,i)=>pt(i,R*sc[a.k]/100).join(",")).join(" ")}" style="fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round"/>`;
  AREAS.forEach((a,i)=>{const[x,y]=pt(i,R*sc[a.k]/100);g+=`<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--accent)"/>`});
  return `<svg class="radar" viewBox="-70 -8 340 216" role="img" aria-label="Mobility scores by area">${g}</svg>`;
}

ACT.howItWorks=()=>sheet(`<h3>How Range works</h3><div class="scroll evid">
 <p><b>Mobility sessions</b> split your time by need: your test scores, what today's movements require, what you trained in the last 3 days and what's coming up. Each area starts with a static stretch and ends with an active drill that uses the new range, so it carries into your lifts.</p>
 <p><b>Dose.</b> Before training, static holds stay at 30 seconds or less per muscle inside a dynamic warm-up, which has little to no effect on strength or power. Flexibility gains level off at about 4 minutes per session and 10 minutes per area per week. Strength training builds range about as well as stretching does, and unlike stretching it reduces injuries.</p>
 <p><b>Rebuild programs</b> follow the method in <i>Rebuilding Milo</i>: find what triggers the pain, classify it by movement rather than by scan, calm it down, then rebuild in stages. Tendons get heavy isometric holds first, then heavy slow resistance (4 sets of 15 down to 4 sets of 6 at a 3-1-3 tempo over several weeks), then springy work. Back programs use McGill's Big Three with walking.</p>
 <p><b>Pain rules.</b> Pain up to 3/10 during a session is fine if it settles by the next morning. Above 5/10, or a test movement that's 2 or more points worse the next day, means back off. These rules come from the pain-monitoring model used in tendon research.</p>
 <p class="muted">Range isn't a diagnosis. See a physiotherapist if pain is severe, getting worse, or not improving after 3 weeks.</p>
 <span class="eyebrow">Sources</span>
 <ul class="src">

function testScores(ans){const sum={},wt={},lean={},side={},sc={};
  TEST.forEach(q=>{const r=ans[q.id+"R"],l=ans[q.id+"L"],v=q.uni?(r==null||l==null?null:Math.min(tScore(q,r),tScore(q,l))):tScore(q,ans[q.id]);if(v==null)return;

  AREAS.forEach(({k})=>{sc[k]=wt[k]?Math.round(sum[k]/wt[k]):50;side[k]=lean[k]>0?"R":lean[k]<0?"L":""});

/* ================= backup to your GitHub repository =================
   After changes, Range saves your data (encrypted with your passphrase, the same RANGE_SYNC_KEY as the
   SugarWOD sync) to backup/range-backup.enc in your Range repository. On a new phone, a new app address or
   after anything wipes the browser's storage, connect once and restore. The token stays on this device. */
const BK_PATH="backup/range-backup.enc";
async function sealBox(obj,pass){
  const enc=new TextEncoder(),salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt"]);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,enc.encode(JSON.stringify(obj))));
  const b=u=>{let s="";for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
  return{format:"range-sealed/1",iter:250000,salt:b(salt),iv:b(iv),ct:b(ct)};
}
async function ghFile(cfg,method,body){
  const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${BK_PATH}`,{method,cache:"no-store",headers:{Authorization:"Bearer "+cfg.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  if(method==="GET"&&r.status===404)return null;
  if(r.status===401)throw new Error("GitHub didn't accept the token. Create a new one (see the steps) and paste it again.");
  if(r.status===403||r.status===404)throw new Error("The token can't reach that repository. Check the name (username/repo) and that the token has Contents: Read and write for it.");
  if(!r.ok)throw new Error("GitHub said "+r.status+". Try again in a minute.");
  return r.json();
}
async function backupNow(){
  if(!BK||API)return;
  const data={...S};if(data.sync)data.sync={...data.sync,key:undefined}; // the passphrase itself isn't stored
  const box=await sealBox({format:"range-backup/1",at:Date.now(),data},BK.pass);
  const cur=await ghFile(BK,"GET");
  await ghFile(BK,"PUT",{message:"Range backup",content:btoa(JSON.stringify(box)),...(cur&&cur.sha?{sha:cur.sha}:{})});
  bkDirty=false;BK={...BK,last:Date.now(),err:""};try{localStorage.setItem("range-backup-cfg",JSON.stringify(BK))}catch(e){}
}
async function readBackup(cfg){
  const f=await ghFile(cfg,"GET");if(!f)return null;
  const box=JSON.parse(atob(String(f.content||"").replace(/\s/g,"")));
  let o;try{o=await unsealBox(box,cfg.pass)}catch(e){throw new Error("The passphrase doesn't open this backup. Use the passphrase you backed up with.")}
  return o;
}
function bkFail(e){if(!BK)return;BK={...BK,err:String(e&&e.message||e)};try{localStorage.setItem("range-backup-cfg",JSON.stringify(BK))}catch(_){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&BK&&bkDirty){clearTimeout(bkTimer);backupNow().catch(bkFail)}});

function sbNice(e){const m=String(e&&(e.message||e.error_description||e.msg)||e||""),st=e&&e.status;
  if(/user_data|schema cache/i.test(m))return"You're signed in, but the account storage isn't set up yet. Try again in a minute.";
  if(/rate limit|too many|over_email_send_rate|429/i.test(m)||st===429)return/sign ?up|signup/i.test(m)||/email/i.test(m)?"Too many sign-ups right now. Please try again in an hour.":"Too many tries right now. Please wait a few minutes and try again.";
  if(/invalid login|invalid credentials/i.test(m))return"Wrong email or password.";
  if(/not confirmed|confirm/i.test(m))return"Confirm your email first: open the link we sent you.";
  if(/already (registered|exists)|user already/i.test(m))return"There's already an account with this email. Sign in instead, or use Forgot password.";
  if(/email.*(invalid|not valid|valid email)|invalid.*email|unable to validate email|email_address_invalid/i.test(m))return"Please use a real email address.";
  if(/password/i.test(m)&&/(weak|short|at least|characters)/i.test(m))return"Choose a longer password: at least 8 characters, not a common one.";
  if(/same password|different from the old/i.test(m))return"Pick a password you haven't used here before.";
  if(/expired|invalid.*(token|link)|otp/i.test(m))return"That link has expired. Ask for a new one with Forgot password.";
  if(/failed to fetch|network|load failed|timeout|offline/i.test(m))return"Couldn't reach the server. Check your connection and try again.";
  if(/signups? not allowed|disabled/i.test(m))return"New accounts are paused right now. Please try again later.";
  return"Something went wrong. Please try again in a minute."}
