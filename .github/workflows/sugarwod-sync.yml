# Deploys the app, and every hour refreshes the gym's public workout feed (wod.json). No login, no API key,
# no secrets: the programme is the same public feed the gym's own website embed reads.
# (The old version logged in to SugarWOD with a password and published an encrypted file; that is gone.)
name: Workout feed

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["backup/**"]   # the app's data backups don't need a new deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  feed-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: pages
        uses: actions/configure-pages@v5

      - name: Keep the previous feed (used if SugarWOD doesn't answer)
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/wod.json" -o site/wod.json || echo "No previous feed yet"

      - name: Read the gym's public workouts
        continue-on-error: true
        run: node wod-feed/fetch.mjs site/wod.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
